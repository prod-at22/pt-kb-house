/* =========================================================================
   ARBA DESTINATION KB — SHARED STYLE (DO NOT EDIT PER DESTINATION)

:root{
  color-scheme: light;
  --ink:#1c1c1c; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --soft:#f7f7f7;
  --green:#c8172b; --green2:#e23744; --greend:#a01223; --greensoft:#fdebed;
  --halal:#0a7d63; --star:#c8172b;
  --sea1:#0e5c53; --sea2:#0a7d63;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.11);

}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;

.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}

.logo{white-space:nowrap;display:flex;align-items:center;gap:12px;text-decoration:none}
.brandmark{display:inline-flex;flex-direction:column;align-items:center;line-height:.85;color:var(--green);font-weight:800}

.kbtag{font-size:12.5px;color:var(--muted);font-weight:700;border-left:1px solid var(--line);padding-left:12px}

.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:22px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}

.hero .in{position:relative;color:#fff;padding:46px 22px;width:100%;max-width:640px}
.kicker{font-size:11.5px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9;margin-bottom:14px}

.bigsearch{position:relative;background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(0,0,0,.24);display:flex;align-items:center;padding:6px 6px 6px 20px;max-width:560px;margin:0 auto}

.topicbar{position:sticky;top:53px;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding:2px 0}

.tab:hover{color:var(--green)}

.infosub{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
button.tcard{font:inherit;text-align:left;width:100%;cursor:pointer}
#attractionview{margin-top:18px}
.backbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);margin:2px 0 14px}

.pkgnote{background:#fff7e6;border:1px solid #f0e0b8;color:#7a5b12;border-radius:12px;padding:11px 14px;margin:14px 0 4px;font-size:13px}

.shead{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 4px}

.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.tcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.16s}
.tcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.tcard .im{position:relative;height:160px;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center}
.tcard .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tcard .im .emoji{font-size:46px;opacity:.92;z-index:0}
.tcard .chip{position:absolute;left:11px;top:11px;z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.heart{position:absolute;right:10px;top:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  border:none;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);color:#333}
.heart.on{color:#e0245e}
.tcard .body{padding:13px 14px 15px}

.tcard .cta{margin-top:11px;display:inline-block;background:#fff;border:1.5px solid var(--ink);color:var(--ink);
  font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;transition:.14s}
.tcard:hover .cta{background:var(--ink);color:#fff}
section.block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

section.block .subtitle{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 12px}
.status{font-size:12.5px;color:var(--muted);margin:12px 0;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#c9ced9;display:inline-block}
.dot.live{background:var(--halal)}.dot.loading{background:#eab308;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
ul.klist{list-style:none;padding:0;margin:8px 0}
ul.klist li{position:relative;padding:8px 0 8px 24px;border-bottom:1px solid var(--soft);font-size:14px}
ul.klist li:last-child{border-bottom:none}
ul.klist li:before{content:"\2713";position:absolute;left:2px;top:7px;color:var(--green);font-weight:800}
table.kb{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}

details.qa{border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff;overflow:hidden}

.ans{padding:2px 16px 15px 42px;font-size:14px;color:#333}
.ans p{margin:6px 0}.ans strong{color:var(--ink)}
.ans ul,.ans ol{margin:6px 0;padding-left:20px}.ans li{margin:3px 0}
mark{background:#fff3ba;padding:0 2px;border-radius:3px}
.badge-halal{display:inline-block;background:#eaf7f0;color:var(--halal);border:1px solid #c7ebda;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.noresult{text-align:center;color:var(--muted);padding:30px;display:none}

.hidden{display:none!important}

.notebox{background:var(--greensoft);border:1px solid #f4c9cf;border-radius:12px;padding:11px 14px;font-size:12.8px;color:#4a2b2f;margin:2px 0 14px}

.hotels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 8px}

.hcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}

.actcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

.cmp td{border:2px solid #fff;padding:9px 12px;vertical-align:middle}

.cmp td.val{background:#fbf6e6;text-align:center;font-weight:800;color:#3d3d3d}

.actim img{width:100%;height:100%;object-fit:cover;display:block}

/* --- baseline patches --- */

/* ---- Simple Calculator ---- */
.calcblk{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 15px 15px}
.calcblk h3{margin:0 0 10px;font-size:13.5px;color:var(--greend);text-transform:uppercase;letter-spacing:.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.cgrid2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.fld .fl{font-weight:600}
.fld .fh{font-size:11px;color:var(--muted)}
.calcblk input[type=text],.calcblk input[type=number],.calcblk input[type=date],
.calcblk textarea,.calcblk select{
  font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);width:100%}
.calcblk select{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:28px}
.calcblk textarea{resize:vertical}
.calcblk input:focus,.calcblk textarea:focus,.calcblk select:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.cbx{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;font-size:12.5px;cursor:pointer}
.cbx input{margin-top:2px;accent-color:var(--green);width:15px;height:15px;flex:0 0 auto}
.calctbl input.qin{width:74px;padding:5px 6px;font-size:12.5px;text-align:right}
.calctbl input.tin{width:100%;padding:5px 6px;font-size:12.5px}
.calctbl td{vertical-align:middle}
.tr-sum,.cu-sum{font-weight:700;white-space:nowrap}
.calcnote{font-size:11.5px;color:var(--muted);margin:8px 2px 10px}

/* ---- panel boleh-buka (Quick mode) ---- */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 9px;overflow:hidden}
.panel>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;cursor:pointer;
  list-style:none;font-size:13px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .tw{color:var(--green);font-size:10px;transition:transform .15s}
.panel[open]>summary .tw{transform:rotate(90deg)}

.dacts{display:flex;gap:4px;flex:0 0 auto}

Pemandangan bandar waktu malam","Restoran & kafe"],"best":"Lewat petang Day 2 untuk sunset & city lights.","muslim":"Surau di kompleks Heha. Restoran dengan pilihan halal.","map":"https://www.google.com/maps/search/?api=1&query=Heha+Sky+View"},{"n":"Malioboro Street","t":"Shopping · City","emoji":"🛍️","img":"Malioboro Street, Yogyakarta.JPG","short":"Jalan shopping ikonik Jogja — hotel dalam 1km / 15 min.","intro":"Day 1 & Day 3. Nadi bandar Jogja: batik, ole-ole, kraf, street food & Pasar Beringharjo. Hotel pakej terletak dalam jarak berjalan kaki.","hi":["Batik & ole-ole khas Jogja","Pasar Beringharjo","Street food & kopi Jogja","Horse carriage (add-on RM70)"],"best":"Petang/malam untuk suasana. Buka 24 jam (kedai utama ~10 AM–9 PM).","muslim":"Masjid & surau berlimpah sepanjang Malioboro (termasuk Masjid Gedhe Kauman berdekatan). Street food halal senang dicari.","map":"https://www.google.com/maps/search/?api=1&query=Malioboro+Street+Yogyakarta"}],"hotels":[{"tier":"3 Bintang (default)","name":"Emersia Hotel / Luxury Hotel atau setaraf","note":"City Centre, dalam 1 km / 15 minit jalan kaki ke Malioboro. 2 pax twin sharing; 3 pax triple dengan extra bed. Peak season RM 120/pax/malam.","emoji":"🏨"},{"tier":"4 Bintang (upgrade)","name":"The 101 Yogyakarta Tugu Hotel atau setaraf","note":"Upgrade RM 100/pax/malam (Ahad–Khamis), RM 120/pax/malam (Jumaat–Sabtu). 3 pax triple dengan proper bed. Peak season RM 180/pax/malam.","emoji":"🏨"},{"tier":"Single Occupancy","name":"Single Supplement (mana-mana tier)","note":"RM 550/pax untuk bilik single, seluruh trip.","emoji":"🛏"}],"actGroups":[],"blocks":{"map":"<h2>Travel Map</h2><div class='mapcard'><div class='maptitle'>PT Jogjakarta 4H3M &mdash; Peta Laluan</div><img src='data:image/webp;base64,UklGRtyhAABXRUJQVlA4INChAADwbQKdASqAAokDPp1Kn0wlpCMiJFRaqLATiWNu/FwiBMQzALe7D/8f+O77eNfaf8D/C+oRyH4c/M/JXxEf2f+Z4re//9Dzceiv0b+V/zM/3n7Uf3f4a/1X/U+w1/U/615537Re9v++/+f8jPgd/S/8z+23u9/9L9kPep/cf9P+2PwAf1X/Q/+D/xe9x6rn+K/6X/09wf+i/7L/ <td class='it'>Merapi + Hobbit Jeep Lava Tour</td><td class='add'>RM 250 /jeep</td><td>Day 4 (sudah dalam pakej) &middot; 4 pax/jeep &middot; tolak RM 150/jeep jika dibuang</td></tr></tbody></table></div><p class='custnote'>Harga add-on untuk kanak-kanak: 60% daripada harga adult (sumber: Product FAQ Notion &mdash; tiada dalam katalog V3). Semua entrance fee dan harga aktiviti sudah termasuk service charge dan perbezaan tukaran mata wang, jadi boleh berbeza daripada local rate Indonesia. Add-on boleh dibayar di Jogja &mdash; minta Tour Guide assist. Item yang ditanda <i>sudah dalam pakej</i> hanya relevan bila customer mahu <b>membuang</b> aktiviti itu daripada itinerari &mdash; gunakan harga tolak.</p><div class='custblk'><h3>Special Occasion</h3><table class='ctbl'><thead><tr><th>Item</th><th>Harga</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Honeymoon Decoration</td><td class='add'>RM 250</td><td>Cake + flower + card</td></tr><tr><td class='it'>Candle Light Dinner (2 pax)</td><td class='add'>RM 200</td><td>Romantic add-on</td></tr></tbody></table></div><p class='custnote'>Sumber: rate card ARBA &mdash; item ini tiada dalam katalog V3. Extension Bromo (3D2N, perlu flight Surabaya) atau Bali (pakej berasingan): bincang dengan Travel Consultant.</p><h2 style='margin-top:30px'>Rate Card Operasi</h2><p class='ssub'>Kadar operasi PT Jogjakarta (rate card PO, 3 September 2026). Inilah sumber kadar untuk tab <b>Simple Calculator</b>. Kadar transport ialah <b>per kenderaan (per transport) per hari</b>, bukan per pax &mdash; kalkulator pilih kelas kenderaan ikut bilangan pax dan buat pembahagian ini automatik. Lajur <b>tolak</b> ialah jumlah yang dipotong daripada harga katalog bila item itu dibuang daripada itinerari.</p><div class='custblk'><h3>Transport + Driver</h3><table class='ctbl'><thead><tr><th>Tour</th><th>Avanza / APV<br>2&ndash;4 pax</th><th>tolak</th><th>Innova<br>5&ndash;6 pax</th><th>tolak</th><th>Hiace<br>7&ndash;12 pax</th><th>tolak</th><th>Hiace VVIP<br>7&ndash;8 pax</th><th>tolak</th></tr></thead><tbody><tr><td class='it'>Full Day Tour (12 jam)</td><td class='add'>RM 250</td><td class='ded'>&minus;RM 150</td><td class='add'>RM 300</td><td class='ded'>&minus;RM 200</td><td class='add'>RM 500</td><td class='ded'>&minus;RM 300</td><td class='add'>RM 950</td><td class='ded'>&minus;RM 600</td></tr><tr><td class='it'>Half Day Tour (5&ndash;6 jam)</td><td class='add'>RM 160</td><td class='ded'>&minus;RM 100</td><td class='add'>RM 250</td><td class='ded'>&minus;RM 150</td><td class='add'>RM 400</td><td class='ded'>&minus;RM 300</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>Airport Transfer + Half Day Tour (6 jam)</td><td class='add'>RM 250</td><td class='ded'>&minus;RM 150</td><td class='add'>RM 300</td><td class='ded'>&minus;RM 200</td><td class='add'>RM 500</td><td class='ded'>&minus;RM 300</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>Airport Transfer sahaja</td><td class='add'>RM 160</td><td class='ded'>&minus;RM 100</td><td class='add'>RM 250</td><td class='ded'>&minus;RM 150</td><td class='add'>RM 400</td><td class='ded'>&minus;RM 300</td><td>&mdash;</td><td>&mdash;</td></tr></tbody></table></div><p class='custnote'>Hiace VVIP hanya 8-seater dan hanya tersedia untuk Full Day Tour. Rate card berhenti di Hiace 7&ndash;12 pax, tetapi katalog ada tier harga sehingga 11&ndash;15 pax &mdash; <b>13 pax ke atas tiada kadar transport tersiar</b>. Kalkulator akan tanda cip merah <i>kadar?</i> untuk band itu; minta sebut harga operasi. Kadar untuk destinasi luar bandar Jogja (Dieng, Kebumen, Nepal van Java) juga belum tersiar &mdash; sama-sama ditanda sebagai gap.</p><div class='custblk'><h3>Accommodation &mdash; malam tambah / tolak</h3><table class='ctbl'><thead><tr><th>Tier</th><th>Hotel</th><th>Tambah 1 malam<br>(normal)</th><th>Tambah 1 malam<br>(peak)</th><th>Tolak 1 malam<br>(normal)</th><th>Tolak 1 malam<br>(peak)</th></tr></thead><tbody><tr><td class='it'>3 Bintang</td><td>Luxury Malioboro</td><td class='add'>RM 150 /pax/malam</td><td class='add'>RM 250 /pax/malam</td><td class='ded'>&minus;RM 80</td><td class='ded'>&minus;RM 80</td></tr><tr><td class='it'>3 Bintang</td><td>Emersia Hotel</td><td class='add'>RM 150 /pax/malam</td><td class='add'>RM 250 /pax/malam</td><td class='ded'>&minus;RM 80</td><td class='ded'>&minus;RM 80</td></tr><tr><td class='it'>4 Bintang</td><td>The 101 Yogyakarta Tugu</td><td class='add'>RM 180 /pax/malam</td><td class='add'>RM 350 /pax/malam</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>4 Bintang</td><td>Grand Zuri Malioboro</td><td class='add'>RM 180 /pax/malam</td><td class='add'>RM 350 /pax/malam</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>3 Bintang &mdash; kawasan Dieng (luar bandar Jogja)</td><td>Villa Pintu Langit</td><td class='add'>RM 200 /pax/malam</td><td class='add'>RM 350 /pax/malam</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>Glamping Nepal van Java (luar bandar Jogja)</td><td>Trianggulasi Hotel</td><td class='add'>RM 150 /pax/malam</td><td class='add'>RM 250 /pax/malam</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>Glamping Nepal van Java (luar bandar Jogja)</td><td>Linggar Jati Hotel</td><td class='add'>RM 150 /pax/malam</td><td class='add'>RM 250 /pax/malam</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td class='it'>3 Bintang &mdash; Kebumen (luar bandar Jogja)</td><td>Hotel Kebumen Maxolie</td><td class='add'>RM 210 /pax/malam</td><td class='add'>RM 350 /pax/malam</td><td>&mdash;</td><td>&mdash;</td></tr></tbody></table></div><p class='custnote'>Kadar per pax per malam, 2&ndash;3 orang sebilik. Hanya hotel 3 Bintang ada kadar <b>tolak</b> malam (RM 80/pax/malam, normal dan peak sama) &mdash; tier lain belum tersiar. Peak season ikut senarai tarikh dalam tab Surcharge. Villa Pintu Langit (Dieng), Trianggulasi &amp; Linggar Jati (glamping Nepal van Java, Magelang) dan Hotel Kebumen Maxolie berada <b>di luar bandar Jogja</b> &mdash; guna hanya untuk itinerari extension, dan sahkan kadar transport dengan operasi.</p><div class='custblk'><h3>Meals</h3><table class='ctbl'><thead><tr><th>Hidangan</th><th>Tambah 1 meal</th><th>Tolak 1 meal</th></tr></thead><tbody><tr><td class='it'>Breakfast</td><td>Cadang makan di hotel</td><td>&mdash;</td></tr><tr><td class='it'>Lunch</td><td class='add'>RM 30 /pax</td><td class='ded'>&minus;RM 20 /pax</td></tr><tr><td class='it'>Dinner</td><td class='add'>RM 30 /pax</td><td class='ded'>&minus;RM 20 /pax</td></tr></tbody></table></div><p class='custnote'>Breakfast sudah termasuk dalam kadar hotel &mdash; tiada harga tambah atau tolak berasingan. Lunch dan dinner: tambah RM 30/pax setiap hidangan, tolak RM 20/pax setiap hidangan yang dibuang daripada pakej (pakej asal 3B / 3L / 3D).</p><div class='custblk'><h3>Entrance &amp; Activity</h3><table class='ctbl'><thead><tr><th>Item</th><th>Harga tambah</th><th>Harga tolak</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Borobudur Ground Area</td><td class='add'>RM 150 /pax</td><td>&mdash;</td><td></td></tr><tr><td class='it'>Borobudur Temple / Hill Area (Guided Tour)</td><td class='add'>RM 185 /pax</td><td>&mdash;</td><td></td></tr><tr><td class='it'>Goa Pindul &amp; Cave Tubing</td><td class='add'>RM 100 /pax</td><td>&mdash;</td><td></td></tr><tr><td class='it'>Gamplong Studio Alam</td><td class='add'>RM 25 /pax</td><td>&mdash;</td><td></td></tr><tr><td class='it'>Obelix Sea View</td><td class='add'>RM 20 /pax</td><td class='ded'>&minus;RM 10 /pax</td><td></td></tr><tr><td class='it'>Pine Forest</td><td class='add'>RM 25 /pax</td><td class='ded'>&minus;RM 10 /pax</td><td></td></tr><tr><td class='it'>Jeep Timang Beach</td><td class='add'>RM 160 /jeep</td><td class='ded'>&minus;RM 100 /jeep</td><td>1 jeep muat 4 pax</td></tr><tr><td class='it'>Gondola Timang Beach</td><td class='add'>RM 80 /pax</td><td class='ded'>&minus;RM 50 /pax</td><td></td></tr><tr><td class='it'>Jambatan Timang Beach</td><td class='add'>RM 50 /pax</td><td class='ded'>&minus;RM 30 /pax</td><td></td></tr><tr><td class='it'>Merapi + Hobbit Jeep</td><td class='add'>RM 250 /jeep</td><td class='ded'>&minus;RM 150 /jeep</td><td>1 jeep muat 4 pax</td></tr></tbody></table></div><p class='custnote'>Jeep Timang Beach dan Merapi + Hobbit Jeep <b>sudah termasuk</b> dalam harga katalog &mdash; lajur tambah hanya dipakai untuk jeep tambahan (contoh 5&ndash;8 pax perlu 2 jeep), lajur tolak dipakai bila aktiviti itu dibuang. Keputusan PO 3 Sep 2026: lajur tolak Gondola (RM 50) dan Jambatan (RM 30) ditulis <i>/Jeep</i> dalam rate card &mdash; itu salah taip, dibaca sebagai <b>per pax</b> sepadan dengan lajur tambah.</p>","calc":"<h2>Simple Calculator</h2><p class='ssub'>Isi pax dan tarikh &mdash; peak season dan late booking RM 50 dikira sendiri. Pakej asal <b>3 Bintang</b>; untuk 4 Bintang tukar pilihan Accommodation pada setiap malam. Transport ikut kelas kenderaan: 2&ndash;4 pax Avanza/APV, 5&ndash;6 pax Innova, 7&ndash;12 pax Hiace; kadar per kenderaan per hari ikut tempoh tour yang dipilih pada baris hari. Upgrade 4 Bintang bergantung pada hari dalam minggu dan musim &mdash; pilih <i>Ahad&ndash;Khamis</i> (RM 100) atau <i>Jumaat&ndash;Sabtu</i> (RM 120) ikut tarikh yang dipapar pada baris hari, dan versi <i>PEAK</i> (RM 160 / RM 180) untuk malam yang jatuh dalam tetingkap peak season.</p><div class='custblk calcblk'><h3>Detail customer</h3><div class='cgrid'><label class='fld'><span class='fl'>Nama customer</span><input id='c_name' type='text' placeholder='Nama penuh customer'></label><label class='fld'><span class='fl'>Departure date</span><input id='c_dep' type='date'><span class='fh'>Hari 1 trip</span></label><label class='fld'><span class='fl'>Return date</span><input id='c_ret' type='date'><span class='fh'>Hari terakhir &mdash; tentukan panjang trip</span></label><label class='fld'><span class='fl'>Adult (12 tahun ke atas)</span><input id='c_adult' type='number' min='0' value='2'></label><label class='fld'><span class='fl'>Child With Bed (6&ndash;11)</span><input id='c_cwb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Child No Bed (2&ndash;5)</span><input id='c_cnb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Infant (bawah 2)</span><input id='c_inf' type='number' min='0' value='0'><span class='fh'>Bawah 2 tahun FOC</span></label><label class='fld'><span class='fl'>Bilik single</span><input id='c_single' type='number' min='0' value='0'><span class='fh'>+RM 550 setiap satu</span></label></div><p class='calcnote' id='c_tier'></p></div><details class='panel' id='p_itin'><summary><span class='tw'>&#9654;</span><span class='pt'>Ubah itinerary</span><span class='psum' id='p_itin_s'></span></summary><div class='pbody'><div class='dbar'><span id='c_bar'></span><button type='button' id='c_expand' class='cbtn cbtn3'>Buka semua</button></div><div id='c_days'></div><div class='cbtns'><button type='button' id='c_addday' class='cbtn'>+ Tambah Hari</button><button type='button' id='c_reload' class='cbtn cbtn2'>Muat semula itinerary asal</button></div><p class='calcnote'>Seret baris hari (&#10303;) untuk susun semula &mdash; nombor hari dan tarikh berubah sendiri. Tambah atau buang hari akan laraskan <b>return date</b>. Pilihan bertanda <i>Termasuk pakej</i> tidak menambah kos.</p></div></details><div class='custblk calcblk'><h3>Ringkasan quotation</h3><table class='ctbl calctbl'><thead><tr><th>Item</th><th>Bil.</th><th>Harga seunit (RM)</th><th>Jumlah (RM)</th></tr></thead><tbody id='c_lines'></tbody></table><div class='ctot'><div><span class='ctl'>Grand Total</span><span class='ctv' id='c_grand'>RM 0</span></div><div><span class='ctl'>Per pax (final, semua kos)</span><span class='ctv' id='c_perpax'>RM 0</span></div><div><span class='ctl'>Deposit</span><span class='ctv' id='c_dep_amt'>RM 0</span></div></div><div class='cbtns'><button type='button' id='c_pdf' class='cbtn'>Jana Quotation PDF</button><button type='button' id='c_reset' class='cbtn cbtn2'>Reset semua</button></div><p class='calcnote'>Quotation dibuka dalam <b>tab baharu</b> mengikut format rasmi ARBA &mdash; dari situ tekan <b>Muat turun PDF</b> untuk simpan fail.</p></div>","surcharge":"<h2>Surcharge</h2><div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Bila</th></tr></thead><tbody><tr><td class='it'>Single Supplement</td><td class='add'>RM 550 /pax</td><td>Bilik single occupancy, seluruh trip, mana-mana tier</td></tr><tr><td class='it'>Upgrade 4 Bintang (Ahad&ndash;Khamis)</td><td class='add'>RM 100 /pax/malam</td><td>The 101 Yogyakarta Tugu atau setaraf</td></tr><tr><td class='it'>Upgrade 4 Bintang (Jumaat&ndash;Sabtu)</td><td class='add'>RM 120 /pax/malam</td><td>The 101 Yogyakarta Tugu atau setaraf</td></tr><tr><td class='it'>Peak Season &mdash; 3 Bintang</td><td class='add'>RM 120 /pax/malam</td><td>Tarikh peak (senarai di bawah)</td></tr><tr><td class='it'>Peak Season &mdash; 4 Bintang</td><td class='add'>RM 180 /pax/malam</td><td>Tarikh peak (senarai di bawah)</td></tr><tr><td class='it'>Late Booking</td><td class='add'>RM 50 /booking</td><td>Booking kurang 45 hari sebelum tarikh berlepas</td></tr></tbody></table></div><div class='custblk'><h3>Tarikh Peak Season</h3><table class='ctbl'><thead><tr><th>Blok</th><th>Tarikh</th></tr></thead><tbody><tr><td class='it'>1</td><td>15 &ndash; 30 Mac 2026</td></tr><tr><td class='it'>2</td><td>25 Mei &ndash; 5 Jun 2026</td></tr><tr><td class='it'>3</td><td>20 Dis 2026 &ndash; 5 Jan 2027</td></tr><tr><td class='it'>4</td><td>5 &ndash; 25 Feb 2027</td></tr><tr><td class='it'>5</td><td>5 Mac &ndash; 15 Apr 2027</td></tr></tbody></table><p class='custnote'>Surcharge peak season dikira per pax per malam dan ditambah di atas harga pakej. Sumber: katalog PT Jogja 4D3N 2026 V3 dan 2026/2027 Date Surcharge.</p></div>","transport":"<h2>Transportation &amp; Guide</h2><p class='ssub' style='margin:0 0 10px'>Private transport &mdash; <b>unlimited sampai tengah malam</b>, semua berhawa dingin. Driving Guide (Malay / English) merangkap driver tempatan.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Bilangan pax</th><th>Kenderaan</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>2&ndash;4</td><td>Avanza / Innova</td><td>Minivan</td></tr><tr><td class='it'>5&ndash;6</td><td>Innova (extended)</td><td>Minivan besar</td></tr><tr><td class='it'>7&ndash;13</td><td>Hiace</td><td>Van</td></tr><tr><td class='it'>14 dan ke atas</td><td>Bus</td><td>Coach</td></tr></tbody></table><p class='custnote'>Timang Beach menggunakan Jeep khas (maks 4 pax/jeep) melalui laluan gravel yang bumpy. Jeep Timang Beach dan Jeep Merapi Lava Tour sudah termasuk dalam pakej. Wakil ARBA atau Tour Leader boleh diatur upon request.</p></div>","stay":"<h2>Accommodation</h2><p class='ssub' style='margin:0 0 10px'>Satu pakej, dua pilihan hotel di City Centre (dalam 1 km / 15 minit jalan kaki ke Malioboro). Default 3 Bintang; upgrade 4 Bintang The 101 Yogyakarta Tugu. Kawasan Muslim-majority &mdash; surau, masjid dan makanan halal berlimpah.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Perkara</th><th>Butiran</th></tr></thead><tbody><tr><td class='it'>2 pax</td><td>Twin sharing</td></tr><tr><td class='it'>3 pax &mdash; 3 Bintang</td><td>Triple sharing dengan extra bed</td></tr><tr><td class='it'>3 pax &mdash; 4 Bintang</td><td>Triple sharing dengan proper bed</td></tr><tr><td class='it'>4 pax</td><td>2 bilik</td></tr><tr><td class='it'>Single occupancy</td><td>Single Supplement RM 550 /pax</td></tr><tr><td class='it'>Connecting room</td><td>Tersedia di Emersia Malioboro &mdash; perlu request semasa booking (subject to availability)</td></tr></tbody></table><p class='custnote'>Nama hotel muktamad dimaklumkan 14 hari sebelum trip. Connecting room: sumber Product FAQ Notion &mdash; tiada dalam katalog V3.</p></div>","food":"<h2>Halal &amp; Makanan</h2><p class='ssub' style='margin:0 0 10px'>Full Board disediakan dalam pakej: <b>3&times; Breakfast + 3&times; Lunch + 3&times; Dinner</b>, masakan Indonesia tempatan yang halal. Jogjakarta kawasan Muslim-majority &mdash; hampir semua restoran halal atau halal-friendly.</p><div class='custblk'><h3>Senarai Restoran Rujukan</h3><table class='ctbl'><thead><tr><th>Restoran</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Rumah Makan Bu Hartin</td><td>Masakan Jawa tempatan, sesuai group</td></tr><tr><td class='it'>Lombok Ijo</td><td>Masakan Jawa, ada menu pedas</td></tr><tr><td class='it'>Pawon Segar</td><td>Masakan Indonesia, set group</td></tr><tr><td class='it'>Bale Bebakaran</td><td>Menu bakar / grill</td></tr><tr><td class='it'>Pondok Cabe</td><td>Masakan Indonesia tempatan</td></tr></tbody></table><p class='custnote'>Sumber: Product FAQ Notion (view jog) &mdash; tiada dalam katalog V3. Restoran muktamad ditentukan operator mengikut laluan harian.</p></div><div class='custblk'><h3>Hidangan Wajib Cuba</h3><table class='ctbl'><thead><tr><th>Hidangan</th><th>Butiran</th></tr></thead><tbody><tr><td class='it'>Nasi Gudeg</td><td>Signature Jogja &mdash; nangka muda dimasak manis dengan ayam &amp; telur</td></tr><tr><td class='it'>Ayam Goreng Kalasan</td><td>Ayam goreng rempah khas kawasan Kalasan</td></tr><tr><td class='it'>Sate Klatak</td><td>Sate kambing dibakar dengan lidi besi</td></tr><tr><td class='it'>Soto Jogja</td><td>Sup ayam ringan, sesuai untuk kanak-kanak &amp; warga emas</td></tr><tr><td class='it'>Bakpia Pathok</td><td>Ole-ole wajib &mdash; kuih isi kacang hijau</td></tr></tbody></table><p class='custnote'>Restoran halal di Jogja tidak menggunakan arak dalam masakan. Keperluan diet khas (alahan, vegetarian, bubur untuk warga emas, makanan bayi) maklum kepada Travel Consultant semasa booking supaya operator boleh atur awal.</p></div>","prayer":"<h2>Solat</h2><p class='ssub' style='margin:0 0 10px'>Jogjakarta kawasan Muslim-majority &mdash; masjid dan surau tersedia di hotel dan hampir setiap attraction dalam itinerari.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Lokasi (hari)</th><th>Kemudahan solat</th></tr></thead><tbody><tr><td class='it'>Hotel City Centre</td><td>Surau hotel; masjid dalam radius jalan kaki di kawasan Malioboro</td></tr><tr><td class='it'>Malioboro Street (D1 &amp; D3)</td><td>Masjid dan surau sepanjang Malioboro, termasuk Masjid Gedhe Kauman</td></tr><tr><td class='it'>Obelix Sea View &amp; Gumuk Pasir (D1)</td><td>Surau di kompleks Obelix Sea View</td></tr><tr><td class='it'>Bukit Panguk (D2, waktu Subuh)</td><td>Kawasan viewpoint terbuka &mdash; bawa sejadah, solat Subuh di viewpoint</td></tr><tr><td class='it'>Hutan Pinus Mangunan (D2)</td><td>Surau di kawasan parkir</td></tr><tr><td class='it'>Timang Beach (D2)</td><td>Surau kecil di kawasan parkir</td></tr><tr><td class='it'>HeHa Sky View (D2)</td><td>Surau di kompleks</td></tr><tr><td class='it'>Kraton &amp; Taman Sari (D3)</td><td>Masjid Gedhe Kauman &mdash; masjid diraja bersebelahan Kraton, antara tertua di Jogja</td></tr><tr><td class='it'>Plaosan Temple / Borobudur (D3)</td><td>Surau di kampung sekitar Plaosan; surau di kompleks Borobudur</td></tr><tr><td class='it'>Merapi Lava Tour (D4)</td><td>Surau di base camp Jeep (Kaliurang / Kaliadem)</td></tr></tbody></table><p class='custnote'>Bawa sejadah dan telekung sendiri &mdash; memudahkan solat di viewpoint dan kawasan terbuka. Jamak dan qasar boleh dipraktikkan semasa perjalanan panjang antara kawasan (1 jam hingga 2 jam).</p></div>","flight":"<h2>Flight &amp; Airport</h2><p class='ssub' style='margin:0 0 10px'>KUL &harr; <b>Yogyakarta International Airport (YIA)</b>, direct, tempoh penerbangan lebih kurang 2 jam 45 minit. Tiket flight <b>tidak termasuk</b> dalam pakej. Suggested arrival Day 1 dan departure Day 4 = waktu tengah hari.</p><div class='custblk'><h3>Leg Pergi &mdash; KUL ke YIA</h3><table class='ctbl'><thead><tr><th>Airline</th><th>Flight</th><th>Berlepas KUL</th><th>Tiba YIA</th><th>Hari operasi</th><th>Jenis</th></tr></thead><tbody><tr><td class='it'>AirAsia</td><td>AK 346</td><td>9:40 AM</td><td>11:20 AM</td><td>Harian</td><td>Low Cost</td></tr><tr><td class='it'>AirAsia</td><td>AK 348</td><td>3:25 PM</td><td>lebih kurang 2 jam 45 minit selepas berlepas</td><td>Isnin, Rabu&ndash;Ahad</td><td>Low Cost</td></tr><tr><td class='it'>Malaysia Airlines</td><td>MH 857</td><td>7:10 AM</td><td>lebih kurang 2 jam 45 minit selepas berlepas</td><td>Selasa &amp; Sabtu</td><td>Full Service</td></tr></tbody></table></div><div class='custblk'><h3>Leg Balik &mdash; YIA ke KUL</h3><table class='ctbl'><thead><tr><th>Airline</th><th>Flight</th><th>Berlepas YIA</th><th>Tiba KUL</th><th>Hari operasi</th><th>Jenis</th></tr></thead><tbody><tr><td class='it'>AirAsia</td><td>AK 347</td><td>11:45 AM</td><td>3:15 PM</td><td>Harian</td><td>Low Cost</td></tr><tr><td class='it'>AirAsia</td><td>AK 349</td><td>5:30 PM</td><td>lebih kurang 2 jam 45 minit selepas berlepas</td><td>Isnin, Khamis&ndash;Ahad</td><td>Low Cost</td></tr><tr><td class='it'>Malaysia Airlines</td><td>MH 856</td><td>10:10 AM</td><td>lebih kurang 2 jam 45 minit selepas berlepas</td><td>Selasa &amp; Sabtu</td><td>Full Service</td></tr></tbody></table><p class='custnote'><b>Anggaran harga:</b> AirAsia RM 390 &ndash; RM 600 return/pax (sumber: Flight Recommendation ARBA). Malaysia Airlines premium &mdash; harga ikut kelas tempahan, tiada anggaran dalam Flight Recommendation. Pasangan biasa yang digunakan: <b>AK 346 pergi + AK 347 balik</b> (kedua-duanya harian). Waktu tiba AK 346 ikut Flight Recommendation ARBA; waktu AK 347 ikut jadual penerbangan semasa. Beza zon waktu: YIA UTC+7, KUL UTC+8 (KUL 1 jam ke depan).</p></div><div class='custblk'><h3>Bagasi &amp; Airport</h3><table class='ctbl'><thead><tr><th>Perkara</th><th>Butiran</th></tr></thead><tbody><tr><td class='it'>AirAsia</td><td>Hand carry 7 kg; check-in bagasi add-on (lebih murah dibeli online)</td></tr><tr><td class='it'>Malaysia Airlines</td><td>25 &ndash; 30 kg ikut kelas tempahan</td></tr><tr><td class='it'>Powerbank</td><td>Maksimum 100Wh (lebih kurang 20,000mAh), wajib hand carry &mdash; tidak boleh dalam check-in</td></tr><tr><td class='it'>Cecair</td><td>Melebihi 100ml wajib masuk check-in luggage</td></tr><tr><td class='it'>Pickup &amp; dropoff YIA</td><td>Termasuk dalam pakej (private transport)</td></tr></tbody></table><p class='custnote'>Semak validity trip dengan staff sebelum tempah connecting domestic flight di Indonesia.</p></div>","weather":"<h2>Cuaca &amp; Musim</h2><p class='ssub' style='margin:0 0 10px'>Iklim tropika, lebih kurang 24&deg;C &ndash; 32&deg;C. Pagi cool (24&deg;C), tengah hari panas (32&deg;C). Musim hujan November hingga April (hujan biasanya waktu petang).</p><div class='custblk'><table class='ctbl'><thead><tr><th>Tempoh</th><th>Keadaan &amp; kesesuaian</th></tr></thead><tbody><tr><td class='it'>Mei &ndash; Oktober</td><td class='add'>Musim kering &mdash; pagi cool, hujan minima. Terbaik untuk sunrise Bukit Panguk dan Jeep tour</td></tr><tr><td class='it'>Jun &ndash; Ogos</td><td>Cuti sekolah, peak family. Langit cerah, sesuai bawa anak</td></tr><tr><td class='it'>Oktober &ndash; November</td><td>Festival dan acara budaya Jawa</td></tr><tr><td class='it'>Disember &ndash; Januari</td><td>Musim hujan dan peak season &mdash; surcharge dikenakan</td></tr><tr><td class='it'>Mac &ndash; April</td><td>Musim hujan dan peak season &mdash; surcharge dikenakan</td></tr></tbody></table><p class='custnote'>Bulan terbaik: Jun, Julai, Ogos, September. Untuk elak orang ramai: Mei atau September. Bawa jaket nipis untuk pagi di Merapi dan Bukit Panguk, serta payung atau raincoat jika travel November &ndash; April.</p></div>","tips":"<h2>Shopping &amp; Tips</h2><p class='ssub' style='margin:0 0 10px'>Malioboro dan Pasar Beringharjo adalah pusat shopping utama, dalam 1 km dari hotel.</p><div class='custblk'><h3>Duit &amp; Pembayaran</h3><table class='ctbl'><thead><tr><th>Perkara</th><th>Cadangan</th></tr></thead><tbody><tr><td class='it'>Cash untuk dibawa</td><td class='add'>RM 1,000 &ndash; RM 1,500 /pax</td></tr><tr><td class='it'>Tukaran wang</td><td>Tukar RM ke IDR di money changer Jogja &mdash; rate biasanya lebih baik daripada KLIA</td></tr><tr><td class='it'>Kedai kecil &amp; pasar</td><td>Cash IDR lebih diutamakan (Malioboro, Beringharjo)</td></tr><tr><td class='it'>Mall, hotel, restoran besar</td><td>Terima kad; QRIS (GoPay / OVO) meluas</td></tr></tbody></table></div><div class='custblk'><h3>Beli Apa</h3><table class='ctbl'><thead><tr><th>Item</th><th>Di mana</th></tr></thead><tbody><tr><td class='it'>Batik</td><td>Batik Outlet (Day 2), Malioboro</td></tr><tr><td class='it'>Bakpia &amp; gudeg kaleng</td><td>Kedai ole-ole Malioboro, Bakpia Pathok</td></tr><tr><td class='it'>Kraf perak</td><td>Kotagede</td></tr><tr><td class='it'>Souvenir &amp; kraf tangan</td><td>Pasar Beringharjo, Malioboro</td></tr></tbody></table></div><div class='custblk'><h3>Praktikal</h3><table class='ctbl'><thead><tr><th>Perkara</th><th>Butiran</th></tr></thead><tbody><tr><td class='it'>Internet</td><td>Pocket Wifi RM 100 &ndash; 150/trip, eSIM Indonesia RM 30 &ndash; 50 untuk 7 hari, atau roaming. Wifi hotel percuma</td></tr><tr><td class='it'>Laundry</td><td>Laundry hotel RM 5 &ndash; 10/item; laundry kiloan tempatan RM 5 &ndash; 10/kg. Tidak termasuk pakej</td></tr><tr><td class='it'>Packing</td><td>Kasut selesa (banyak berjalan), baju ringan + jaket nipis, topi &amp; sunblock, sejadah / telekung, ubat peribadi, payung</td></tr><tr><td class='it'>Kuasa elektrik</td><td>Indonesia 230V, plug Type C / F &mdash; bawa adapter</td></tr></tbody></table><p class='custnote'>Sumber harga internet dan laundry: rate card ARBA &mdash; tiada dalam katalog V3.</p></div>","visa":"<h2>Visa &amp; Passport</h2><p class='ssub' style='margin:0 0 10px'>Rakyat Malaysia <b>tidak perlu visa</b> untuk Indonesia &mdash; visa-free 30 hari (perjanjian ASEAN).</p><div class='custblk'><table class='ctbl'><thead><tr><th>Perkara</th><th>Keperluan</th></tr></thead><tbody><tr><td class='it'>Visa</td><td class='add'>Tidak perlu &mdash; visa-free 30 hari untuk rakyat Malaysia</td></tr><tr><td class='it'>Passport</td><td>Sah minimum 6 bulan dari tarikh berlepas</td></tr><tr><td class='it'>All Indonesia Arrival Card</td><td class='add'>Wajib &mdash; isi online 2 hari sebelum berlepas di allindonesia.imigrasi.go.id, simpan QR Code</td></tr><tr><td class='it'>Tour Voucher</td><td>Softcopy memadai. Satu family boleh guna satu voucher</td></tr><tr><td class='it'>Insurance</td><td>Covernote insurance / Takaful (softcopy memadai) &mdash; disyorkan, tidak termasuk pakej</td></tr><tr><td class='it'>Kanak-kanak bawah 18</td><td>Passport sahaja memadai jika bersama parents. Photocopy surat beranak boleh disediakan standby</td></tr><tr><td class='it'>Bukan warga Malaysia</td><td>Customer uruskan visa sendiri mengikut kewarganegaraan</td></tr></tbody></table></div><div class='custblk'><h3>Cara Isi All Indonesia Arrival Card</h3><table class='ctbl'><thead><tr><th>Langkah</th><th>Tindakan</th></tr></thead><tbody><tr><td class='it'>1</td><td>Buka allindonesia.imigrasi.go.id, pilih <b>Arrival Card &mdash; Foreign Visitor</b></td></tr><tr><td class='it'>2</td><td>Tukar bahasa ke English di setting atas kanan (jika perlu)</td></tr><tr><td class='it'>3</td><td>Isi data passport (boleh tekan <b>Scan MRZ</b> untuk scan passport), nombor telefon &amp; email</td></tr><tr><td class='it'>4</td><td>Tekan <b>+ Add Traveller</b> untuk isi maklumat ahli keluarga</td></tr><tr><td class='it'>5</td><td>Masukkan tarikh ketibaan dan nombor flight</td></tr><tr><td class='it'>6</td><td>Isi alamat hotel dan tujuan lawatan</td></tr><tr><td class='it'>7</td><td>Jawab deklarasi barang dan kesihatan (ubat preskripsi: tanda Ya)</td></tr><tr><td class='it'>8</td><td>Submit dan simpan QR Code</td></tr><tr><td class='it'>9</td><td>Tekan <b>Apply Visa Exemption</b> &mdash; PDF dihantar ke email</td></tr><tr><td class='it'>10</td><td>Tunjuk QR Code di imigresen ketika tiba di YIA</td></tr></tbody></table><p class='custnote'>Ubat preskripsi (darah tinggi, kencing manis) perlu dibawa dengan surat doktor. Ubat OTC seperti panadol dan ubat selsema tidak perlu preskripsi. Sumber: FAQ Indonesia ARBA.</p></div>","freegift":"<h2>Free Gift (Promo)</h2><details class='qa' data-text='free gift untuk campaign atau promo? jogjakarta: free lobster lunch at pantai timang kod: fjog2 (all pax) bullet: brb luggage tag / pocket wifi 4g (per booking) *bullet wajib tanya po/leader disclaimer: sila sahkan dengan po jika di luar waktu promo'><summary><span class='tw'>&#9654;</span><span>Free Gift untuk campaign atau Promo?</span></summary><div class='ans'><p><strong>Jogjakarta:</strong> Free Lobster Lunch at Pantai Timang <span class='rtag'>Kod: FJOG2</span> (All pax)</p><p><strong>Bullet:</strong> BRB Luggage Tag / Pocket Wifi 4G (per booking)</p><p style='color:var(--greend)'>*Bullet wajib tanya PO/Leader</p><p style='color:var(--greend)'><strong>Disclaimer:</strong> Sila sahkan dengan PO jika di luar waktu Promo</p></div></details>","polisi":"<h2>Polisi &amp; Payment</h2><div class='custblk'><table class='ctbl'><thead><tr><th>Perkara</th><th>Polisi</th></tr></thead><tbody><tr><td class='it'>Validity quotation</td><td>Harga sah 24 jam selepas quotation dihantar</td></tr><tr><td class='it'>Deposit</td><td class='add'>RM 250 /pax semasa confirmation</td></tr><tr><td class='it'>Full payment</td><td class='add'>45 hari sebelum tarikh berlepas</td></tr><tr><td class='it'>Late booking</td><td>Booking kurang 45 hari sebelum berlepas: RM 50 /booking</td></tr><tr><td class='it'>Occupancy</td><td>Harga untuk 2 &ndash; 3 orang sebilik</td></tr><tr><td class='it'>Single Supplement</td><td>RM 550 /pax</td></tr><tr><td class='it'>Umur</td><td>Adult 12 tahun ke atas &middot; Child With Bed 6 &ndash; 11 &middot; Child No Bed 2 &ndash; 5 &middot; Infant bawah 2 FOC. Umur dikira ikut tarikh travel</td></tr><tr><td class='it'>Final itinerary &amp; hotel</td><td>Dimuktamadkan 14 hari sebelum trip</td></tr><tr><td class='it'>Arrival / Departure</td><td>Suggested arrival Day 1 dan departure Day 4 waktu tengah hari. Late arrival atau early departure tidak refundable untuk activities dan meals yang tertinggal</td></tr><tr><td class='it'>Connecting domestic flight</td><td>Semak validity trip dengan staff sebelum tempah connecting domestic flight di Indonesia</td></tr><tr><td class='it'>Perubahan</td><td>Itinerari, harga dan flight tertakluk kepada perubahan</td></tr><tr><td class='it'>Validity pakej</td><td class='add'>Sah untuk perjalanan hingga 31 Mac 2027</td></tr></tbody></table><p class='custnote'>Sumber: katalog PT Jogja 4D3N 2026 V3 &mdash; Important Notes, Deposit &amp; Full Payment.</p></div>"},"snapshot":"# PT Jogjakarta — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*PT Jogjakarta 4D3N — satu itinerari, dua pilihan hotel: 3★ Luxury (default) atau 4★ The 101 Yogyakarta Tugu (upgrade). Ground + Tipping, tidak termasuk flight.*\n\n- Semua harga sah **24 jam** selepas quotation dihantar.\n- Harga untuk **2–3 orang sebilik**. 3★ Luxury: triple = **extra bed (rollaway)**; 4★ Tugu: triple = **proper bed**.\n- **Single Supplement:** +**RM550/pax** (seluruh trip, mana-mana tier).\n- **Late Booking Surcharge RM50/booking** jika booking <45 hari sebelum berlepas (per booking).\n- **Peak Season:** 3 Bintang **RM120/pax/malam** · 4 Bintang **RM180/pax/malam**. Blok: 15–30 Mac 2026 · 25 Mei–5 Jun 2026 · 20 Dis 2026–5 Jan 2027 · 5–25 Feb 2027 · 5 Mac–15 Apr 2027.\n- **Upgrade 4 Bintang:** RM100/pax/malam (Ahad–Khamis), RM120/pax/malam (Jumaat–Sabtu).\n- Pengangkutan ikut saiz group: 2–4 pax Avanza/Innova · 5–6 pax Innova · 7–13 pax Hiace · 14+ Bus. **Transport UNLIMITED sampai tengah malam.**\n- **Deposit RM250/pax** untuk confirm booking. **Full payment 45 hari** sebelum travel date.\n- **Umur:** Adult 12+ · CWB (Child With Bed) 6–11 · CNB (Child No Bed) 2–5 · Infant <2 (FOC). Umur dikira ikut **tarikh travel**.\n- **Suggested Arrival Day 1 & Departure Day 4 = waktu tengah hari (noon).** Late arrival / early departure **tidak refundable** untuk activities & meals yang miss.\n- Itinerari, harga & flight **tertakluk perubahan**. Final itinerari & hotel **14 hari** sebelum trip.\n- Sila semak validity trip dengan staff sebelum book connecting domestic flight di Indonesia.\n- Pakej **sah untuk perjalanan hingga 31 Mac 2027**.\n- **Free Gift (Promo):** Free Lobster Lunch at Pantai Timang — kod **FJOG2**, All pax (FreeGift Campaign MYP 6/26).\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Pakej Jogja ni betul-betul ALL-IN atau ada kos tambahan?**\nDari segi Ground, pakej sudah ALL-INCLUDED: 3 malam hotel (3★ atau 4★ upgrade), Full Board (3B+3L+3D), private transport unlimited sampai tengah malam, entrance fees ikut itinerari, driving guide, tipping, Jeep Merapi & Jeep Timang. TIDAK termasuk: flight, add-on activities (Borobudur, Gondola Timang, Jeep/ATV Gumuk Pasir dll), travel insurance & personal expenses.\n\n**Apa kelebihan ambil pakej Jogja dengan ARBA berbanding lain?**\nARBA beroperasi sejak 2014. Untuk Jogja: hotel City Centre (1km/15 min ke Malioboro), Full Board halal, tipping & Jeep Timang/Merapi included, Plaosan Temple included (pesaing selalu skip), transport unlimited, dan pilihan hotel 3★ atau 4★ dalam satu pakej.\n\n**Ada tourist trap atau compulsory shopping tak?**\nTiada. ARBA tidak include compulsory shopping atau tourist trap. Semua tempat dalam itinerari genuine sightseeing.\n\n**Boleh customize itinerari?**\nBoleh — ini Private Tour. Boleh tambah spot, tukar fokus atau upgrade hotel ikut budget & preference. Maklum TC awal; itinerari muktamad 14 hari sebelum trip.\n\n**Pakej ni rushing tak?**\nTidak terlalu rushing — 4 hari rhythm relax. Cuma Day 2 Bukit Panguk sunrise = bangun ~4 AM, dan Day 4 Merapi pagi sebelum flight.\n\n**Berapa lama penggunaan transport?**\nUNLIMITED — boleh guna kenderaan sampai lewat malam (up to midnight), termasuk round Malioboro waktu malam.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal senang dapat di Jogja?**\nSangat senang — Jogja kawasan Muslim-majority. Hampir semua restoran halal-certified atau halal-friendly. Banyak pilihan tempatan murah & sedap.\n\n**Kita makan apa di Jogja?**\nMasakan Indonesia tempatan (halal): Nasi Gudeg (signature Jogja — nangka manis), Ayam Goreng Kalasan, Sate Klatak (sate kambing), Soto, dan banyak lagi. Semua meal (3B+3L+3D) disediakan dalam pakej.\n\n**Ada masjid/surau untuk solat?**\nYa, berlimpah. Masjid Gedhe Kauman (masjid diraja bersebelahan Kraton) antara tertua. Setiap attraction ada surau — Merapi base camp, Timang, Heha, Hutan Pinus, Obelix, Borobudur. Bawa sejadah untuk sunrise Bukit Panguk.\n\n**Ada arak dalam masakan tempatan?**\nRestoran halal di Jogja tidak guna arak. Sahkan sebarang keperluan diet khas dengan TC awal.\n\n### C. Visa & Passport\n\n**Adakah Indonesia perlu visa?**\nTidak. Rakyat Malaysia **visa-free 30 hari** untuk masuk Indonesia (perjanjian ASEAN). Perlu: passport sah **minimum 6 bulan**, dan **All Indonesia Arrival Card** (customs/immigration declaration) diisi online sebelum flight — simpan QR untuk ditunjuk di YIA.\n\n**Apa perlu disediakan untuk perjalanan?**\nPassport sah 6 bulan+, tiket flight return, All Indonesia Arrival Card QR (online), cash IDR/RM, dan travel insurance/Takaful (disyorkan). Customer bukan warga Malaysia uruskan visa sendiri.\n\n### D. Flight & Airport\n\n**Kita naik flight apa?**\nKUL ↔ Yogyakarta International Airport (YIA), direct, masa terbang lebih kurang **2 jam 45 minit**. Pasangan biasa: **AK 346** (KUL 9:40 AM → YIA 11:20 AM, harian) pergi dan **AK 347** (YIA 11:45 AM → KUL 3:15 PM, harian) balik. Alternatif AirAsia: AK 348 (KUL 3:25 PM) dan AK 349 (YIA 5:30 PM). Malaysia Airlines MH 857 / MH 856 beroperasi **Selasa & Sabtu sahaja**. Flight tidak termasuk pakej.\n\n**Berapa anggaran harga flight?**\n**RM390–600 return/pax** untuk AirAsia (sumber: Flight Recommendation ARBA). Malaysia Airlines premium — harga ikut kelas tempahan. Booking awal (3 bulan ke atas) lebih murah. Terdapat lebih kurang 11 flight direct seminggu setiap arah KUL–YIA.\n\n**Berapa kg bagasi?**\nMalaysia Airlines 25–30 kg (ikut kelas). AirAsia hand carry 7 kg; check-in bagasi add-on (lebih murah dibeli online). Powerbank maksimum 100Wh (lebih kurang 20,000mAh) wajib hand carry.\n\n### E. Hotel & Bilik\n\n**Kita menginap hotel mana?**\nDefault: **hotel 3 Bintang** (Emersia Hotel / Luxury Hotel atau setaraf) — City Centre, dalam 1 km dari Malioboro. Upgrade: **4 Bintang The 101 Yogyakarta Tugu atau setaraf**. Nama hotel muktamad dimaklumkan 14 hari sebelum trip.\n\n**Bilik macam mana?**\n2 pax = twin sharing. 3 pax hotel 3 Bintang = triple dengan extra bed. 3 pax hotel 4 Bintang = triple dengan proper bed. 4 pax = 2 bilik. Single = RM550/pax.\n\n**Ada connecting room di hotel Jogja?**\nAda di Emersia Malioboro — perlu request semasa booking, subject to availability. (Sumber: Product FAQ Notion.)\n\n### F. Cuaca & Musim\n\n**Bila masa terbaik pergi Jogja?**\n**Mei–Oktober (musim kering)** — pagi cooler, hujan minima, best untuk sunrise & Jeep tour. Bulan terbaik: Jun, Jul, Ogos, Sep. Untuk elak orang ramai: Mei atau Sep.\n\n**Cuaca terlalu panas ke?**\nTropika, ~24–32°C. Pagi cool (~24°C), tengah hari panas (~32°C, kadang lebih). Bawa baju ringan + topi + sunblock. Nov–April musim hujan (hujan petang).\n\n### G. Shopping & Duit\n\n**Cadangan cash untuk dibawa?**\nRM1,000–1,500/pax untuk shopping, souvenir & add-on (Borobudur RM150, Gondola RM80, dll). Tukar RM → IDR di money changer Jogja (rate lebih baik dari KLIA).\n\n**Cara bayar terbaik — cash atau cashless?**\nKedai kecil & pasar (Malioboro, Beringharjo): **cash IDR** preferred. Shopping mall, hotel, restoran besar terima kad. QRIS (GoPay/OVO) meluas.\n\n**Beli apa di Jogja?**\nBatik, ole-ole khas Jogja (bakpia, gudeg kaleng), kraf perak Kotagede, souvenir Malioboro & Pasar Beringharjo.\n\n### H. Payment & Refund\n\n**Berapa deposit untuk book?**\n**RM250/pax** untuk confirm booking (murah berbanding destinasi Australia RM1,000).\n\n**Bila settle full payment?**\n**45 hari** sebelum departure. Late booking (<45 hari) ada surcharge RM50/booking.\n\n**Kenapa harga berbeza ikut tarikh?**\nSebab musim travel (peak +RM120/pax/malam 3★, +RM180 4★), cuti Hari Raya/Christmas/CNY, dan pilihan hotel tier. Elak Dis–Jan & Mac–Apr jika mahu harga lebih baik.\n\n### I. Add-ons & Customization\n\n**Apa add-on popular?**\nBorobudur entrance (RM150/pax Ground Area, RM185/pax Temple/Hill guided), Gondola Timang (RM80/pax), Jambatan Timang (RM50/pax), Jeep Gumuk Pasir (RM157/jeep), ATV (RM100/ATV), Horse Carriage Malioboro (RM70/carriage), Goa Pindul cave tubing (RM100/pax), Gamplong Studio Alam (RM25/pax). Harga ikut Rate Card Operasi 3 September 2026 (menang atas katalog V3). Lihat tab Customisation.\n\n**Harga add-on untuk kanak-kanak sama dengan adult?**\nTidak — add-on untuk kanak-kanak dikenakan **60% daripada harga adult**. (Sumber: Product FAQ Notion — tiada dalam katalog V3.)\n\n**Add-on boleh bayar di Jogja?**\nBoleh. Jika customer berubah fikiran semasa trip, pembayaran add-on boleh dibuat di sana — minta Tour Guide assist.\n\n**Boleh extend ke Bromo atau Bali?**\nBoleh — bincang dengan TC. Jogja + Bromo (3D2N add-on, perlu flight Surabaya) atau Jogja + Bali (pakej berasingan).\n\n### J. Kesihatan & Keselamatan\n\n**Trip Jogja sesuai untuk family & kanak-kanak?**\nYa, sangat sesuai. Banyak attraction family-friendly (Bukit Panguk, Hutan Pinus, Kraton, Heha). Jeep Timang ada opsyen gentle.\n\n**Sesuai untuk anak kecil (toddler/infant)?**\nKurang sesuai untuk <5 tahun — Jeep Timang & Jeep Merapi **bumpy & perilous**, dan Bukit Panguk perlu bangun pre-dawn. Boleh skip aktiviti tertentu.\n\n**Sesuai untuk warga emas / yang tak boleh jalan jauh?**\nSecara umum Jogja sesuai untuk warga emas. Yang perlu diberi perhatian ialah **Jeep Tour** — laluan gravel, sedikit adventurous. Bukit Panguk dan kompleks candi pula banyak berjalan dan tangga. Jika ada masalah kesihatan yang kurang sesuai dengan keadaan tour ini, sebaiknya elakkan aktiviti berkenaan; itinerari boleh dicustom untuk kurangkan aktiviti fizikal. (Sumber: Product FAQ Notion.)\n\n### K. Praktikal (Internet · Transport · Laundry)\n\n**Internet bagaimana di Jogja?**\nPilihan: Pocket Wifi (RoamingMan) RM100–150/trip (3–10GB, kongsi 5 device), Indonesia eSIM RM30–50/7 hari, atau international roaming (Maxis/Celcom). Hotel Wifi percuma.\n\n**Ada service laundry?**\nYa. Hotel laundry (~RM5–10/item, agak mahal) atau laundry kiloan tempatan (RM5–10/kg, jauh lebih murah). Tidak termasuk pakej.\n\n**Transport apa digunakan?**\n2–4 pax: Avanza/Innova · 5–6: Innova · 7–13: Hiace · 14+: Bus. Semua berhawa dingin, driver standby sampai tengah malam.\n\n### L. Packing\n\n**Apa perlu bawa?**\nKasut selesa (banyak berjalan), baju ringan + jaket nipis (pagi sejuk di Merapi/Bukit Panguk), topi & sunblock, sejadah/telekung, ubat peribadi, payung/raincoat (Nov–April), dan cash IDR/RM.\n"}</script>

/* --- markdown engine --- */
function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

function build(md){

    var existing=document.querySelector('.block[data-topic="'+id+'"]');
    if(existing){
      var body=html.replace(/^\s*<h2>[\s\S]*?<\/h2>/,"");
      var _fq=existing.querySelector("details.qa");
      if(_fq)_fq.insertAdjacentHTML("beforebegin",body);
      else existing.insertAdjacentHTML("beforeend",body);
    }else{
      var s=document.createElement("section");s.className="block hidden";s.dataset.topic=id;s.id="topic-"+id;s.innerHTML=html;cont.appendChild(s);
    }
  });
  /* card hotel SEBELUM FAQ */
  var _stay=document.querySelector('.block[data-topic="stay"]');
  if(_stay){var _sq=_stay.querySelector("details.qa");
    if(_sq)_sq.insertAdjacentHTML("beforebegin",renderHotels());
    else _stay.insertAdjacentHTML("beforeend",renderHotels());}
  /* tab Itinerary = soalan sahaja (actGroups dikosongkan) */
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=(d.dataset.text||d.textContent||"").toLowerCase().includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);
