.dbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--greensoft);border:1px solid var(--line);border-radius:11px;
  padding:8px 12px;font-size:12.5px;margin-bottom:10px}

/* ---- kad hari ---- */
.dayc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.dayc>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;cursor:pointer;
  list-style:none;font-size:12.5px}
.dayc>summary::-webkit-details-marker{display:none}
.dayc[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.dayc.dragging{opacity:.45}
.dayc.dropto{outline:2px dashed var(--green2);outline-offset:-2px}
.dgrip{flex:0 0 auto;color:var(--muted);font-size:14px;cursor:grab;line-height:1;user-select:none}
.dgrip:active{cursor:grabbing}
.dayc>summary{user-select:none}
.dnum{flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:var(--green);color:#fff;
  font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.ddate{flex:0 0 auto;color:var(--muted);font-size:11.5px;min-width:78px}
.dname{flex:1 1 170px;font-weight:700}
.dchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dchip{font-size:10.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;
  padding:2px 8px;color:var(--muted);white-space:nowrap}
.dayc[open]>summary .dchip{background:#fff}
.dchip.dcost{font-weight:700}
.dchip.dcost.on{background:var(--greensoft);border-color:var(--green2);color:var(--greend)}
.dacts{display:flex;gap:4px;flex:0 0 auto}
.xbtn{font:inherit;font-size:13px;line-height:1;width:24px;height:24px;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.xbtn:hover{background:var(--greensoft);color:var(--greend);border-color:var(--green2)}
.dbody{padding:11px}
.aowrap{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.aowrap>.fl{display:block;font-weight:600;margin-bottom:6px}
.aorow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.aorow select{flex:1 1 210px;width:auto}
.aorow input.qin{width:78px}
.aosum{font-weight:700;min-width:76px;text-align:right;font-size:12px;white-space:nowrap}

.ctot{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.ctot>div{flex:1 1 190px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ctl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ctv{display:block;font-size:19px;font-weight:800;color:var(--greend);margin-top:2px}
.cbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.cbtn{font:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;border:none;
  background:var(--green);color:#fff;cursor:pointer}
.cbtn:hover{background:var(--green2)}
.cbtn2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.cbtn2:hover{background:var(--soft)}
.cbtn3{background:#fff;color:var(--greend);border:1px solid var(--line);font-size:12px;padding:6px 13px}
.cbtn3:hover{background:var(--greensoft)}
@media(max-width:640px){
  .calctbl input.qin{width:58px}
  .ddate{display:none}
  .aorow input.qin{width:64px}
}

/* ---- pemilih varian pakej (destinasi berbilang pakej) ---- */
.pkgsel{margin-bottom:12px}
.pkgsel .fl{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
.pkgsel select{font:inherit;font-size:13.5px;font-weight:600;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);width:100%;cursor:pointer}
.pkgsel select:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.dayc .dchips .dchip.dreg{color:var(--ink);font-weight:700;letter-spacing:.3px}
.dayc .dchips .dchip.dwarn{background:#fdecec;color:#b3261e;border-color:#f3c9c6;font-weight:700}
.dayc .dchips .dchip.dcost.dded{background:#eef3fb;border-color:#c9d8ef;color:#1a4d8f}
.dayc .dnum.dnumx{background:#eef3fb;color:#1a4d8f;box-shadow:inset 0 0 0 1.5px #9dbbe4}
.calcblk .calcwarn,.block[data-topic="calc"]>.calcwarn{margin:10px 0 0;padding:9px 12px;border-radius:10px;
  background:#fdecec;border:1px solid #f3c9c6;color:#b3261e;font-size:12.5px;line-height:1.45}
.dname{flex:1 1 210px;min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:400}
.dnm{font-weight:700}
.dprev{font-size:11.5px;color:var(--muted);line-height:1.35;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dstops{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.dstops>.fl{display:block;font-weight:600;margin-bottom:6px}
.dlist{margin:0;padding-left:17px}
.dlist li{margin-bottom:3px}
.calcblk .calcincl{margin:9px 0 0;padding:8px 11px;border-radius:9px;background:var(--soft);
  border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.45}
.warnred{color:#b3261e}


/* ---- breakdown harga per pax (bawah jadual ringkasan) ---- */
.calcbrk{width:100%;border-collapse:collapse;margin:.35rem 0 .5rem}
.calcbrk td{padding:.28rem .5rem;border-bottom:1px solid var(--line,#e5e7eb);font-size:.86rem}
.calcbrk td.add{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.calcbrk td.add.dded{color:#b3261e}
.calcbrk tr.brkt td{border-top:2px solid var(--line,#e5e7eb);border-bottom:none;
  background:var(--soft,#f8fafc)}
.brkh{margin:.6rem 0 .1rem;font-size:.9rem}
.brkn{margin:.15rem 0 0;font-size:.78rem;color:var(--muted,#64748b);line-height:1.45}
.calcbrk tr.brks td{border-top:1px solid var(--line);color:var(--muted)}
.calcbrk tr.brks td.add{color:var(--ink)}

/* ---- cip flag tambah/tolak pada baris hari ---- */
.dchip.dadj{background:var(--soft,#f1f5f9);border:1px solid var(--line,#e2e8f0);
  font-size:.72rem;font-weight:600}
.dchip.dadj.dded{color:#b3261e;border-color:#f3c9c4}
.dchip.dadj.dtrip{border-style:dashed;opacity:.9}

</style>
</head>

oo (James Bond Island)","Naka Island"]},{"d":3,"t":"Phi Phi Island Tour by Speedboat (shared tour)","m":"International Breakfast, Lunch","a":["Phi Phi Ley Island by speedboat","Snorkelling and sightseeing past Maya Bay","Loh Sama Bay","Phi Phi Ley Island, Pileh Cove, Viking Cave","Monkey Bay","Phi Phi Don (lunch)","Khai Nok Island","Koh Khai Island"]},{"d":4,"t":"Phuket City Tour - KUL","m":"International Breakfast","a":["Recommended to depart after 4PM","Check out hotel","Phuket View Point at Kata Noi Beach","Sightseeing at Promthep Cape","Cashew Nut Factory and shopping for local products","Pearl Jam Factory","Bee Farm","Gem Factory","Century-old Sino-Portuguese buildings at Thalang Road","T-shirt Factory","Pornthip Sea Store","Transfer back to Phuket Airport"]}],[{"d":1,"t":"KUL - Phuket","m":"-","a":["Recommended to arrive after 12PM","Airport transfer","Check in"]},{"d":2,"t":"Racha and Coral Island by Speedboat (shared tour)","m":"International Breakfast, Lunch","a":["Swim and snorkelling","Racha Island","Coral Island","Lunch"]},{"d":3,"t":"Chosen by Customer","m":"International Breakfast, Lunch","a":["Phi Phi Island (add RM100/person, shared tour) — Phi Phi Ley Island by speedboat; Snorkelling and sightseeing past Maya Bay; Loh Sama Bay; Phi Phi Ley Island, Pileh Cove, Viking Cave; Monkey Bay; Phi Phi Don (lunch); Khai Nok Island; Koh Khai Island","OR James Bond Island + Canoe by Big Boat (shared tour) — Phang Nga Bay; Panak Island (Canoe); Hong Island (Canoe); Khao Pinkkan; Khao Tapoo (James Bond Island); Naka Island"]},{"d":4,"t":"Phuket - KUL","m":"International Breakfast","a":["Recommended to depart after 12PM","Check out hotel","Airport transfer"]}]],"attractions":[{"n":"Phi Phi Island & Maya Bay","t":"Island Hopping","emoji":"","img":"Playa Maya, Ko Phi Phi, Tailandia, 2013-08-19, DD 13.JPG","short":"Pulau ikonik air biru kristal — lokasi filem 'The Beach'.","intro":"Gugusan Phi Phi (Krabi province) diakses ~45 min speedboat dari Phuket. Highlight: Maya Bay yang terkenal, Loh Sama Bay, Viking Cave, Monkey Bay dan makan tengah hari di Phi Phi Don. Snorkeling air jernih dengan ikan warna-warni.","hi":["Maya Bay (sightseeing & snorkel)","Loh Sama Bay & Piley Cove","Viking Cave","Phi Phi Don (lunch)","Khai Islands snorkel"],"best":"Nov–Apr (laut tenang, visibiliti terbaik). Elak musim monsun May–Okt.","muslim":"Lunch disediakan di Phi Phi Don — minta set halal/seafood tanpa non-halal (ARBA maklum operator awal). Tiada masjid di pulau; solat jamak/qasar di bot atau kawasan rehat — bawa sejadah travel. Ambil wuduk sebelum bertolak.","map":"https://www.google.com/maps/search/?api=1&query=Phi+Phi+Islands+Thailand"},{"n":"James Bond Island (Phang Nga Bay)","t":"Island + Sea Canoe","emoji":"","img":"Isla Tapu, Phuket, Tailandia, 2013-08-20, DD 36.JPG","short":"Batu kapur ikonik Khao Tapoo di teluk Phang Nga.","intro":"Khao Tapoo — batu limestone menegak yang muncul dalam filem James Bond 'The Man with the Golden Gun'. Tour big boat merangkumi canoeing di Panak & Hong Island menyusuri gua dan lagun tersembunyi Phang Nga Bay.","hi":["Khao Tapoo (James Bond Island)","Canoe di Panak Island","Canoe di Hong Island","Khao Pinkkan","Naka Island"],"best":"Sepanjang tahun; paling selesa Nov–Apr. Air pasang surut menentukan akses canoe.","muslim":"Lunch termasuk — minta set halal. Tiada surau di pulau; solat di bot/kawasan jeti — bawa sejadah. Restoran halal mudah di jeti pelancong di tanah besar.","map":"https://www.google.com/maps/search/?api=1&query=James+Bond+Island+Phang+Nga+Bay"},{"n":"Racha & Coral Island","t":"Snorkel & Beach","emoji":"","img":"Racha 2015 december - panoramio (2).jpg","short":"Dua pulau dekat Phuket — snorkel & mandi laut.","intro":"Racha Island (Raya) terkenal dengan air jernih & terumbu karang cetek sesuai snorkel; Coral Island (Koh Hae) hanya ~15 min dari Phuket, sesuai untuk banana boat & parasailing (add-on). Termasuk dalam kedua-dua pakej pada Hari 2.","hi":["Snorkeling di Racha Island","Mandi laut Coral Island","Banana boat (add-on)","Parasailing (add-on)"],"best":"Nov–Apr. Aktiviti laut boleh dibatalkan jika cuaca buruk (musim hujan).","muslim":"Lunch buffet di pulau — sahkan pilihan halal dengan operator. Tiada surau; solat di kawasan rehat/bot. Bawa sejadah & pakaian renang sopan (rashguard/muslimah swimwear).","map":"https://www.google.com/maps/search/?api=1&query=Coral+Island+Phuket"},{"n":"Phuket Old Town (Sino-Portuguese)","t":"Heritage & Shopping","emoji":"","img":"Buildings in Old Phuket Town.jpg","short":"Bangunan warisan Sino-Portugis warna-warni di Thalang Road.","intro":"Pusat bandar lama Phuket dengan seni bina Sino-Portugis abad ke-19, kafe, mural jalanan dan kedai souvenir. Sebahagian daripada City Tour pakej Standard (Hari 4). Kawasan ini ada komuniti Muslim & pilihan makanan halal.","hi":["Thalang Road heritage","Mural & kafe","Souvenir & produk tempatan","Makanan jalanan"],"best":"Pagi/petang untuk elak panas. Ahad ada Walking Street market (jika bertepatan).","muslim":"Restoran & gerai halal ada di sekitar Old Town & Phuket Town. Masjid tempatan berhampiran. Mudah cari makan halal berbanding kawasan tourist lain.","map":"https://www.google.com/maps/search/?api=1&query=Phuket+Old+Town+Thalang+Road"},{"n":"Promthep Cape & Kata Noi Viewpoint","t":"Viewpoint","emoji":"","img":"Laem Phromthep in Phuket (5733622568).jpg","short":"Tanjung paling selatan Phuket — sunset & panorama.","intro":"Promthep Cape ialah titik sunset paling popular di Phuket dengan panorama Laut Andaman. Kata Noi Viewpoint (Karon Viewpoint) menawarkan pemandangan tiga teluk. Kedua-dua dalam City Tour pakej Standard.","hi":["Sunset Promthep Cape","Panorama 3 teluk Kata Noi","Foto & santai"],"best":"Petang menjelang sunset (~5–6.30pm).","muslim":"Kawasan viewpoint terbuka — solat di surau berdekatan atau jamak di hotel. Bawa sejadah. Hati-hati monyet di sesetengah viewpoint.","map":"https://www.google.com/maps/search/?api=1&query=Promthep+Cape+Phuket"},{"n":"Big Buddha & Wat Chalong","t":"Landmark (Optional)","emoji":"","img":"The Big Buddha, Phuket.jpg","short":"Patung Buddha 45m & kuil utama Phuket — spot foto.","intro":"Big Buddha (Nakkerd Hill) — patung marmar putih 45m dengan pemandangan menyeluruh; Wat Chalong kuil Buddha paling penting di Phuket. Bukan dalam itinerari standard tapi popular sebagai add-on/customisation untuk pengalaman budaya & foto.","hi":["Big Buddha Nakkerd Hill","Wat Chalong","Panorama pulau"],"best":"Pagi (elak panas & ramai). Berpakaian sopan menutup lutut & bahu.","muslim":"Ini tapak keagamaan Buddha — untuk lawatan budaya/foto sahaja, bukan ibadah. Berpakaian sopan. Solat di surau/hotel. Boleh diskip jika customer tak berminat.","map":"https://www.google.com/maps/search/?api=1&query=Big+Buddha+Phuket"},{"n":"Patong Beach & Bangla Area","t":"Beach & Food Hub","emoji":"","img":"Вид с вертолета на Патонг (март 2013) - panoramio.jpg","short":"Pusat Patong — pantai, shopping & hub makanan halal.","intro":"Patong ialah kawasan paling meriah di Phuket. Waktu siang: pantai & shopping (Jungceylon, Banzaan Market). Kawasan ini ada Masjid Patong (Nanai Road) dan banyak restoran halal. Nota: Bangla Road ialah kawasan hiburan malam — TC boleh nasihat customer keluarga elak waktu malam.","hi":["Pantai Patong","Jungceylon & Banzaan Market (gerai halal)","Masjid Patong (Nanai Rd)","Shopping"],"best":"Siang untuk pantai & shopping. Keluarga Muslim digalak elak kawasan Bangla waktu malam.","muslim":"Hub halal terbaik di Phuket — banyak restoran halal & Muslim-friendly di Patong. Masjid Patong (Nanai Road, ~5 min dari pantai) & Al-Madani Mosque untuk solat Jumaat/harian. Bawa sejadah sebagai backup.","map":"https://www.google.com/maps/search/?api=1&query=Patong+Beach+Phuket"},{"n":"Andamanda Waterpark / Phuket Aquaria","t":"Family Add-on","emoji":"","img":"Water slide at Gulf Islands Waterpark in Gulfport, Mississippi.jpg","short":"Taman air & akuarium — pilihan keluarga (add-on).","intro":"Untuk hari tambahan atau keluarga dengan anak-anak: Andamanda Waterpark (taman air bertema, RM287 adult / RM247 kid) dan Phuket Aquaria (akuarium, RM237 adult / RM197 kid). Bukan dalam itinerari — add-on own arrangement.","hi":["Andamanda Waterpark","Phuket Aquaria","Sesuai kanak-kanak"],"best":"Buka harian 10.30am–7pm.","muslim":"Ada surau/prayer room di sesetengah mall & attraction besar (cth Central Festival). Bawa pakaian renang sopan untuk waterpark. Makanan di premis — pilih outlet halal.","map":"https://www.google.com/maps/search/?api=1&query=Andamanda+Waterpark+Phuket"}],"hotels":[{"tier":"3★ (default)","name":"Ibis Phuket Kata Beach","note":"Default 3★ ikut katalog. Bilik double/twin standard; triple = extra bed (tertakluk availability).","emoji":"","img":""},{"tier":"3★ (alternatif)","name":"Tony Resort Patong Beach / Di Pantai Boutique Beach Resort","note":"Alternatif 3★ atau setaraf, ikut availability.","emoji":"","img":""},{"tier":"4★ (upgrade +RM300/pax)","name":"The Marina Phuket Hotel","note":"Pilihan 4★ ikut katalog. Upgrade RM300/pax.","emoji":"","img":""},{"tier":"4★ (alternatif)","name":"Amata Patong Resort / Best Western Patong Beach","note":"Alternatif 4★ atau setaraf ikut katalog, tertakluk availability.","emoji":"","img":""}],"actGroups":[],"blocks":{"pricing":"<h2>Harga &amp; Pakej</h2><p class='ssub'>Harga katalog per pax dari PT R&amp;D Costing Hub — sama seperti katalog customer. Itinerary, termasuk &amp; tidak termasuk ikut tab Itinerary hub.</p><div class='custblk'><h3>PAKEJ PHUKET STANDARD · 4D3N</h3><table class='ctbl'><thead><tr><th>Bil. pax</th><th>Adult</th><th>Child with extra bed<br><small>4-11 yrs</small></th><th>Child without Bed<br><small>4-11 yrs</small></th></tr></thead><tbody><tr><td class='it'>2 - 10</td><td class=add>RM1,797</td><td>RM1,597</td><td>RM1,397</td></tr></tbody></table><p class='custnote'>Infant: Child (0-3 yrs): FOC · Ground &amp; Tipping · Sah sehingga 31 December 2026 · Upgrade to 4 Star Hotel: RM300/person · <a href='https://prod-at22.github.io/catalog-pt-public/phuket-standard.html' target='_blank' rel='noopener'>Katalog customer ↗</a></p></div><div class='custblk'><h3>PAKEJ PHUKET BASIC · 4D3N</h3><table class='ctbl'><thead><tr><th>Bil. pax</th><th>Adult</th><th>Child with extra bed<br><small>4-11 yrs</small></th><th>Child without Bed<br><small>4-11 yrs</small></th></tr></thead><tbody><tr><td class='it'>2 - 10</td><td class=add>RM1,397</td><td>RM1,197</td><td>RM997</td></tr></tbody></table><p class='custnote'>Infant: Child (0-3 yrs): FOC · Ground Only (Boat Sharing Basis) · Sah sehingga 31 December 2026 · Upgrade to 4 Star Hotel: RM300/person · <a href='https://prod-at22.github.io/catalog-pt-public/phuket-basic.html' target='_blank' rel='noopener'>Katalog customer ↗</a></p></div><div class='custblk'><h3>Nota penting</h3><p class='custnote'>Ini bukan pakej private tour — island tour &amp; pengangkutan aktiviti adalah sharing basis (seat-in-coach) bersama pelancong lain. Private transport hanya Hari 1 &amp; Hari 4.</p></div>","custom":"<h2>Simple Customisation & Add-Ons</h2><p class='ssub'>Harga jualan per pax kecuali dinyatakan. Add-on di pulau = own expenses (cash).</p><div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Harga</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Phuket Aquaria</td><td class='add'>RM 237 adult / RM 197 kid</td><td>Buka 10.30am–7pm</td></tr><tr><td class='it'>Andamanda Waterpark</td><td class='add'>RM 287 adult / RM 247 kid</td><td>Buka 10.30am–7pm</td></tr><tr><td class='it'>Banana Boat (Coral Island)</td><td class='add'>RM 67–87</td><td>Own expenses</td></tr><tr><td class='it'>Parasailing (Coral Island)</td><td class='add'>RM 157–197</td><td>Own expenses</td></tr><tr><td class='it'>Phi Phi (Basic Hari 3)</td><td class='add'>+RM 100</td><td>Upgrade opsyen Basic</td></tr><tr><td class='it'>Pocket Wifi Thailand 3GB (4D3N)</td><td class='add'>RM 80</td><td>RoamingMan</td></tr><tr><td class='it'>Pocket Wifi Thailand 10GB (4D3N)</td><td class='add'>RM 120</td><td>RoamingMan</td></tr><tr><td class='it'>Extra Lunch / Dinner</td><td class='add'>RM 80</td><td>Per pax/meal</td></tr><tr><td class='it'>Takaful TripCare 360 (Individu, 1–5 hari)</td><td class='add'>RM 45</td><td>Couple RM79 · Family RM100</td></tr><tr><td class='it'>Luggage Tracker (Blue Ribbon)</td><td class='add'>RM 20–70</td><td>Silver→Diamond</td></tr></tbody></table></div><h3>Rate Card Operasi &mdash; Harga Tambahan / Harga Tolak</h3><p>Kadar rasmi untuk <b>ubah suai pakej</b>. Accommodation dikira <b>per bilik per malam</b>; meal dan day tour dikira <b>per pax</b>. Rate card hanya beri kadar normal &mdash; tiada kadar malam tambahan waktu peak.</p><h4>Accommodation &mdash; per bilik / malam</h4><table class='ctbl'><thead><tr><th>Hotel</th><th>Tambah 1 malam (normal)</th><th>Tolak 1 malam (normal)</th></tr></thead><tbody><tr><td>3&#9733; (hotel default pakej)</td><td class='add'>RM 265</td><td>&minus;RM 150</td></tr><tr><td>4&#9733; (upgrade +RM 300/pax)</td><td class='add'>RM 330</td><td>&minus;RM 150</td></tr></tbody></table><p class='small'>Kadar accommodation adalah <b>per bilik</b>, bukan per pax &mdash; asas katalog 2&ndash;3 orang sebilik. Harga tolak sama untuk 3&#9733; dan 4&#9733;.</p><h4>Day Tour &mdash; per pax</h4><table class='ctbl'><thead><tr><th>Item</th><th>Harga Tolak</th></tr></thead><tbody><tr><td>Tolak 1 day tour</td><td>&minus;RM 50</td></tr></tbody></table><p class='small'>Rate card tiada harga tambahan day tour &mdash; day tour tambahan sebut harga ikut operator.</p><h4>Meals &mdash; per pax / hidangan</h4><table class='ctbl'><thead><tr><th>Meal</th><th>Tambah 1 meal</th><th>Tolak 1 meal</th></tr></thead><tbody><tr><td>Breakfast</td><td class='add'>Cadang makan di hotel</td><td>&ndash;</td></tr><tr><td>Lunch</td><td class='add'>RM 80</td><td>&minus;RM 50</td></tr><tr><td>Dinner</td><td class='add'>RM 80</td><td>&minus;RM 50</td></tr></tbody></table><ul><li><b>Lunch</b> sudah termasuk dalam island package &mdash; tolak hanya kalau customer tidak mahu pergi island.</li><li><b>Dinner</b> tidak disediakan dalam pakej. Galakkan customer explore dinner scene sendiri; sebut harga atas permintaan.</li><li><b>Breakfast</b> sudah termasuk dalam semua malam hotel &mdash; tiada harga tolak.</li></ul><p class='src'>Sumber: rate card operasi PT Phuket (Accommodation, Meals, Day Tour) &mdash; tiada dalam katalog.</p>","calc":"<h2>Simple Calculator</h2><p class='ssub'>Kadar katalog 2026 v2 (5 Ogos 2026), per pax, 2&ndash;3 orang sebilik, 2&ndash;10 pax, ground only tanpa tiket flight. Pakej ini <b>bukan private tour</b> &mdash; bot dan pengangkutan aktiviti adalah sharing basis; private transport hanya Hari 1 &amp; Hari 4. Kadar tambah/tolak meal dari rate card operasi PT Phuket (tambah RM 80/pax, tolak RM 50/pax setiap hidangan). Malam tambahan dan tolakan malam pakej dikira <b>per bilik</b> &mdash; tandakan hari itu dalam dropdown Accommodation, kemudian pilih add-on <i>&hellip; per bilik</i> dan isi bilangan bilik.</p><div class='custblk calcblk'><h3>Detail customer</h3><div class='pkgsel'><label><span class='fl'>Pakej</span><select id='c_pkg'><option value='0'>Phuket Standard 4D3N &middot; Hotel 3 bintang</option><option value='1'>Phuket Basic 4D3N &middot; Hotel 3 bintang</option></select></label></div><div class='cgrid'><label class='fld'><span class='fl'>Nama customer</span><input id='c_name' type='text' placeholder='Nama penuh customer'></label><label class='fld'><span class='fl'>Departure date</span><input id='c_dep' type='date'><span class='fh'>Hari 1 trip</span></label><label class='fld'><span class='fl'>Return date</span><input id='c_ret' type='date'><span class='fh'>Hari terakhir &mdash; tentukan panjang trip</span></label><label class='fld'><span class='fl'>Adult (12 tahun ke atas)</span><input id='c_adult' type='number' min='0' value='2'></label><label class='fld'><span class='fl'>Child 4&ndash;11 (extra bed)</span><input id='c_cwb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Child 4&ndash;11 (tanpa bed)</span><input id='c_cnb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Infant (bawah 2)</span><input id='c_inf' type='number' min='0' value='0'><span class='fh'>Child 0&ndash;3 tahun FOC (ground only).</span></label><label class='fld'><span class='fl'>Bilik single</span><input id='c_single' type='number' min='0' value='0'><span class='fh'>Standard +RM 450/pax. <b>Basic: sebut harga atas permintaan</b> &mdash; kalkulator caj RM 0 untuk bilik single Basic, dapatkan kadar dari operasi dahulu.</span></label></div><p class='calcnote' id='c_tier'></p></div><details class='panel' id='p_itin'><summary><span class='tw'>&#9654;</span><span class='pt'>Ubah itinerary</span><span class='psum' id='p_itin_s'></span></summary><div class='pbody'><div class='dbar'><span id='c_bar'></span><button type='button' id='c_expand' class='cbtn cbtn3'>Buka semua</button></div><div id='c_days'></div><div class='cbtns'><button type='button' id='c_addday' class='cbtn'>+ Tambah Hari</button><button type='button' id='c_reload' class='cbtn cbtn2'>Muat semula itinerary asal</button></div><p class='calcnote'>Seret baris hari (&#10303;) untuk susun semula &mdash; nombor hari dan tarikh berubah sendiri. Tambah atau buang hari akan laraskan <b>return date</b>. Pilihan bertanda <i>Termasuk pakej</i> tidak menambah kos.</p></div></details><div class='custblk calcblk'><h3>Ringkasan quotation</h3><table class='ctbl calctbl'><thead><tr><th>Item</th><th>Bil.</th><th>Harga seunit (RM)</th><th>Jumlah (RM)</th></tr></thead><tbody id='c_lines'></tbody></table><div class='ctot'><div><span class='ctl'>Grand Total</span><span class='ctv' id='c_grand'>RM 0</span></div><div><span class='ctl'>Per pax (final, semua kos)</span><span class='ctv' id='c_perpax'>RM 0</span></div><div><span class='ctl'>Deposit</span><span class='ctv' id='c_dep_amt'>RM 0</span></div></div><div class='cbtns'><button type='button' id='c_pdf' class='cbtn'>Jana Quotation PDF</button><button type='button' id='c_reset' class='cbtn cbtn2'>Reset semua</button></div><p class='calcnote'>Quotation dibuka dalam <b>tab baharu</b> mengikut format rasmi ARBA &mdash; dari situ tekan <b>Muat turun PDF</b> untuk simpan fail.</p></div>","surcharge":"<h2>Surcharge & Supplement</h2><p class='ssub'>Kadar dan tarikh ikut katalog 2026 v2 (5 Ogos 2026). Setiap varian ada jadual peak season sendiri.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Bila / Nota</th></tr></thead><tbody><tr><td class='it'>Peak Season — Standard</td><td class='add'>+RM 300/pax</td><td>21 Dis 2026 – 10 Jan 2027</td></tr><tr><td class='it'>Peak Season — Standard</td><td class='add'>+RM 250/pax</td><td>11 Jan 2027 – 30 Apr 2027</td></tr><tr><td class='it'>Peak Season — Basic</td><td class='add'>+RM 250/pax</td><td>11 Jan 2026 – 30 Apr 2026</td></tr><tr><td class='it'>Peak Season — Basic</td><td class='add'>+RM 300/pax</td><td>1 Nov 2026 – 31 Dis 2026</td></tr><tr><td class='it'>Mei – Jun</td><td class='add'>Tiada surcharge</td><td>Kedua-dua varian</td></tr><tr><td class='it'>Upgrade hotel 4★</td><td class='add'>+RM 300/pax</td><td>Kedua-dua varian</td></tr><tr><td class='it'>Upgrade Phi Phi Island (Basic, Hari 3)</td><td class='add'>+RM 100/pax</td><td>Ganti James Bond Island</td></tr><tr><td class='it'>Single supplement — Standard</td><td class='add'>+RM 450/pax</td><td>Bilik single</td></tr><tr><td class='it'>Single supplement — Basic</td><td class='add'>Quoted upon request</td><td>Bilik single</td></tr><tr><td class='it'>Late booking</td><td class='add'>+RM 50/booking</td><td>Tempah kurang 45 hari sebelum berlepas</td></tr><tr><td class='it'>Extra hour transport / guide</td><td class='add'>Ikut kadar operator</td><td>Asas 10 jam sehari; lebihan dibayar tunai di destinasi</td></tr><tr><td class='it'>Extra night 3★ / 4★</td><td class='add'>+RM 265 / +RM 330</td><td>Per malam per bilik. <em>Sumber: rate card ARBA — tiada dalam katalog</em></td></tr></tbody></table></div><p class='ssub'>Rate card Date Surcharge 2026/2027 menyenaraikan ALL PHUKET (4D3N) pada RM300/pax untuk 1 Nov 2026 – 9 Jan 2027 dan 10 Jan – 30 Apr 2027. Untuk quotation, guna jadual katalog di atas.</p>","transport":"<h2>Transportation & Guide</h2><p class='ssub'><strong>Pakej ini bukan private tour.</strong> Private transport hanya untuk transfer lapangan terbang Hari 1 &amp; Hari 4. Semua island tour &amp; aktiviti menggunakan <strong>sharing transport / seat-in-coach</strong> (boat &amp; van dikongsi dengan pelancong lain). Asas 10 jam/hari — lebihan jam dicaj per jam (bayar tunai).</p><div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Harga</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Airport Transfer (Hari 1 &amp; 4)</td><td class='add'>Termasuk</td><td>Private transport</td></tr><tr><td class='it'>Island tours (Hari 2 &amp; 3)</td><td class='add'>Seat-in-coach</td><td>Speedboat / big boat — sharing dengan pelancong lain</td></tr><tr><td class='it'>Top-up Airport Transfer Van (max 8)</td><td class='add'>RM 150/way</td><td>Private (rate card KTT)</td></tr><tr><td class='it'>Hotel–Resto Tuk Tuk (max 6)</td><td class='add'>RM 120/car/way</td><td>Add-on</td></tr><tr><td class='it'>Full Day Tour Car (2–4 pax)</td><td class='add'>RM 415/car</td><td>Add-on private, asas 8 jam</td></tr><tr><td class='it'>Full Day Tour Van (max 8)</td><td class='add'>RM 450/van</td><td>Add-on private, asas 8 jam</td></tr></tbody></table></div>","stay":"<h2>Accommodation</h2><p class='ssub'>3★ adalah default kedua-dua varian; upgrade 4★ +RM300/pax. Bilik standard double/twin; triple menggunakan extra bed tertakluk availability. Semua termasuk breakfast. Hotel muktamad disahkan sekurang-kurangnya 15 hari sebelum trip.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Tier</th><th>Hotel (atau setaraf)</th></tr></thead><tbody><tr><td class='it'>3★ (default)</td><td>Ibis Phuket Kata Beach · Tony Resort Patong Beach · Di Pantai Boutique Beach Resort</td></tr><tr><td class='it'>4★ (upgrade +RM300/pax)</td><td>The Marina Phuket Hotel · Amata Patong Resort · Best Western Patong Beach</td></tr></tbody></table></div>","compare":"<h2>Perbezaan Pakej</h2><p class='ssub'>Perbandingan ringkas dua varian Phuket 4D3N untuk bantu customer pilih.</p><table class='cmp'><colgroup><col class='c1'><col><col></colgroup><thead><tr><th class='blank'></th><th>STANDARD · 4D3N · SIGHTSEEING · ISLAND TRIP · CITY TOUR</th><th>BASIC · 4D3N · GROUND ONLY</th></tr></thead><tbody><tr><td class='feat'>Tempoh</td><td class='val'>4D3N</td><td class='val'>4D3N</td></tr><tr><td class='feat'>Jenis pengangkutan</td><td class='val'>Sharing basis (seat-in-coach)</td><td class='val'>Sharing basis (seat-in-coach)</td></tr><tr><td class='feat'>Private transport</td><td class='val'>Hari 1 &amp; Hari 4 sahaja</td><td class='val'>Hari 1 &amp; Hari 4 sahaja</td></tr><tr><td class='feat'>Hotel default</td><td class='val'>3★ (upgrade 4★ +RM300/pax)</td><td class='val'>3★ (upgrade 4★ +RM300/pax)</td></tr><tr><td class='feat'>James Bond Island + Sea Canoe</td><td class='val'><span class='tick'>✔</span></td><td class='val'>Pilih 1 pada Hari 3</td></tr><tr><td class='feat'>Phi Phi Island by speedboat</td><td class='val'><span class='tick'>✔</span></td><td class='val'>Pilih 1 pada Hari 3 (+RM100/pax)</td></tr><tr><td class='feat'>Racha &amp; Coral Island</td><td class='val'>Dalam inclusion katalog</td><td class='val'><span class='tick'>✔</span> Hari 2</td></tr><tr><td class='feat'>Phuket City Tour (Hari 4)</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='no'>—</span></td></tr><tr><td class='feat'>National park &amp; entrance fees</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Fullboard 3 Breakfast &amp; 2 Lunch</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'> terbang.<br><strong>Basic:</strong> Hari 1 tiba Phuket → Hari 2 Racha &amp; Coral Island by speedboat → Hari 3 pilih Phi Phi Island atau James Bond Island + canoe → Hari 4 check-out dan transfer lapangan terbang.<br>Hotel di Patong Beach atau Kata Noi. Laluan lalai tertakluk kepada cuaca, musim dan keadaan trafik.</div></div>"},"snapshot":"# Pakej Phuket — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*Pakej Phuket 4D3N — 2 varian: **Standard** (island tour + city tour) & **Basic** (pilih 1 island tour). Kedua-dua **ground-only** (tanpa tiket flight).*\n\n**PAKEJ INI BUKAN PAKEJ PRIVATE TOUR.** Semua island tour dan pengangkutan aktiviti adalah **sharing basis / seat-in-coach** — dikongsi dengan pelancong lain. Hanya **transfer lapangan terbang Hari 1 & Hari 4** yang menggunakan private transport. Jangan promosikan sebagai private tour kepada customer.\n\n- Semua harga sah **24 jam** selepas quotation dihantar (kadar operator boleh berubah).\n- Harga untuk **2–3 orang sebilik**. Single Supplement: Standard **+RM450/pax**; Basic **quoted upon request**.\n- **Deposit RM250/pax** semasa confirmation. **Full payment 45 hari** sebelum travel date.\n- **Late Booking Surcharge RM50/booking** jika tempah <45 hari sebelum berlepas.\n- Private transport (Hari 1 & 4) & tour guide asas **10 jam/hari**; jam lebih dicaj (bayar **tunai**). Island tour Hari 2–3 = **sharing basis**, bukan private.\n- **Peak Season (ikut katalog 2026 v2):** Standard — 21 Dis 2026–10 Jan 2027 +RM300/pax · 11 Jan 2027–30 Apr 2027 +RM250/pax. Basic — 11 Jan 2026–30 Apr 2026 +RM250/pax · 1 Nov 2026–31 Dis 2026 +RM300/pax. Mei–Jun tiada surcharge.\n- **Upgrade hotel 4★:** +RM300/pax. Basic upgrade Phi Phi (Hari 3): +RM100/pax.\n- Itinerari & hotel muktamad **15 hari** sebelum trip; itinerari/harga tertakluk perubahan.\n- **TDAC (Thailand Digital Arrival Card) WAJIB** untuk semua pelancong — isi online di tdac.immigration.go.th dalam tempoh **3 hari** sebelum ketibaan (setiap orang termasuk kanak-kanak).\n- Passport sah **minimum 6 bulan** dari tarikh berlepas.\n- Sila semak validity trip dengan staff sebelum booking sebarang connecting domestic flight.\n- **Dinner tidak disediakan** (fullboard = 3 Breakfast & 2 Lunch) — customer bebas explore makan malam.\n- Pakej sah untuk perjalanan hingga **31 Disember 2026**.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Ada berapa pakej Phuket?**\nDua: (1) **Standard 4D3N** — James Bond Island + canoe (Hari 2), Phi Phi Island (Hari 3) + Phuket City Tour (Hari 4); (2) **Basic 4D3N** — Racha & Coral (Hari 2) + pilih SATU tour Hari 3 (Phi Phi +RM100/pax ATAU James Bond + canoe). Kedua-dua **ground-only** dan **bukan private tour** — island tour sharing basis.\n\n**Beza Standard dengan Basic?**\nStandard rasa semua highlight (island tour + Phuket City Tour, RM1,797). Basic lebih murah (RM1,397) tapi pilih 1 tour utama pada Hari 3 dan tiada city tour. Kedua-dua sah sepanjang tahun (tertakluk peak season surcharge).\n\n**Pakej Phuket dah termasuk tiket flight?**\nBelum — ini pakej **ground-only**. Customer boleh book flight sendiri atau minta ARBA quote bundle flight + ground.\n\n**Ini pakej private tour ke?**\n**Bukan.** Pakej Phuket Standard & Basic adalah **sharing basis (seat-in-coach)** — island tour dan pengangkutan aktiviti dikongsi dengan pelancong lain. Hanya transfer lapangan terbang Hari 1 & Hari 4 yang private. Jangan janjikan kepada customer sebagai private tour. Jika customer mahu betul-betul private, minta PO quote pakej private tour berasingan.\n\n**Boleh customize itinerari?**\nTerhad — kerana island tour ikut jadual sharing tour operator, itinerari teras tidak boleh diubah. Yang boleh: tukar/upgrade hotel, tambah malam, dan tambah add-on aktiviti (Big Buddha, Wat Chalong, Andamanda Waterpark, Phuket Aquaria) dengan kos tambahan. Maklum consultant awal; itinerari muktamad 15 hari sebelum trip.\n\n**Berapa lama tour setiap hari?**\nTransport & guide asas 10 jam/hari. Jam lebih dicaj (bayar tunai). Island tour biasanya penuh sehari.\n\n**Island hopping sesuai untuk semua?**\nSesuai untuk kebanyakan orang, TAPI **tidak digalakkan untuk warga emas, wanita mengandung atau yang ada masalah kesihatan** — perjalanan speedboat mencabar & berombak.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal senang dapat di Phuket?**\nSangat mudah — Phuket ada komuniti Muslim yang besar. Restoran & gerai halal banyak di **Patong, Phuket Old Town, Kata dan Chalong**. Banzaan Market (Patong) ada gerai halal.\n\n**Lunch dalam island tour halal? (tour sharing)**\nLunch disediakan semasa island tour (Coral Island / Phi Phi Don). ARBA maklum operator awal untuk sediakan pilihan **halal/seafood**. Sahkan dengan consultant semasa booking; bawa snack sebagai backup.\n\n**Kenapa dinner tak included?**\nFullboard pakej = 3 Breakfast + 2 Lunch. Dinner sengaja exclude supaya customer bebas explore makan malam Phuket (halal mudah di Patong & Old Town).\n\n**Macam mana nak solat? Ada masjid/surau?**\nDi pulau (Phi Phi, James Bond, Coral) **tiada masjid** — solat jamak/qasar di bot atau kawasan rehat, bawa sejadah travel & ambil wuduk awal. Di darat: **Masjid Patong (Nanai Road)** & Al-Madani Mosque; ada prayer room di Phuket Airport & Central Festival mall.\n\n**Perlu bawa telekung/sejadah sendiri?**\nSangat digalakkan — bawa telekung & sejadah travel kerana kebanyakan attraction pulau tiada surau.\n\n**Waktu solat sama dengan Malaysia?**\nThailand 1 jam lebih lewat dari Malaysia. Waktu solat lebih kurang sama; ikut jadual tempatan yang guide kongsi.\n\n### C. Visa & Passport\n\n**Perlu visa ke Thailand?**\nTidak. Warganegara Malaysia **bebas visa sehingga 30 hari** (masuk melalui udara) di bawah perjanjian ASEAN.\n\n**Apa itu TDAC & wajib ke?**\nYa, **wajib**. Thailand Digital Arrival Card (TDAC) menggantikan kad kertas TM6. Isi online **percuma** di tdac.immigration.go.th dalam tempoh **3 hari** sebelum ketibaan. **Setiap orang** (termasuk kanak-kanak) perlu satu TDAC. Simpan QR untuk tunjuk di imigresen.\n\n**Passport kena sah berapa lama?**\nMinimum **6 bulan** dari tarikh berlepas, dengan muka surat kosong.\n\n**Bukan warganegara Malaysia macam mana?**\nBergantung kewarganegaraan — sesetengah perlu Visa on Arrival / e-Visa. Semak requirement mengikut passport & tetap perlu isi TDAC.\n\n### D. Flight & Airport\n\n**Flight termasuk dalam pakej?**\nTidak — pakej **ground-only**. ARBA boleh bantu quote bundle flight + ground.\n\n**Flight KL ke Phuket macam mana?**\nDirect **KUL–HKT ~1 jam 25–30 minit**. Banyak pilihan harian:\n\n| Airline | Pergi (KUL→HKT) | Balik (HKT→KUL) |\n|---|---|---|\n| AirAsia X | AK 822 · 3:00 PM → 3:30 PM | AK 823 · 3:40 PM → 6:10 PM |\n| Batik Air Malaysia | OD 540 · 12:00 PM → 12:30 PM | OD 541 · 1:15 PM → 3:45 PM |\n| Malaysia Airlines | MH 794 · 12:55 PM → 1:30 PM | MH 795 · 2:05 PM → 4:40 PM |\n\n**Sampai airport mana?**\nPhuket International Airport (**HKT**), di utara pulau (~45 min–1 jam ke Patong). Driver ARBA tunggu di Arrival dengan papan tanda.\n\n**Kena sampai airport berapa awal?**\nSekurang-kurangnya 3 jam sebelum flight antarabangsa.\n\n**Bila patut tiba Hari 1?**\nCadangan tiba **selepas 12 tengah hari**. Standard: berlepas balik cadangan selepas 4pm (ada city tour Hari 4); Basic: selepas 12 tengah hari.\n\n### E. Hotel & Bilik\n\n**Hotel apa digunakan?**\n3★ default: **Ibis Phuket Kata Beach / Tony Resort Patong Beach / Di Pantai Boutique Beach Resort**. 4★ upgrade: **The Marina Phuket Hotel / Amata Patong Resort / Best Western Patong Beach** (+RM300/pax) — atau setaraf ikut availability.\n\n**Boleh upgrade hotel?**\nBoleh — 4★ +RM300/pax. Semua termasuk breakfast.\n\n**Bilik untuk family / triple?**\nStandard double/twin. Triple = extra bed (tertakluk availability). Untuk bilik family proper, maklum consultant awal.\n\n**Single occupancy macam mana?**\nStandard: Single Supplement +RM450/pax. Basic: quoted upon request — minta PO quote.\n\n### F. Cuaca & Musim\n\n**Bila musim terbaik ke Phuket?**\n**November–April** (musim kering) — laut tenang, langit cerah, terbaik untuk pantai, snorkel & island hopping. Januari paling kering.\n\n**Musim hujan bila?**\n**May–Oktober** (monsun barat daya). September paling lebat. Island hopping boleh terjejas/dibatalkan jika laut bergelora. Kelebihan: harga & crowd lebih rendah.\n\n**Cuaca panas ke?**\nTropika panas lembap (~27–33°C) sepanjang tahun. Bawa sunblock, topi, cermin mata & raincoat kecil.\n\n### G. Shopping & Duit\n\n**Beli apa di Phuket?**\nProduk cashew nut, mutiara (pearl), gula-gula & snack Thai, souvenir di Old Town, Jungceylon & Banzaan Market (Patong).\n\n**Guna duit apa?**\n**Thai Baht (THB)**. Tukar di money changer Malaysia untuk kadar lebih baik. Kad diterima di kebanyakan tempat, tapi **cash lebih meluas** — banyak gerai & add-on pulau prefer tunai.\n\n**Berapa duit poket dicadangkan?**\n**RM500–RM1,500/pax** bergantung tabiat shopping & optional activities (semua meal utama sudah termasuk kecuali dinner).\n\n### H. Payment & Refund\n\n**Deposit dulu atau bayar penuh?**\nDeposit **RM250/pax** semasa confirmation. Baki (full payment) **45 hari** sebelum travel date.\n\n**Harga sah berapa lama?**\nQuotation sah **24 jam** selepas dihantar.\n\n**Late booking ada surcharge?**\nYa — **RM50/booking** jika tempah <45 hari sebelum berlepas.\n\n### I. Add-ons & Customization\n\n**Ada aktiviti tambahan popular?**\nPhuket Aquaria (RM237 adult/RM197 kid), Andamanda Waterpark (RM287/RM247), Banana Boat (RM67–87), Parasailing (RM157–197). Basic boleh upgrade Phi Phi Hari 3 (+RM100/pax).\n\n**Boleh tambah wifi / insurans / luggage tracker?**\nBoleh — Pocket Wifi RoamingMan (3GB RM80 / 10GB RM120 setrip); Takaful TripCare 360 (Individu RM45 / Couple RM79 / Family RM100); Luggage tracker Blue Ribbon RM20–70.\n\n### J. Kesihatan & Keselamatan\n\n**Selamat bawa anak & warga emas?**\nPhuket selamat & mesra keluarga. TAPI island hopping (speedboat) tidak digalakkan untuk warga emas, wanita mengandung atau yang ada masalah kesihatan — laut boleh bergelora.\n\n**Hati-hati apa di attraction?**\n**Monyet** di sesetengah viewpoint & pulau boleh agresif — jangan beri makan, jaga barang (kamera, cermin mata, beg). Ikut arahan guide semasa snorkel.\n\n**Kalau emergency?**\nGuide standby sepanjang trip; hospital tersedia di Phuket Town. Sangat digalakkan ambil travel insurance/Takaful (add-on).\n\n### K. Praktikal (SIM, Socket, Toilet)\n\n**Internet/SIM di Phuket?**\nSIM tempatan Thailand ada di airport, atau guna **roaming/eSIM**, atau **pocket wifi** RoamingMan (add-on ARBA, RM80–120/trip).\n\n**Plug socket jenis apa?**\nKebanyakan Type A/B/C — soket Thailand terima palam 2-pin flat & round. Bawa universal adaptor. Simpan power bank & charger dalam hand carry.\n\n**Toilet ada paip/hose?**\nKebanyakan toilet ada hose/bidet. Bawa botol spray kecil & tisu untuk keselesaan, terutama di pulau.\n\n### L. Packing / Barang Bawa\n\n**Barang basic untuk trip Phuket? (checklist)**\nPassport (sah ≥6 bulan) + TDAC QR, pakaian ringan menutup aurat, pakaian ibadah (telekung & sejadah travel), baju renang sopan/rashguard untuk snorkel, sunblock kalis air, topi & cermin mata, raincoat kecil, ubat mabuk laut (island hopping berombak), power bank & universal adaptor (hand carry), kasut selesa + selipar, dan duit poket RM500–RM1,500 (tukar THB di Malaysia).\n\n**Snorkeling kena bawa apa?**\nGear snorkel biasanya disediakan tour. Bawa baju renang sopan/rashguard, sunblock kalis air, baju ganti & beg kalis air untuk telefon.\n"}</script>

  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=(d.dataset.text||d.textContent||"").toLowerCase().includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});

    var newAcc=find(ACC,pr.acc),newTrp=find(TRP,pr.trp);
    if(d.ext){
      if(EXTD.acc&&newAcc.cost==="incl")d.acc=EXTD.acc;
      if(EXTD.trp&&newTrp.cost==="incl")d.trp=EXTD.trp;
      return;
    }
    /* Jadi hari tambahan berkos bila pakej tiada transport untuk hari ini, ATAU bila
       hari ini sudah ditanda tambahan sebelum ini (tukar blok lagi jangan hilangkan kos). */
    if(EXTD.trp&&newTrp.guided&&newTrp.cost==="incl"&&(!wasGuided||wasExt))d.trp=EXTD.trp;
    /* Kekalkan tolakan bila hari berpandu pakej ditukar kepada blok tanpa guide —
       KECUALI blok itu sendiri sudah bawa kos (contoh KTX / flight pindah bandar),
       kerana pilihannya sendiri yang betul, bukan pilihan tolakan. */
    else if(EXTD.trpDrop&&!newTrp.guided&&newTrp.cost==="zero"&&!hasOwnCost(newTrp)
            &&(wasGuided||wasDrop))
      d.trp=EXTD.trpDrop;
  }
  function mkDay(p,isExt,baseRegion){
    var pr=find(presets(),p||"ext");
    var d={preset:pr.v,custom:"",date:"",acc:pr.acc,meal:pr.meal,trp:pr.trp,
           ext:!!isExt,baseRegion:baseRegion||"",
           addons:[{i:0,qa:0,qc:0,auto:false}],open:false};
    applyPreset(d,pr);
    return d;
  }
  function loadDefault(){
    days=presets().slice(0,V().itin.length).map(function(p){return mkDay(p.v,false,p.region);});
  }
  function lastIdx(){return days.length-1;}
  function autoDates(){var dep=$c("c_dep").value;days.forEach(function(d,i){d.date=dep?shift(dep,i):"";});}
  function syncReturn(){var dep=$c("c_dep").value;if(dep)$c("c_ret").value=shift(dep,days.length-1);}
  function syncDaysToDates(){
    var dep=$c("c_dep").value,ret=$c("c_ret").value;
    if(!dep||!ret)return;
    var target=daysBetween(dep,ret)+1;
    if(target<2||target>60){syncReturn();return;}
    while(days.length<target)days.splice(Math.max(1,lastIdx()),0,mkDay("ext",true));
    while(days.length>target&&days.length>2)days.splice(Math.max(1,lastIdx()-1),1);
    autoDates();
  }

  /* ---------- kadar bergantung musim ---------- */
  function payPax(){return n("c_adult")+n("c_cwb")+n("c_cnb");}
  function vehicles(){return Math.max(1,Math.ceil((payPax()||1)/(EX().paxPerVehicle||7)));}
  function isPeakTrip(){return (state.season&&state.season.peakNights)>0;}
  /* Kadar extension boleh datang dalam dua bentuk:
       ext.night / ext.day        -> satu pasang {normal,peak} untuk semua saiz group
       ext.nightTiers / dayTiers  -> [{from,to,normal,peak}] bila kadar ikut bilangan pax
                                     (contoh NZ: transport RM2300 untuk 2-3 pax, RM3600 untuk 7-10)
     Padanan tier ikut julat PERTAMA yang muat, sama seperti tierRow(), jadi julat
     bertindih dalam rate sheet (2-3, 3-4, 4-5 ...) berkelakuan seperti bracket kapasiti. */
  function extTier(list,p){
    for(var i=0;i<list.length;i++)if(p>=list[i].from&&p<=list[i].to)return list[i];
    return p<list[0].from?list[0]:list[list.length-1];
  }
  function extRate(flat,tiers){
    var r=(tiers&&tiers.length)?extTier(tiers,payPax()||1):(flat||{normal:0,peak:0});
    return isPeakTrip()?(r.peak||0):(r.normal||0);
  }
  function nightRate(){var e=EX();return extRate(e.night,e.nightTiers);}
  /* Pilihan accommodation boleh bawa `nightRate` (kunci ext.rates) kalau malam
     tambahannya ada kadar tersiar sendiri — contoh malam 4 bintang RM400 (ProdReq 7),
     bukan malam 3 bintang RM250 campur upgrade. Kalau tiada, ext.night dipakai. */
  function accNightRate(o,region){
    if(o&&o.nightRate){var a=rateAmt(o.nightRate,region);return a==null?0:a;}
    return nightRate();
  }
  /* ---------- breakfast ikut varian ----------
     Sesetengah pakej memang sudah termasuk breakfast hotel dan sesetengah tidak
     (Perth: Standard 3 bintang apartment tanpa breakfast, Premium 4 bintang hotel
     dengan breakfast). Blok itinerary DIKONGSI antara varian, jadi blok yang
     membawa breakfast akan menjanjikan breakfast yang tidak dijual bila dipilih
     pada varian Standard -- dan menjatuhkannya bila blok tanpa breakfast dipilih
     pada Premium. `variants[].breakfast` memaksa komponen breakfast mengikut
     varian supaya TC tidak perlu fikir, dan mealDelta kekal neutral kerana
     baseline dan pilihan semasa kedua-duanya dinormalkan oleh mealOf().
     Pilihan bertanda `bfLock` dikecualikan -- guna untuk hari ketibaan, yang tiada
     breakfast pada mana-mana varian. Tanpa `variants[].breakfast`, mealOf() pulang
     pilihan itu sendiri, jadi config destinasi lain tidak berubah sama sekali. */
  function bfOn(){var v=V();return (v&&v.breakfast!=null)?!!v.breakfast:null;}
  function mealOf(key){
    var o=find(MEAL,key),on=bfOn();
    if(on===null||!o||o.bfLock)return o;
    var c={},k;for(k in o)c[k]=o[k];
    c.b=on?1:0;
    var parts=String(o.lbl==null?"":o.lbl).split(", ").filter(function(x){
      return x&&x!=="-"&&!/breakfast/i.test(x);});
    if(on)parts.unshift(CFG.breakfastLabel||"Hotel Breakfast");
    c.lbl=parts.length?parts.join(", "):"-";
    return c;
  }
  function mealRate(){return CFG.meals||{lunch:0,dinner:0};}
  /* Bilangan hidangan satu pilihan meal (breakfast + lunch + dinner).
     Bila varian mengisytiharkan `breakfast`, breakfast ialah komponen BILIK, bukan
     hidangan yang boleh dijual atau dikreditkan satu-satu - jadi ia dikeluarkan dari
     kiraan mealDelta sepenuhnya. Tanpa ini, memilih kod `bfLock` (hari ketibaan) pada
     hari hotel akan MENGKREDITKAN breakfast, dan TC boleh 'jual balik' breakfast yang
     memang datang bersama bilik. */
  function mealCount(o){
    if(!o)return 0;
    var bf=bfOn()===null?(o.b?1:0):0;
    return bf+(o.l?1:0)+(o.d?1:0);
  }
  /* CFG.mealDelta = {add, drop} - kadar per pax PER HIDANGAN bila TC menambah atau
     membuang hidangan berbanding apa yang blok itinerary itu sendiri isytiharkan.
     Ini menyelesaikan dua masalah sekaligus:
       - CFG.meals mengenakan SETIAP lunch/dinner dalam itinerari, termasuk yang sudah
         ada dalam harga katalog -> double-count. Sebab itu ia diset 0.
       - Tetapi dengan 0, menukar dropdown meal jadi PERCUMA secara senyap.
     Delta berbanding blok menyelesaikan kedua-duanya: tiada perubahan = RM 0, dan
     setiap hidangan yang ditambah/dibuang dicaj pada kadarnya sendiri (tidak simetri:
     tambah RM45, tolak RM30). Baseline ialah `meal` blok itu, bukan indeks hari, jadi
     ia kekal betul walaupun hari disusun semula atau ditambah. */
  function mealDeltaOf(d,pr,pay){
    var md=CFG.mealDelta;if(!md)return null;
    var basen=mealCount(mealOf((pr&&pr.meal)||d.meal)),
        curn=mealCount(mealOf(d.meal)),dn=curn-basen;
    if(!dn)return null;
    var per=dn>0?dn*(md.add||0):dn*(md.drop||0);
    return {meals:dn,perPax:per,total:per*(pay||0)};
  }
  /* Kos makan satu hari untuk satu pax, ikut pilihan meal yang dipilih. */
  function mealAmt(o){var m=mealRate();
    return (o.l||0)*(m.lunch||0)+(o.d||0)*(m.dinner||0);}
  /* Hint yang menyebut kadar sebenar, bukan "ikut kadar makan" yang kabur. */
  function mealHint(o){
    var m=mealRate(),b=[];
    if(o.l&&m.lunch)b.push(o.l+" lunch x "+rm0(m.lunch));
    if(o.d&&m.dinner)b.push(o.d+" dinner x "+rm0(m.dinner));
    if(b.length)return b.join(" + ")+" = "+sgn(mealAmt(o))+" per pax";
    if(o.l||o.d)return "Kadar makan belum diisi &mdash; untuk paparan quotation sahaja";
    return "";
  }
  /* Hari "berpandu" = hari yang ada transport + guide (pilihan bertanda guided:true).
     `free` = berpandu tetapi dikira sebagai bahagian pakej (cost incl);
     `paid` = berpandu tetapi dicaj sebagai hari tambahan (cost day). */
  function guidedOf(list){
    var free=0,paid=0;
    list.forEach(function(x){
      var o=find(TRP,x.trp);
      if(!o||!o.guided)return;
      if(o.cost==="day")paid++;else free++;
    });
    return {free:free,paid:paid,total:free+paid};
  }
  function guidedBase(){return guidedOf(V().itin||[]);}

  /* ---------- kadar berkunci: kunci -> region -> band pax -> normal/peak ----------
     ext.rates = { kunci: { "<region>"|"_default": [{from,to,normal,peak}] } }
     Satu mekanisme untuk semua kadar yang bergantung pada kawasan itinerary, saiz
     group dan musim. Pulang null bila kunci/region/band tiada dalam sumber — pemanggil
     menandakannya sebagai 'kadar belum diisi' supaya TC nampak, bukan diam-diam free. */
  function rateAmt(key,region){
    var m=(EX().rates||{})[key];
    if(!m)return null;
    var list=(region&&m[region])||m._default;
    if(!list||!list.length)return null;
    var b=extTier(list,payPax()||1);
    var a=isPeakTrip()?(b.peak!=null?b.peak:b.normal):b.normal;
    return (a==null)?null:a;
  }
  /* Kadar hari extension. Kalau config ada ext.rates.day, ia MENGGANTIKAN ext.day —
     tiada fallback senyap, sebab region tanpa kadar tersiar mesti kelihatan sebagai gap. */
  /* Adakah destinasi ini memang ada kadar ikut kawasan? Destinasi tanpa ProdReq
     (contoh Switzerland) hanya ada `_default`, jadi menyuruh TC "pilih blok supaya
     kadar ikut kawasan" mengelirukan — tiada blok yang akan mengubahnya. */
  function hasRegions(){
    var m=(EX().rates||{}).day;
    if(!m)return false;
    for(var k in m)if(Object.prototype.hasOwnProperty.call(m,k)&&k!=="_default")return true;
    return false;
  }
  function dayRateFor(region){
    var e=EX();
    if(e.rates&&e.rates.day){var a=rateAmt("day",region);return{amt:a||0,gap:!a};}
    var f=extRate(e.day,e.dayTiers);return{amt:f,gap:!f};
  }
  function dayRate(region){return dayRateFor(region).amt;}
  /* Apa yang satu pilihan dropdown tambah (atau tolak) untuk satu hari.
     perPax / perVehicle = nombor literal; perPaxRate / perVehicleRate = kunci ext.rates. */
  function optAmt(o,region){
    var perPax=0,perVeh=0,gap=false;
    /* perVehicleQty: berapa kali kos per-kenderaan itu berlaku dalam SATU hari.
       Contoh pindah bandar perlu 2 transfer (hotel->stesen, stesen->hotel). */
    var vq=(o.perVehicleQty!=null)?o.perVehicleQty:1;
    if(o.perPax!=null)perPax+=o.perPax;
    if(o.perVehicle!=null)perVeh+=o.perVehicle*vq;
    /* Kadar 0 biasanya bermakna "tiada kadar tersiar" -> gap (itu kontrak asal, dan
       Krabi/Perth bergantung padanya). Tetapi sesetengah katalog memang menyiarkan
       SIFAR: Semporna v4 tulis "-" untuk upgrade Seafest Boutique dan Nusakuya /
       Blue Ocean (harga sama dengan base, cuma surcaj peak berbeza). Pilihan
       bertanda `zeroOk` mengaku sifar itu memang harga tersiar, jadi tiada cip
       merah palsu. Pilihan tanpa tanda ini tidak berubah sama sekali. */
    if(o.perPaxRate){var a=rateAmt(o.perPaxRate,region);
      if(a==null||(!a&&!o.zeroOk))gap=true;perPax+=a||0;}
    if(o.perVehicleRate){var b=rateAmt(o.perVehicleRate,region);
      if(b==null||(!b&&!o.zeroOk))gap=true;perVeh+=(b||0)*vq;}
    return {unitPax:perPax,unitVeh:perVeh,
            pax:perPax*payPax(),veh:perVeh*vehicles(),gap:gap};
  }
  /* label Inggeris untuk baris quotation; `t` kekal Melayu untuk UI KB */
  function optLine(o){return o.line||o.t;}

  /* Dengan autoNights, malam tambahan dikira di peringkat TRIP (panjang trip vs
     `variants[].nights`), jadi ia tidak berlabuh pada mana-mana hari secara semula
     jadi - baris hari jadi bisu walaupun grand total naik RM300/pax. Peta ini
     menetapkan hari MANA yang menanggung setiap malam tambahan, supaya ia boleh
     diflagkan berasingan daripada kos transport.
     Keutamaan: hari yang TC tambah sendiri (`ext`) dahulu; kalau masih berbaki
     (contoh return date ditarik tanpa hari ditanda ext), ambil dari hari terakhir. */
  function extraNightMap(){
    var autoN=!!EX().autoNights;if(!autoN)return {};
    var base=V().nights||0,selfDrop=0;
    days.forEach(function(x){var ac=find(ACC,x.acc);if(ac.dropsNight)selfDrop++;});
    var over=Math.max(0,Math.max(0,days.length-1-selfDrop)-base);
    var map={},n=0;
    days.forEach(function(x,i){
      if(n>=over)return;
      var ac=find(ACC,x.acc);
      if(x.ext&&ac.cost!=="zero"&&!ac.dropsNight){map[i]=1;n++;}
    });
    for(var i=days.length-1;i>=0&&n<over;i--){
      if(map[i])continue;
      var ac2=find(ACC,days[i].acc);
      if(ac2.cost!=="zero"&&!ac2.dropsNight){map[i]=1;n++;}
    }
    return map;
  }
  function dayParts(d,idx){
    var pay=payPax(),mr=mealRate(),reg=dayRegion(d);
    var pr=find(presets(),d.preset);
    var ml=mealOf(d.meal),tp=find(TRP,d.trp),ac=find(ACC,d.acc),c=0,gap=false;
    /* Setiap tambah/tolak dikumpul sebagai satu entri supaya baris hari boleh
       memaparkannya satu-persatu - TC perlu tahu item mana sudah ditolak, bukan
       sekadar satu jumlah bersih. `scope:"trip"` = amaun itu dikira di peringkat
       keseluruhan trip (bukan hari), jadi ia dipapar sebagai maklumat sahaja dan
       TIDAK ditambah ke dalam kos hari (elak kira dua kali). */
    var adj=[];
    function A(label,amt,scope){if(amt)adj.push({label:label,amt:amt,scope:scope||"day"});}
    /* Malam tambahan yang kadarnya datang dari `nightRate` boleh tiada kadar tersiar
       untuk kawasan/musim itu (contoh NZ: rate sheet hanya ada lajur peak). Itu satu
       gap, bukan malam percuma - tandakannya seperti gap kadar transport. */
    if(ac.cost==="night"){var _nr=accNightRate(ac,reg);c+=_nr*pay;
      A("Malam tambahan "+rm0(_nr)+"/pax",_nr*pay);
      if(ac.nightRate&&!_nr)gap=true;}
    var mfix=(ml.l*mr.lunch+ml.d*mr.dinner)*pay;
    c+=mfix; A("Meal",mfix);
    /* delta meal berbanding blok - inilah yang membuat dropdown meal tidak lagi percuma */
    var mdl=mealDeltaOf(d,pr,pay);
    if(mdl){c+=mdl.total;
      A((mdl.meals>0?"Tambah ":"Tolak ")+Math.abs(mdl.meals)+" meal "+
        sgn(mdl.perPax)+"/pax",mdl.total);}
    if(tp.cost==="day"){var dr=dayRateFor(reg);c+=dr.amt*vehicles();
      A("Transport"+(reg?" "+reg:""),dr.amt*vehicles());if(dr.gap)gap=true;}
    [ac,ml,tp].forEach(function(o){var a=optAmt(o,reg);c+=a.pax+a.veh;
      if(a.pax)A(optLine(o)+" "+sgn(a.pax/(pay||1))+"/pax",a.pax);
      if(a.veh)A(optLine(o),a.veh);
      if(a.gap)gap=true;});
    /* Tolakan malam yang ditanggung di peringkat trip (pilihan dropsNight). Ia TIDAK
       masuk kos hari, tetapi mesti kelihatan pada hari itu - kalau tidak baris hari
       tulis "Termasuk" sedangkan grand total turun. */
    /* CFG.dropOwnRate (opt-in): bila pilihan 'tanpa hotel' membawa perPaxRate
       sendiri, tolakannya SUDAH diitemise oleh gelung optAmt di atas — baris trip
       tambahan di sini akan mengira dua kali pada cip hari (grand total tidak
       terjejas). Destinasi tanpa flag ini kekal seperti dulu. */
    if(ac.dropsNight&&!(CFG.dropOwnRate&&ac.perPaxRate)){
      var ns=rateAmt("nightShort","");
      if(ns)adj.push({label:"Tolak 1 malam pakej "+sgn(ns)+"/pax",amt:ns*pay,scope:"trip"});
    }
    /* Malam tambahan hotel - diflagkan BERASINGAN daripada transport, guna kadar
       sebenar yang terpakai (normal atau peak, ikut tarikh trip). */
    if(idx!=null&&extraNightMap()[idx]){
      var nr=nightRate();
      adj.push({label:"Malam tambahan hotel "+(nr?sgn(nr)+"/pax":"kadar belum diisi"),
                amt:nr*pay,scope:"trip"});
    }
    d.addons.forEach(function(a){var q=ADDONS[a.i];
      if(!a.i)return;
      var at=a.qa*q[1]+a.qc*(q[2]||0);c+=at;A(q[0],at);});
    adj.forEach(function(x){if(x.scope==="trip")c+=x.amt;});
    return {cost:c,gap:gap,region:reg,adj:adj};
  }
  function dayCost(d,idx){return dayParts(d,idx).cost;}

  /* ---------- render baris hari ---------- */
  function dayHtml(d,idx){
    var P=dropdownPresets(),pr=find(presets(),d.preset);
    var nm=d.preset==="cus"?(d.custom||"Custom"):pr.t;
    var ml=mealOf(d.meal),tp=find(TRP,d.trp),ac=find(ACC,d.acc);
    var parts=dayParts(d,idx),cost=parts.cost,reg=parts.region;
    /* Destinasi sebenar hari ini. Nama hari sahaja ("Seoul City") tidak cukup
       untuk TC semak itinerary, jadi senarai ini dipapar terus pada baris hari. */
    var acts=(pr.act&&pr.act.length)?pr.act:[];
    var dt=d.date?dfmt(parseIso(d.date)):"Tiada tarikh";
    /* hint setiap medan: kadar sebenar yang dikenakan untuk hari ini, ikut region */
    function hint(o,base){
      var a=optAmt(o,reg),bits=[];

        "<input class='qin d-aqc' type='number' min='0' value='"+a.qc+"' title='"+
        (a.auto?"Qty kanak-kanak - diisi sendiri ikut pax, boleh ubah":"Qty kanak-kanak")+"'>"+

    }).join("");
    return "<details class='dayc'"+(d.open?" open":"")+" data-i='"+idx+"'>"+
      "<summary draggable='true'><span class='dgrip' title='Seret untuk susun semula'>&#10303;</span>"+
      "<span class='dnum"+(d.ext?" dnumx":"")+"'"+
      (d.ext?" title='Hari tambahan &mdash; berkos di atas harga katalog'":"")+">"+
      (idx+1)+"</span><span class='ddate'>"+dt+"</span>"+
      "<span class='dname'><span class='dnm'>"+esc2(nm)+"</span>"+
      (acts.length?"<span class='dprev'>"+esc2(acts.join(" \u00b7 "))+"</span>":"")+"</span>"+
      "<span class='dchips'>"+(reg?"<span class='dchip dreg'>"+esc2(reg)+"</span>":"")+
      "<span class='dchip'>"+ml.t+"</span>"+
      "<span class='dchip'>"+(reg&&tp.guided?reg+" ":"")+tp.t.replace(/ \(.*\)/,"")+"</span>"+
      (parts.gap?"<span class='dchip dwarn' title='Kadar untuk kawasan ini tiada dalam katalog/ProdReq'>kadar?</span>":"")+
      /* Blok bertanda mustPick ialah placeholder: hari itu belum berlabuh pada mana-mana
         segmen rate card, jadi kosnya BELUM ditetapkan. Tandakan merah supaya ia tidak
         boleh terlepas senyap ke dalam quotation. */
      (pr&&pr.mustPick?"<span class='dchip dwarn' title='Hari ini belum berlabuh pada segmen rate card - pilih satu blok itinerary'>pilih blok</span>":"")+
      /* Satu cip per tambah/tolak, supaya TC nampak item mana sudah ditolak dan

      (parts.adj||[]).map(function(x){
        return "<span class='dchip dadj"+(x.amt<0?" dded":"")+
          (x.scope==="trip"?" dtrip":"")+"' title='"+
          (x.scope==="trip"
            ?"Dikira di peringkat keseluruhan trip, bukan hari ini"
