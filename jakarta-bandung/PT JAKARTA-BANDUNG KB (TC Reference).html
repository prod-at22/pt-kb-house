ory", "Jalan Asia Afrika"]}, {"d": 3, "t": "Lembang - Sightseeing, Shopping & Food Tour", "m": "Breakfast / Lunch / Dinner", "a": ["The Lodge Maribaya", "Floating Market Lembang", "Farm House Lembang", "Rumah Mode", "Ole Ole Tiga Rasa"]}, {"d": 4, "t": "Bandung - Jakarta City Tour - Berlepas", "m": "Breakfast", "a": ["Ole Ole Kartika Sari", "Land transfer Bandung ke Jakarta (kira-kira 3 jam)", "Optional tour tertakluk waktu penerbangan balik: Monumen Nasional (Monas), Masjid Istiqlal Jakarta, Mangga Dua / Tanah Abang", "Airport drop di Soekarno-Hatta International Airport (CGK)"]}], [{"d": 1, "t": "Ketibaan Jakarta - Whoosh Train - Shopping Tour Bandung", "m": "Lunch / Dinner", "a": ["Airport pickup di Soekarno-Hatta International Airport (CGK). Waktu ketibaan disyorkan 12 tengah hari atau lebih awal", "Whoosh Train Jakarta ke Bandung (Economy Seat) - perjalanan 40-45 minit", "Rumah Kain Sulam M Collection", "Rumah Textile", "Check-in hotel 3 bintang, Bandung"]}, {"d": 2, "t": "Option B - Kopi Luwak Cikole, Orchid Forest & Lembang Park Zoo", "m": "Breakfast / Lunch / Dinner", "a": ["Kopi Luwak Cikole", "Orchid Forest Cikole", "Lembang Park & Zoo", "Toko Tiga Jeans Factory", "Jalan Asia Afrika"]}, {"d": 3, "t": "Lembang - Sightseeing, Shopping & Food Tour", "m": "Breakfast / Lunch / Dinner", "a": ["The Lodge Maribaya", "Floating Market Lembang", "Farm House Lembang", "Rumah Mode", "Ole Ole Tiga Rasa"]}, {"d": 4, "t": "Bandung - Jakarta City Tour - Berlepas", "m": "Breakfast", "a": ["Ole Ole Kartika Sari", "Land transfer Bandung ke Jakarta (kira-kira 3 jam)", "Optional tour tertakluk waktu penerbangan balik: Monumen Nasional (Monas), Masjid Istiqlal Jakarta, Mangga Dua / Tanah Abang", "Airport drop di Soekarno-Hatta International Airport (CGK)"]}]], "attractions": [{"n": "Kawah Putih", "t": "Alam · Option A", "img": "", "short": "Tasik kawah gunung berapi berwarna putih kebiruan, 50km dari Bandung.", "intro": "Kawah gunung berapi tercantik di Indonesia dan tarikan anchor pakej ini. Tasik terbentuk daripada letusan Gunung Patuha, dengan air berwarna putih kebiruan kerana kandungan sulfur yang tinggi. Warna air berubah mengikut cuaca dan kandungan mineral. Terletak di Ciwidey, kira-kira 2 jam pemanduan dari bandar Bandung.", "hi": ["Tasik kawah dengan air putih kebiruan yang ikonik", "Latar hutan dan tebing kawah untuk fotografi", "Udara sejuk dataran tinggi Ciwidey"], "best": "Pagi hingga tengah hari pada dry season (April hingga Oktober) - warna air paling cantik ketika cuaca cerah.", "muslim": "Terdapat surau dan tandas di kawasan kemudahan pengunjung. Makan tengah hari di restoran halal tempatan dalam perjalanan. Bau sulfur kuat - sediakan face mask, terutama untuk yang ada masalah pernafasan.", "map": "https://www.google.com/maps/search/?api=1&query=Kawah+Putih+Ciwidey"}, {"n": "Glamping Lakeside Rancabali", "t": "Alam · Option A", "img": "", "short": "Kawasan glamping tepi tasik dengan kafe dan spot foto.", "intro": "Kawasan rekreasi tepi Situ Patenggang di Rancabali, terkenal dengan pod glamping berbentuk unik, kafe tepi tasik dan taman berlandskap. Berdekatan Kawah Putih, jadi kedua-duanya dilawati pada hari yang sama dalam Option A.", "hi": ["Pemandangan tasik Situ Patenggang", "Pod glamping dan spot foto berlandskap", "Kafe tepi tasik untuk rehat"], "best": "Tengah hari selepas Kawah Putih.", "muslim": "Terdapat surau di kawasan kompleks. Makanan di kafe - pelanggan disarankan semak dengan guide sebelum membeli; makan utama disediakan di restoran halal mengikut itinerari.", "map": "https://www.google.com/maps/search/?api=1&query=Glamping+Lakeside+Rancabali"}, {"n": "Rengganis Bridge & Keranjang Sultan", "t": "Adventure · Option A", "img": "", "short": "Jambatan gantung 370 meter, terpanjang di Asia Tenggara, dengan buaian Keranjang Sultan.", "intro": "Jambatan gantung sepanjang 370 meter yang merentasi hutan dan kawasan kawah Rengganis - jambatan gantung terpanjang di Asia Tenggara. Tarikan paling famous di sini ialah Keranjang Sultan, sejenis buaian gergasi. Pakej termasuk chairlift.", "hi": ["Jambatan gantung 370 meter merentasi hutan", "Keranjang Sultan - buaian gergasi dengan pemandangan lembah", "Chairlift disertakan dalam pakej"], "best": "Tengah hari hingga petang, cuaca cerah.", "muslim": "Terdapat surau dan tandas di kawasan pintu masuk. Aktiviti sesuai untuk pelanggan berpakaian menutup aurat - ada tali pinggang keselamatan disediakan. Baby boleh naik dengan duduk atas riba parent.", "map": "https://www.google.com/maps/search/?api=1&query=Rengganis+Suspension+Bridge+Ciwidey"}, {"n": "Kopi Luwak Cikole", "t": "Budaya · Option B", "img": "", "short": "Ladang kopi luwak di Cikole dengan sesi rasa dan penerangan proses.", "intro": "Kawasan ladang dan galeri kopi luwak di Cikole, Lembang. Pengunjung dapat melihat proses penghasilan kopi dan mencuba pelbagai jenis kopi tempatan. Menggantikan Trans Studio dalam itinerari Option B semasa.", "hi": ["Penerangan proses penghasilan kopi luwak", "Sesi rasa pelbagai jenis kopi tempatan", "Suasana sejuk kawasan Cikole"], "best": "Pagi Hari 2 sebelum ke Orchid Forest.", "muslim": "Minuman dan makanan ringan di kafe - semak dengan guide. Terdapat surau berdekatan di kawasan Cikole.", "map": "https://www.google.com/maps/search/?api=1&query=Kopi+Luwak+Cikole+Lembang"}, {"n": "Orchid Forest Cikole", "t": "Alam · Option B", "img": "", "short": "Taman orkid dalam hutan pain dengan jambatan gantung dan taman lampu.", "intro": "Taman orkid terbesar di Indonesia, terletak dalam hutan pain di Cikole, Lembang. Antara tarikan utama ialah rumah orkid, jambatan gantung Wood Bridge, dan laluan berjalan dalam hutan. Suasana sejuk dan sesuai untuk keluarga.", "hi": ["Koleksi orkid dalam rumah kaca", "Wood Bridge - jambatan gantung dalam hutan pain", "Laluan santai sesuai untuk keluarga dan warga emas"], "best": "Tengah hari Hari 2 - cuaca sejuk sepanjang tahun.", "muslim": "Terdapat surau dan tandas dalam kawasan taman. Kafe di dalam kawasan - makan utama disediakan di restoran halal mengikut itinerari.", "map": "https://www.google.com/maps/search/?api=1&query=Orchid+Forest+Cikole"}, {"n": "Lembang Park & Zoo", "t": "Keluarga · Option B", "img": "", "short": "Zoo dan taman rekreasi keluarga di Lembang.", "intro": "Zoo dan taman rekreasi di Lembang dengan koleksi haiwan, kawasan interaksi haiwan, taman permainan dan kawasan piknik. Pilihan utama Option B untuk keluarga dengan anak kecil.", "hi": ["Koleksi haiwan dan kawasan interaksi", "Taman permainan kanak-kanak", "Kawasan lapang sesuai untuk keluarga"], "best": "Petang Hari 2.", "muslim": "Terdapat surau dan tandas dalam kawasan zoo. Gerai makanan dalam kawasan - semak status halal dengan guide sebelum membeli.", "map": "https://www.google.com/maps/search/?api=1&query=Lembang+Park+and+Zoo"}, {"n": "The Lodge Maribaya", "t": "Alam · Hari 3", "img": "", "short": "Taman rekreasi hutan pain dengan spot foto ikonik dan aktiviti ketinggian.", "intro": "Taman rekreasi di Maribaya, Lembang, terkenal dengan spot foto di atas hutan pain seperti Sky Tree, Zip Bike dan Hot Air Balloon. Kira-kira 1 jam dari bandar Bandung. Tiket masuk termasuk dalam pakej; Zip Bike adalah add-on RM 10 hingga RM 15 yang dibayar terus di lokasi.", "hi": ["Spot foto ketinggian di atas hutan pain", "Zip Bike sebagai add-on di lokasi", "Udara sejuk kawasan Maribaya"], "best": "Pagi Hari 3.", "muslim": "Terdapat surau dan tandas di kawasan taman. Restoran dan kafe dalam kawasan - makan utama disediakan di restoran halal mengikut itinerari.", "map": "https://www.google.com/maps/search/?api=1&query=The+Lodge+Maribaya+Lembang"}, {"n": "Floating Market Lembang", "t": "Makanan · Hari 3", "img": "", "short": "Pasar terapung di atas tasik dengan gerai makanan dan taman bertema.", "intro": "Pasar terapung di atas tasik di Lembang - penjual berniaga dari atas bot. Selain gerai makanan, terdapat taman bertema, taman bunga dan Rainbow Slide (add-on RM 10 hingga RM 15). Restoran Saung Leuit di dalam kawasan adalah antara restoran yang digunakan pakej.", "hi": ["Gerai makanan di atas bot di tengah tasik", "Taman bertema dan taman bunga untuk fotografi", "Rainbow Slide sebagai add-on di lokasi"], "best": "Tengah hari Hari 3, digabungkan dengan makan tengah hari.", "muslim": "Terdapat surau dan tandas di kawasan pasar. Makan tengah hari disediakan di Restoran Saung Leuit dalam kawasan ini - halal.", "map": "https://www.google.com/maps/search/?api=1&query=Floating+Market+Lembang"}, {"n": "Farm House Lembang", "t": "Keluarga · Hari 3", "img": "", "short": "Taman bertema ala Eropah dengan rumah hobbit dan ladang haiwan.", "intro": "Taman bertema berkonsep kampung Eropah di Lembang - terkenal dengan rumah hobbit, kawasan ladang haiwan (kambing dan arnab), dan spot foto bertema Belanda. Tiket masuk termasuk dalam pakej.", "hi": ["Rumah hobbit dan bangunan bertema Eropah", "Ladang haiwan - beri makan kambing dan arnab", "Spot foto popular untuk keluarga"], "best": "Petang Hari 3.", "muslim": "Terdapat surau dan tandas di kawasan taman. Gerai makanan dan kafe dalam kawasan - semak status halal dengan guide.", "map": "https://www.google.com/maps/search/?api=1&query=Farm+House+Lembang"}, {"n": "Jalan Asia Afrika", "t": "Bandar · Hari 2", "img": "", "short": "Jalan bersejarah pusat bandar Bandung dengan bangunan kolonial.", "intro": "Jalan bersejarah di pusat bandar Bandung, tempat berlangsungnya Persidangan Asia-Afrika 1955. Dibarisi bangunan seni bina kolonial termasuk Gedung Merdeka dan Hotel Savoy Homann. Kawasan pejalan kaki popular untuk fotografi waktu petang.", "hi": ["Gedung Merdeka - lokasi Persidangan Asia-Afrika 1955", "Bangunan seni bina kolonial Belanda", "Kawasan pejalan kaki di pusat bandar"], "best": "Petang Hari 2 selepas shopping.", "muslim": "Masjid dan surau mudah dijumpai di sekitar pusat bandar Bandung. Banyak restoran halal berdekatan.", "map": "https://www.google.com/maps/search/?api=1&query=Jalan+Asia+Afrika+Bandung"}, {"n": "Masjid Istiqlal Jakarta", "t": "Ibadah · Hari 4 (optional)", "img": "", "short": "Masjid terbesar di Asia Tenggara, berhadapan Katedral Jakarta.", "intro": "Masjid negara Indonesia dan masjid terbesar di Asia Tenggara, mampu memuatkan lebih 200,000 jemaah. Terletak berhadapan Katedral Jakarta - simbol keharmonian antara agama. Lawatan tertakluk kepada waktu penerbangan balik pada Hari 4.", "hi": ["Masjid terbesar di Asia Tenggara", "Seni bina moden dengan kubah utama dan menara tunggal", "Berhadapan Katedral Jakarta dan berdekatan Monas"], "best": "Pagi hingga tengah hari Hari 4, tertakluk waktu penerbangan balik.", "muslim": "Ini sendiri adalah lokasi ibadah - solat berjemaah di masjid. Tempat wuduk, tandas dan ruang solat wanita berasingan disediakan. Pengunjung wanita perlu berpakaian menutup aurat; jubah pinjaman disediakan di pintu masuk pelawat.", "map": "https://www.google.com/maps/search/?api=1&query=Masjid+Istiqlal+Jakarta"}, {"n": "Monumen Nasional (Monas)", "t": "Bandar · Hari 4 (optional)", "img": "", "short": "Tugu peringatan kemerdekaan Indonesia setinggi 132 meter di Medan Merdeka.", "intro": "Tugu peringatan kemerdekaan Indonesia setinggi 132 meter di tengah Medan Merdeka, Jakarta Pusat. Puncaknya bersalut emas. Kawasan taman sekeliling popular untuk berjalan santai. Lawatan tertakluk kepada waktu penerbangan balik.", "hi": ["Tugu setinggi 132 meter dengan puncak bersalut emas", "Taman Medan Merdeka yang luas", "Berdekatan Masjid Istiqlal"], "best": "Pagi Hari 4, tertakluk waktu penerbangan balik.", "muslim": "Masjid Istiqlal berada dalam jarak dekat untuk solat. Restoran halal banyak di sekitar Jakarta Pusat.", "map": "https://www.google.com/maps/search/?api=1&query=Monumen+Nasional+Jakarta"}, {"n": "Whoosh High Speed Train", "t": "Pengangkutan · Hari 1", "img": "", "short": "Kereta api laju Jakarta ke Bandung - 40 hingga 45 minit.", "intro": "Kereta api laju pertama di Asia Tenggara, menghubungkan Halim (Jakarta) ke Padalarang/Tegalluar (Bandung) dalam masa 40 hingga 45 minit berbanding kira-kira 3 jam dengan jalan raya. Pakej termasuk satu tiket sehala Economy Seat dari Jakarta ke Bandung pada Hari 1. Leg balik adalah add-on RM 157 per pax.", "hi": ["Perjalanan 40 hingga 45 minit menggantikan 3 jam jalan raya", "Economy Seat termasuk dalam pakej (sehala, Hari 1)", "Leg balik Bandung ke Jakarta sebagai add-on RM 157 per pax"], "best": "Hari 1 selepas ketibaan di CGK.", "muslim": "Terdapat surau dan tandas di stesen Halim dan Padalarang. Pelanggan dikehendaki membawa bagasi sendiri naik train.", "map": "https://www.google.com/maps/search/?api=1&query=Whoosh+Halim+Station+Jakarta"}, {"n": "Shopping Bandung", "t": "Shopping · Hari 1-4", "img": "", "short": "Kain ela, jeans, barangan kulit dan souvenir makanan.", "intro": "Bandung adalah destinasi shopping utama pakej ini. Itinerari merangkumi Rumah Kain Sulam M Collection dan Rumah Textile (kain ela, baju, seluar, beg) pada Hari 1, Kedai Barang Kulit Cibaduyut dan Toko Tiga Jeans Factory pada Hari 2, Rumah Mode dan Ole Ole Tiga Rasa pada Hari 3, serta Ole Ole Kartika Sari pada Hari 4.", "hi": ["Rumah Textile dan Rumah Mode - kain ela, baju, beg", "Cibaduyut - kasut dan barangan kulit; Toko Tiga - jeans", "Ole Ole Kartika Sari dan Tiga Rasa - souvenir makanan"], "best": "Sepanjang trip mengikut itinerari harian.", "muslim": "Semua lokasi shopping mempunyai surau atau berdekatan masjid. Restoran halal mudah dijumpai di sekitar kawasan shopping Bandung.", "map": "https://www.google.com/maps/search/?api=1&query=Rumah+Mode+Bandung"}], "hotels": [{"tier": "3 bintang (standard pakej)", "name": "Zest Hotel Bandung atau setaraf", "img": "", "note": "Tiga malam di Bandung. Asas double sharing, harga 2 hingga 3 orang sebilik; untuk triple hanya extra bed disediakan. Biasanya di kawasan city centre dan boleh berjalan kaki ke tempat menarik berhampiran."}, {"tier": "4 bintang (upgrade RM 90 / pax / malam)", "name": "ASTON Pasteur Hotel Bandung atau setaraf", "img": "", "note": "Upgrade tertakluk kepada availability. Surcharge peak season untuk tier ini ialah RM 35 per pax per malam berbanding RM 30 untuk hotel 3 bintang."}], "actGroups": [], "blocks": {"compare": "<h2>Perbezaan Pakej</h2>\n<p class='ssub'>Satu pakej 4H3M, dua pilihan routing Hari 2 pada harga yang sama - pilih semasa tempahan.</p>\n<table class='cmp'><thead><tr><th class='blank'></th>\n<th>OPTION A &middot; NATURE &amp; ADVENTURE</th><th>OPTION B &middot; KIDS FRIENDLY</th></tr></thead><tbody>\n<tr><td class='feat'>Kawah Putih</td><td class='val'><span class='tick'>&#10003;</span></td><td class='val'><span class='no'>&mdash;</span></td></tr>\n<tr><td class='feat'>Glamping Lakeside Rancabali</td><td class='val'><span class='tick'>&#10003;</span></td><td class='val'><span class='no'>&mdash;</span></td></tr>\n<tr><td class='feat'>Rengganis Bridge &amp; Keranjang Sultan (chairlift)</td><td class='val'><span class='tick'>&#10003;</span></td><td class='val'><span class='no'>&mdash;</span></td></tr>\n<tr><td class='feat'>Kopi Luwak Cikole</td><td class='val'><span class='no'>&mdash;</span></td><td class='val'><span class='tick'>&#10003;</span></td></tr>\n<tr><td class='feat'>Orchid Forest Cikole</td><td class='val'><span class='no'>&mdash;</span></td><td class='val'><span class='tick'>&#10003;</span></td></tr>\n<tr><td class='feat'>Lembang Park &amp; Zoo</td><td class='val'><span class='no'>&mdash;</span></td><td class='val'><span class='tick'>&#10003;</span></td></tr>\n<tr><td class='feat'>Kedai Barang Kulit Cibaduyut</td><td class='val'><span class='tick'>&#10003;</span></td><td class='val'><span class='no'>&mdash;</span></td></tr>\n<tr><td class='feat'>Toko Tiga Jeans Factory &amp; Jalan Asia Afrika</td><td class='val'><span class='tick'>&#10003;</span></td><td class='val'><span class='tick'>&#10003;</span></td></tr>\n<tr><td class='feat'>Hari 1, 3 dan 4 (Whoosh, Lembang, Jakarta tour)</td><td class='val'><span class='tick'>&#10003;</span></td><td class='val'><span class='tick'>&#10003;</span></td></tr>\ 7</td></tr><tr><td>4 - 5</td><td>RM 1,227</td><td>RM 1,127</td><td>RM 927</td></tr><tr><td>6 - 9</td><td>RM 1,187</td><td>RM 1,087</td><td>RM 887</td></tr><tr><td>10 - 19</td><td>RM 1,147</td><td>RM 1,047</td><td>RM 847</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Infant (bawah 2 tahun):</b> FOC. <b>Single Supplement:</b> RM 350 per orang. Harga adalah untuk 2 hingga 3 orang sebilik; untuk triple sharing hanya extra bed disediakan. Semua harga sah 24 jam selepas quotation dikeluarkan.</div>", "custom": "<h2>Simple Customisation &amp; Add-on</h2>\n<p class='ssub'>Add-on rasmi dari katalog. Harga boleh berubah mengikut kadar tukaran semasa. Untuk aktiviti berbayar di lokasi, pelanggan boleh bayar terus di kaunter tarikan.</p>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Harga</th><th>Nota</th></tr></thead><tbody>\n<tr><td class='it'>Zip Bike @ The Lodge Maribaya</td><td class='add'>RM 10 - RM 15</td><td>Bayar terus di lokasi</td></tr>\n<tr><td class='it'>Rainbow Slide @ Floating Market Lembang</td><td class='add'>RM 10 - RM 15</td><td>Bayar terus di lokasi</td></tr>\n<tr><td class='it'>Whoosh Train Bandung ke Jakarta (leg balik)</td><td class='add'>RM 157 / pax</td><td>Termasuk tiket sehala Economy Seat + private transport pickup &amp; drop off stesen. Pelanggan bawa bagasi sendiri naik train</td></tr>\n<tr><td class='it'>Single Supplement</td><td class='add'>RM 350 / pax</td><td>Untuk bilik sendirian</td></tr>\n<tr><td class='it'>Upgrade hotel 4 bintang</td><td class='add'>RM 90 / pax / malam</td><td>ASTON Pasteur Hotel atau setaraf</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Tambah hari atau aktiviti lain:</b> boleh, kerana ini pakej private tour - perlu request tambahan hari dan tambahan harga. Aktiviti percuma dalam itinerari tidak boleh ditukar dengan aktiviti lain, baucar atau tunai sekiranya pelanggan tidak menyertai atau disebabkan cuaca dan ketersediaan.</div>", "surcharge": "<h2>Surcharge</h2>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Bila / Nota</th></tr></thead><tbody>\n<tr><td class='it'>Peak season - hotel 3 bintang</td><td class='add'>RM 30 / pax / malam</td><td>Tarikh peak season di bawah</td></tr>\n<tr><td class='it'>Peak season - hotel 4 bintang</td><td class='add'>RM 35 / pax / malam</td><td>Tarikh peak season di bawah</td></tr>\n<tr><td class='it'>Upgrade akomodasi 4 bintang</td><td class='add'>RM 90 / pax / malam</td><td>ASTON Pasteur Hotel atau setaraf</td></tr>\n<tr><td class='it'>Single Supplement</td><td class='add'>RM 350 / pax</td><td>Bilik sendirian</td></tr>\n<tr><td class='it'>Late booking</td><td class='add'>RM 50 / booking</td><td>Tempahan kurang 45 hari sebelum berlepas</td></tr>\n<tr><td class='it'>Travel date 2027 (1 Jan - 30 Jun 2027)</td><td class='add'>RM 50 / pax</td><td>Ditambah di atas surcharge peak season. Sumber: 2026/2027 Date Surcharge ARBA - tiada dalam katalog v8</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Tarikh peak season:</b> 19 - 28 Mac 2026 &middot; 14 - 16 Mei 2026 &middot; 27 - 30 Mei 2026 &middot; 12 - 16 Jun 2026 &middot; 14 - 16 Ogos 2026 &middot; 21 - 24 Ogos 2026 &middot; 20 Disember 2026 - 1 Januari 2027.</div>", "transport": "<h2>Transportation &amp; Guide</h2>\n<p class='ssub'>Pengangkutan persendirian sepanjang trip. Driver merangkap driving guide - bukan pengangkutan awam.</p>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Bilangan pax</th><th>Kenderaan</th></tr></thead><tbody>\n<tr><td class='it'>2 - 4 pax</td><td>Toyota Avanza</td></tr>\n<tr><td class='it'>5 - 6 pax</td><td>Toyota Innova</td></tr>\n<tr><td class='it'>8 - 12 pax</td><td>Toyota Hiace</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Bagasi:</b> sila bawa maksimum 1 luggage seorang kerana ia menjejaskan kapasiti kenderaan. <b>Bas:</b> tidak digunakan untuk Bandung - jalan kecil dan mengganggu timing perjalanan; van maksimum 10 pax. <b>Trafik:</b> jangkakan kelewatan disebabkan trafik padat dan jalan sempit.</div>\n<div class='notebox'><b>Guide:</b> satu trip ditemani seorang driving guide tempatan (Indonesia, kebiasaannya Muslim) yang bertutur Melayu/Inggeris. Mereka mahir menguruskan makanan halal dan menjaga waktu solat. Tipping sudah termasuk dalam pakej - pelanggan tidak perlu bayar tip lagi kepada guide. Guide kebiasaannya lelaki.</div>", "stay": "<h2>Accommodation</h2>\n<p class='ssub'>Tiga malam di Bandung. Asas double sharing (harga 2 hingga 3 orang sebilik); untuk triple hanya extra bed disediakan. Hotel biasanya di kawasan city centre dan boleh berjalan kaki ke tempat menarik berhampiran. Lokasi hotel akhir disahkan 14 hingga 21 hari sebelum berlepas.</p>", "food": "<h2>Halal &amp; Makanan</h2>\n<p class='ssub'>Pakej fullboard: 3x sarapan di hotel, 3x makan tengah hari dan 3x makan malam di restoran. Semua makan tengah hari dan makan malam di restoran halal tempatan - masakan Indonesia (Sunda dan Padang).</p>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Bandung</th><th>Jakarta</th></tr></thead><tbody>\n<tr><td>Restoran Sederhana Padang (Nasi Padang)</td><td>Restoran Padang Salero Jumbo (Nasi Padang, seafood & masakan Sunda)</td></tr><tr><td>Restoran Sari Sunda (Masakan Sunda)</td><td>Restoran Padang Simpang Raya (Nasi Padang)</td></tr><tr><td>Restoran Saung Gawir (Masakan Sunda)</td><td>Restoran Teko (Masakan Sunda)</td></tr><tr><td>Restoran Bakso Malang Langgeng (Bakso, nasi goreng)</td><td>Restoran Sederhana Padang (Nasi Padang)</td></tr><tr><td>Restoran Padang Simpang Raya (Nasi Padang)</td><td></td></tr><tr><td>Restoran Dahulu Kala (Masakan Sunda)</td><td></td></tr><tr><td>Restoran Saung Leuit Floating Market (Masakan Sunda)</td><td></td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Sarapan hotel:</b> hotel menyediakan standard international breakfast - driving guide akan membantu memilih makanan yang halal. <b>Bekal:</b> tidak perlu bawa sambal atau pek kembara; makanan di sana mencukupi dan mengenyangkan. <b>Makanan bayi:</b> boleh dibawa dalam kabin, disarankan dalam pek asal beserta label.</div>", "prayer": "<h2>Solat</h2>\n<p class='ssub'>Waktu solat dijaga sepanjang trip. Bandung dan Jakarta majoriti Muslim - surau dan masjid mudah dijumpai di restoran, pusat beli-belah dan lokasi tarikan.</p>\n<ul class='klist'>\n<li>Zohor dan Asar: biasanya solat di restoran yang menyediakan tempat solat, atau di masjid/surau berdekatan lokasi lawatan</li>\n<li>Maghrib dan Isyak: biasanya dijamak di hotel</li>\n<li>Hari lawatan ke Masjid Istiqlal Jakarta (Hari 4, optional tour): solat di masjid</li>\n<li>Bawa sejadah dan telekung sendiri untuk keselesaan</li>\n<li>Zon waktu Indonesia Barat (WIB) adalah 1 jam lebih awal daripada Malaysia - waktu solat berbeza sedikit dari Malaysia</li>\n</ul>", "flight": "<h2>Flight &amp; Airport</h2>\n<p class='ssub'>Penerbangan <b>tidak termasuk</b> dalam pakej. Terbang terus KUL ke CGK (Soekarno-Hatta International Airport, Jakarta) - kira-kira 2 jam 10 minit. Tiada penerbangan terus ke Bandung, sebab itu pakej masuk melalui Jakarta dan sambung ke Bandung dengan Whoosh Train.</p>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Airline</th><th>No. flight (KUL &rarr; CGK)</th><th>Berlepas KUL</th><th>Tiba CGK</th><th>Jenis</th><th>Anggaran pergi-balik</th><th>Hari</th></tr></thead><tbody>\n<tr><td class='it'>AirAsia X</td><td>AK 351</td><td>11:30 pagi</td><td>12:40 tengah hari</td><td>Low Cost</td><td>RM 520 - RM 580</td><td>Harian</td></tr><tr><td class='it'>Indonesia AirAsia</td><td>QZ 203</td><td>10:10 pagi</td><td>11:10 pagi</td><td>Low Cost</td><td>RM 520 - RM 580</td><td>Harian</td></tr><tr><td class='it'>Batik Air</td><td>OD 386</td><td>10:15 pagi</td><td>11:30 pagi</td><td>Mid Tier</td><td>RM 500 - RM 520</td><td>Harian</td></tr><tr><td class='it'>Malaysia Airlines</td><td>MH 717</td><td>10:00 pagi</td><td>11:20 pagi</td><td>Full Service</td><td>RM 1,100 - RM 1,300</td><td>Harian</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Leg balik (CGK &rarr; KUL):</b> keempat-empat carrier beroperasi harian dua hala; harga di atas sudah harga anggaran <b>pergi-balik</b>. Nombor dan waktu penerbangan balik tempah mengikut jadual semasa airline pada tarikh perjalanan pelanggan. Sumber: Flight Recommendation ARBA - katalog v8 tidak menyenaraikan jadual penerbangan.</div>\n<div class='notebox'><b>Waktu disyorkan:</b> ketibaan CGK pada waktu pagi (selewat-lewatnya 12 tengah hari Hari 1) supaya sempat Whoosh Train dan shopping tour. Penerbangan balik disyorkan pada waktu petang Hari 4. <b>Airport transfer:</b> driver ARBA menunggu di Arrival Hall CGK dengan papan tanda ARBA Travel.</div>", "weather": "<h2>Cuaca &amp; Musim</h2>\n<p class='ssub'>Cuaca Bandung lebih sejuk daripada Jakarta kerana terletak di dataran tinggi. Suhu keseluruhan hampir sama sepanjang tahun, mirip Malaysia.</p>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Musim</th><th>Bulan</th><th>Nota</th></tr></thead><tbody>\n<tr><td class='it'>Dry season</td><td>April - Oktober</td><td>Masa terbaik untuk ke Bandung - kurang potensi hujan. Juga musim paling ramai pengunjung</td></tr>\n<tr><td class='it'>Wet season</td><td>November - April</td><td>Lebih kerap hujan. Kawah Putih kurang cantik ketika hujan - warna air jadi lebih gelap</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Pakaian:</b> Bandung dan kawasan Lembang/Ciwidey boleh sejuk terutama waktu pagi dan malam - bawa jaket nipis. <b>Kawah Putih:</b> bau sulfur kuat - boleh sediakan face mask sebelum turun dari kenderaan, terutama untuk yang ada masalah pernafasan.</div>", "tips": "<h2>Shopping &amp; Tips</h2>\n<p class='ssub'>Bandung adalah destinasi shopping utama pakej ini - kain ela, jeans, barangan kulit dan souvenir makanan. Jakarta pula lebih untuk flight in dan out serta lawatan singkat.</p>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Tempat</th><th>Untuk apa</th><th>Hari</th></tr></thead><tbody>\n<tr><td class='it'>Rumah Kain Sulam M Collection</td><td>Kain ela</td><td>Hari 1</td></tr>\n<tr><td class='it'>Rumah Textile</td><td>Kain ela, baju, seluar, beg</td><td>Hari 1</td></tr>\n<tr><td class='it'>Kedai Barang Kulit Cibaduyut</td><td>Kasut dan barangan kulit</td><td>Hari 2 (Option A)</td></tr>\n<tr><td class='it'>Toko Tiga Jeans Factory</td><td>Jeans dan baju</td><td>Hari 2</td></tr>\n<tr><td class='it'>Rumah Mode</td><td>Baju, seluar, beg</td><td>Hari 3</td></tr>\n<tr><td class='it'>Ole Ole Tiga Rasa</td><td>Souvenir makanan</td><td>Hari 3</td></tr>\n<tr><td class='it'>Ole Ole Kartika Sari</td><td>Souvenir makanan</td><td>Hari 4</td></tr>\n<tr><td class='it'>Mangga Dua / Tanah Abang</td><td>Pakaian borong (Jakarta)</td><td>Hari 4 (optional)</td></tr>\n</tbody></table></div>\n<div class='notebox'><b>Duit belanja:</b> cadangan RM 1,500 hingga RM 3,000 seorang untuk shopping. Mata wang Indonesian Rupiah (IDR) - disarankan tukar duit di Malaysia. Kad debit/kredit, QR Pay dan tunai diterima; Wise card boleh digunakan di Bandung. Aktifkan overseas withdrawal pada kad sebelum berlepas.</div>\n<div class='notebox'><b>Praktikal:</b> soket plug Indonesia jenis 2 pin - bawa universal adaptor. Zon waktu WIB (GMT+7), 1 jam lebih lewat daripada Malaysia. Powerbank maksimum 100Wh (kira-kira 20,000mAh) dan wajib dalam hand carry, bukan check-in. Untuk internet: roaming atau pocket wifi lebih mudah daripada SIM kad tempatan (SIM Indonesia perlu pendaftaran IMEI dan boleh dikenakan cukai import).</div>", "visa": "<h2>Visa &amp; Passport</h2>\n<p class='ssub'>Rakyat Malaysia tidak memerlukan visa untuk masuk Indonesia sebagai pelancong. Yang wajib ialah <b>All Indonesia Arrival Card</b> - satu borang digital yang menggabungkan imigresen, kastam, kesihatan dan kuarantin.</p>\n<div class='notebox'><b>Pasport:</b> mesti sah sekurang-kurangnya 6 bulan dari tarikh perjalanan. Memastikan tempoh sah pasport adalah tanggungjawab pelanggan.</div>\n<ul class='klist'>\n<li>Buka <b>allindonesia.imigrasi.go.id</b> dan pilih \"Arrival Card - Foreign Visitor\". Boleh tukar ke bahasa Inggeris di setting kanan atas</li>\n<li>Isi data pasport (guna butang \"scan MRZ\" untuk imbas pasport), nombor telefon dan emel</li>\n<li>Tekan \"+ Add Traveller\" untuk masukkan maklumat ahli keluarga dalam borang yang sama</li>\n<li>Masukkan tarikh ketibaan dan nombor flight</li>\n<li>Isi alamat hotel dan tujuan lawatan - rujuk Tour Voucher dalam group WhatsApp untuk nama hotel</li>\n<li>Jawab deklarasi barang dan kesihatan. Jika bawa ubat preskripsi, tanda \"Ya\"</li>\n<li>Submit dan simpan QR Code</li>\n<li>Tekan butang \"Apply Visa Exemption\" - PDF akan dihantar ke emel</li>\n<li>Tunjuk QR code di imigresen dan Autogate CGK ketika tiba</li>\n</ul>\n<div class='notebox'><b>Bila boleh isi:</b> 2 hari sebelum berlepas. All Indonesia Arrival Card diwajibkan sejak 1 Oktober 2025 dan menggantikan borang e-Customs Declaration (ecd.beacukai.go.id) yang digunakan sebelum ini.</div>\n<div class='notebox'><b>Dokumen lain:</b> Tour Voucher (softcopy memadai, satu keluarga satu voucher) dan covernote insurans. Untuk bawah 18 tahun, pasport sahaja memadai jika bersama ibu bapa - salinan surat beranak boleh dibawa sebagai standby. Ubat preskripsi perlu disertakan surat doktor; ubat OTC seperti panadol tidak perlu preskripsi.</div>", "freegift": "<h2>Free Gift (Promo)</h2>\n<details class='qa'><summary><span class='tw'>&#9654;</span><span>Free gift untuk campaign atau Promo untuk pakej Jakarta-Bandung</span></summary><div class='ans'>\n<p><b>Jakarta-Bandung: Pocket Wifi</b><span class='codechip'>Kod: FJBDO</span> (Per booking)</p>\n<p>Bullet: BRB Luggage Tag / Pocket Wifi 4G (per booking)</p>\n<p>Nota: Whoosh Train 1 hala Jakarta ke Bandung sudah termasuk dalam pakej (katalog v8), jadi free gift campaign ditukar kepada Pocket Wifi.</p>\n<p style='color:var(--greend)'>*Bullet wajib tanya PO/Leader</p>\n<p style='color:var(--greend)'>Disclaimer: Sila sahkan dengan PO jika di luar waktu Promo.</p>\n</div></details>\n", "polisi": "<h2>Polisi &amp; Payment</h2>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Terma</th></tr></thead><tbody>\n<tr><td class='it'>Deposit</td><td>RM 250 per orang semasa pengesahan tempahan</td></tr>\n<tr><td class='it'>Bayaran penuh</td><td>45 hari sebelum tarikh ketibaan</td></tr>\n<tr><td class='it'>Sah quotation</td><td>24 jam selepas quotation dikeluarkan</td></tr>\n<tr><td class='it'>Late booking</td><td>RM 50 per booking jika tempahan kurang 45 hari sebelum berlepas</td></tr>\n<tr><td class='it'>Tempoh sah pakej</td><td>Perjalanan sehingga 31 Disember 2026</td></tr>\n</tbody></table></div>\n<ul class='klist'>\n<li>Harga adalah untuk 2 hingga 3 orang sebilik</li>\n<li>Itinerari, harga dan penerbangan tertakluk kepada perubahan</li>\n<li>Sila semak dengan staf mengenai tempoh sah trip sebelum menempah sebarang penerbangan domestik penyambung</li>\n<li>Aktiviti percuma tidak boleh ditukar dengan aktiviti lain, baucar atau tunai sekiranya pelanggan tidak menyertai atau disebabkan ketersediaan dan keadaan cuaca</li>\n<li>Itinerari akhir dan lokasi hotel disahkan sekurang-kurangnya 14 hingga 21 hari sebelum berlepas</li>\n</ul>"}, "snapshot": "## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Apa destinasi utama pakej Jakarta-Bandung ini?**\n\nEmpat tarikan anchor:\n- **Kawah Putih** - kawah gunung berapi tercantik di Indonesia, 50km dari Bandung. Tasik terbentuk dari letusan gunung berapi, air berwarna putih kebiruan kerana bercampur sulfur. Bau sulfur kuat - boleh sediakan face mask sebelum turun dari kenderaan.\n- **Rengganis Bridge & Keranjang Sultan** - jambatan gantung sepanjang 370 meter, jambatan terpanjang di Asia Tenggara. Keranjang Sultan adalah buaian gergasi yang paling famous di sini.\n- **The Lodge Maribaya & Floating Market Lembang** - kawasan Lembang untuk sightseeing, aktiviti keluarga dan food tour.\n- **Rumah Textile & Rumah Mode** - gedung pakaian untuk aktiviti shopping terbaik di Bandung.\n\n**Apa beza Option A dan Option B pada Hari 2?**\n\nOption A adalah routing alam dan adventure: Kawah Putih, Glamping Lakeside, Rengganis Bridge & Keranjang Sultan, Cibaduyut. Option B pula lebih kids friendly: Kopi Luwak Cikole, Orchid Forest, Lembang Park & Zoo. Kedua-dua option pada harga yang sama dan berkongsi Hari 1, 3 dan 4 yang sama. Pilih semasa tempahan.\n\n**Berapa jam dari Jakarta ke Bandung? Naik apa?**\n\nHari 1 pakej sudah termasuk Whoosh Train - perjalanan hanya 30 hingga 45 minit. Hari terakhir pula land transfer dengan kenderaan, mengambil masa kira-kira 3 jam.\n\n**Boleh ke saya pilih tarikh sendiri?**\n\nYa boleh. Pakej Jakarta-Bandung ini adalah private tour, jadi open date - bila-bila masa pun boleh.\n\n**Boleh ke tambah jadual lain contohnya Trans Studio?**\n\nBoleh, cuma kena request tambahan hari dan tambahan harga kerana ini pakej private tour.\n\n**Ada group tour atau joined tour ke?**\n\nBuat masa ini pakej Jakarta-Bandung yang ditawarkan adalah private tour sahaja.\n\n**Ada pakej honeymoon ke?**\n\nTiada pakej honeymoon khusus, tetapi boleh request sebagai private tour dengan penyesuaian.\n\n**Jakarta tiada aktiviti shopping ke?**\n\nJakarta dalam pakej ini hanya untuk flight in dan out serta lawatan singkat pada Hari 4 (Monas, Masjid Istiqlal, Mangga Dua/Tanah Abang sebagai optional tour). Shopping utama semuanya di Bandung.\n\n**Keranjang Sultan selamat tak? Baby boleh naik?**\n\nInsyaAllah selamat selagi pelanggan ikut prosedur keselamatan yang ditetapkan - ada tali pinggang keselamatan disediakan. Baby boleh naik dengan duduk atas riba parent, dan anak perlu behave sepanjang perjalanan.\n\n**Whoosh train untuk infant ada kos ke?**\n\nPercuma untuk kanak-kanak bawah 5 tahun.\n\n**Perlu bawa bagasi naik Whoosh Train sendiri ke?**\n\nYa. Pelanggan dikehendaki membawa bagasi masing-masing naik Whoosh Train. Jika tidak mahu bawa naik, boleh add on transport berasingan.\n\n### B. Halal, Makanan & Solat\n\n**Pakej ini fullboard ke?**\n\nYa. Pakej termasuk 3x sarapan di hotel, 3x makan tengah hari dan 3x makan malam di restoran.\n\n**Makanan di hotel halal ke?**\n\nHotel menyediakan standard international breakfast. Driving guide akan membantu memilih makanan yang halal.\n\n**Kita makan di restoran mana di Bandung dan Jakarta?**\n\nBandung: Sederhana Padang, Sari Sunda, Saung Gawir, Bakso Malang Langgeng, Padang Simpang Raya, Dahulu Kala, Saung Leuit Floating Market. Jakarta: Padang Salero Jumbo, Padang Simpang Raya, Teko, Sederhana Padang. Semua masakan Indonesia tempatan - Sunda dan Padang.\n\n**Boleh bawa sambal atau pek kembara?**\n\nTak perlu. Makanan di sana memang cukup dan mengenyangkan.\n\n**Solat di mana? Di masjid atau dalam hotel?**\n\nUntuk Maghrib dan Isyak biasanya dijamak di hotel. Untuk Zohor dan Asar biasanya solat di restoran yang menyediakan tempat solat, atau di masjid/surau berdekatan. Jika hari lawatan tersebut ada ke masjid (contohnya Masjid Istiqlal pada Hari 4), solat di masjid.\n\n**Perlu bawa telekung dan sejadah sendiri?**\n\nYa, disarankan bawa sendiri untuk keselesaan. Bandung dan Jakarta majoriti Muslim, jadi surau dan masjid mudah dijumpai di restoran, pusat beli-belah dan lokasi tarikan.\n\n**Makanan bayi boleh dibawa?**\n\nBoleh dibawa dalam kabin, disarankan dalam pek asal beserta label (tidak dibuka atau disalin pek). Untuk air panas bancuh susu, boleh minta dengan flight attendant di atas flight.\n\n### C. Visa & Passport\n\n**Perlu visa untuk ke Indonesia?**\n\nRakyat Malaysia tidak perlu visa sebagai pelancong. Yang wajib ialah mengisi All Indonesia Arrival Card di allindonesia.imigrasi.go.id, dan tekan butang Apply Visa Exemption dalam borang yang sama.\n\n**Bila boleh isi All Indonesia Arrival Card?**\n\n2 hari sebelum berlepas. Simpan QR code yang diberikan - perlu ditunjuk di imigresen dan Autogate CGK.\n\n**Masih perlu isi borang e-Customs Declaration (ecd.beacukai.go.id)?**\n\nTidak. All Indonesia Arrival Card telah diwajibkan sejak 1 Oktober 2025 dan menggantikan borang e-Customs Declaration yang digunakan sebelum ini. Satu borang sahaja untuk imigresen, kastam, kesihatan dan kuarantin.\n\n**Berapa lama tempoh sah pasport diperlukan?**\n\nSekurang-kurangnya 6 bulan dari tarikh trip. Memastikan tempoh sah pasport adalah tanggungjawab pelanggan.\n\n**Dokumen apa yang perlu disediakan?**\n\nTour Voucher (softcopy memadai, satu keluarga satu voucher) dan covernote insurans. Untuk bawah 18 tahun, pasport sahaja memadai jika bersama ibu bapa - salinan surat beranak boleh dibawa sebagai standby.\n\n**Perlu declare ubat preskripsi dalam All Indonesia?**\n\nYa. Jika bawa ubat preskripsi seperti ubat darah tinggi atau kencing manis, tanda \"Ya\" dan bawa surat doktor. Ubat OTC seperti panadol dan ubat selsema tidak perlu preskripsi dan tidak wajib label.\n\n### D. Flight & Airport\n\n**Ada flight direct ke Bandung?**\n\nBuat masa ini tiada penerbangan terus dari Malaysia ke Bandung dengan frequency yang munasabah. Sebab itu pakej ini masuk melalui Jakarta (Soekarno-Hatta, CGK) dan sambung ke Bandung dengan Whoosh Train.\n\n**Tiket flight termasuk dalam pakej ke?**\n\nTidak. Pakej ini adalah Ground + Tipping - tiket penerbangan antarabangsa tidak termasuk dan ditempah berasingan.\n\n**Airline apa yang disyorkan ke Jakarta?**\n\nAirAsia X (AK 351), Indonesia AirAsia (QZ 203), Batik Air (OD 386) dan Malaysia Airlines (MH 717) - kesemuanya beroperasi harian dari KUL ke CGK. Rujuk tab Flight & Airport untuk waktu dan anggaran harga pergi-balik.\n\n**Waktu penerbangan apa yang disyorkan?**\n\nKetibaan di CGK pada waktu pagi, selewat-lewatnya 12 tengah hari pada Hari 1, supaya sempat Whoosh Train dan shopping tour. Penerbangan balik disyorkan pada waktu petang Hari 4.\n\n**Siapa jemput di CGK?**\n\nSelepas ambil bagasi, terus ke Arrival Hall. Driver yang mewakili ARBA akan menunggu dengan papan tanda ARBA Travel beserta nama peserta.\n\n**Berapa awal perlu tiba di KLIA?**\n\nSekurang-kurangnya 3 jam sebelum penerbangan berlepas. Pada musim cuti puncak, tiba lebih awal kerana kesesakan dijangka meningkat. Pintu pelepasan penerbangan antarabangsa ditutup 1 jam sebelum berlepas.\n\n### E. Hotel & Bilik\n\n**Hotel apa yang digunakan?**\n\nZest Hotel Bandung atau setaraf untuk 3 bintang (standard pakej). Untuk upgrade, ASTON Pasteur Hotel atau setaraf pada RM 90 per pax per malam.\n\n**Boleh upgrade hotel?**\n\nBoleh. Pakej standard adalah hotel 3 bintang dan boleh upgrade ke 4 bintang dengan surcharge RM 90 per pax per malam, tertakluk kepada availability.\n\n**Hotel di area mana?**\n\nBiasanya hotel di kawasan city centre Bandung dan boleh berjalan kaki ke tempat menarik berhampiran. Semua 3 malam di Bandung. Lokasi hotel akhir disahkan 14 hingga 21 hari sebelum berlepas.\n\n**Ada family room atau connecting room ke?**\n\nBilik available kebanyakannya berdua sahaja; connecting room tidak available. Bilik bertiga agak sukar didapati terutamanya di kawasan bandar - boleh request, tetapi mungkin dapat bilik berdua tambah 1 extra bed. Untuk satu keluarga, kami akan cuba arrange bilik berdekatan tertakluk kepada availability.\n\n**Saiz bilik macam mana?**\n\nSaiz bilik agak selesa dan luas.\n\n**Towel dan seterika ada di hotel?**\n\nTowel biasanya ada dalam bilik. Kebanyakan hotel di Bandung sediakan seterika tetapi perlu kongsi dan biasanya perlu request di kaunter penyambut tetamu - lebih digalakkan bawa travel iron sendiri.\n\n### F. Cuaca & Musim\n\n**Bagaimana cuaca di Bandung? Berbeza dengan Malaysia?**\n\nBoleh dikatakan sama sepanjang tahun seperti di Malaysia, cuma Bandung lebih sejuk kerana terletak di dataran tinggi - terutama kawasan Lembang dan Ciwidey pada waktu pagi dan malam.\n\n**Bila masa terbaik untuk ke Bandung?**\n\nApril hingga Oktober adalah yang terbaik kerana kurang potensi hujan (dry season). November hingga April pula wet season.\n\n**Bila tarikh yang ramai orang ke Bandung?**\n\nKetika dry season, April hingga Oktober.\n\n**Kawah Putih cantik sepanjang tahun ke?**\n\nTidak. Ketika hujan, warna air Kawah Putih menjadi lebih gelap. Paling cantik ketika cuaca cerah pada dry season.\n\n**Ada tarikh perayaan yang banyak kedai tutup?**\n\nHari Raya Aidilfitri dan beberapa perayaan lain. Sila semak dengan PO untuk tarikh spesifik.\n\n### G. Shopping & Duit\n\n**Berapa duit belanja perlu dibawa?**\n\nCadangan RM 1,500 hingga RM 3,000 seorang, bergantung kepada barang yang hendak dibeli.\n\n**Mata wang apa yang digunakan?**\n\nIndonesian Rupiah (IDR). Disarankan tukar duit siap-siap di Malaysia. Kad debit/kredit, QR Pay dan tunai semuanya diterima.\n\n**Wise card boleh guna di Bandung?**\n\nBoleh.\n\n**Kad kredit Malaysia boleh guna?**\n\nBoleh, tetapi perlu aktifkan pengeluaran tunai di seberang laut (overseas withdrawal activation) pada kad kredit atau debit sebelum berlepas.\n\n**Di mana nak cari souvenir murah?**\n\nDriving guide akan tunjukkan tempat beli souvenir - biasanya fridge magnet, keychain, coklat dan barangan signature Indonesia. Ole Ole Tiga Rasa (Hari 3) dan Ole Ole Kartika Sari (Hari 4) khusus untuk souvenir makanan.\n\n**By The Sea PIK Jakarta tempat shopping ke?**\n\nBy The Sea PIK Jakarta lebih kepada tempat makan-makan dan lepak santai tepi laut, bukan kawasan shopping utama. Ada banyak kafe dan restoran tepi laut, pemandangan sunset cantik, dan sedikit kedai cenderamata kecil - bukan pusat beli-belah besar.\n\n### H. Payment & Refund\n\n**Berapa deposit yang perlu dibayar?**\n\nRM 250 per orang semasa pengesahan tempahan.\n\n**Bila bayaran penuh perlu dibuat?**\n\n45 hari sebelum tarikh ketibaan.\n\n**Ada caj kalau booking lewat?**\n\nYa. Late booking surcharge RM 50 per booking jika tempahan dibuat kurang 45 hari sebelum berlepas.\n\n**Berapa lama harga quotation sah?**\n\n24 jam selepas quotation dikeluarkan.\n\n**Tarikh mana yang ada surcharge peak season?**\n\n19-28 Mac 2026, 14-16 Mei 2026, 27-30 Mei 2026, 12-16 Jun 2026, 14-16 Ogos 2026, 21-24 Ogos 2026, dan 20 Disember 2026 hingga 1 Januari 2027. Caj RM 30 per pax per malam untuk hotel 3 bintang, RM 35 untuk hotel 4 bintang.\n\n**Kena bayar tipping lagi kepada guide?**\n\nTidak. Tipping sudah termasuk dalam pakej.\n\n### I. Add-ons & Customization\n\n**Apa add-on yang ada?**\n\nZip Bike di The Lodge Maribaya (RM 10 - RM 15), Rainbow Slide di Floating Market Lembang (RM 10 - RM 15), dan Whoosh Train leg balik Bandung ke Jakarta (RM 157 per pax termasuk private transport pickup dan drop off stesen). Untuk Zip Bike dan Rainbow Slide, pelanggan boleh bayar terus di lokasi.\n\n**Boleh add on Whoosh Train untuk balik ke Jakarta?**\n\nBoleh, RM 157 per pax. Termasuk tiket sehala Economy Seat dan private transport pickup dan drop off di stesen. Pelanggan perlu bawa bagasi sendiri naik train.\n\n**Boleh naik train sendiri dari Jakarta ke Bandung?**\n\nBoleh, cuma kena buat arrangement sendiri - guide kami hanya pickup di stesen train di Bandung.\n\n**Berapa Single Supplement?**\n\nRM 350 per orang untuk bilik sendirian.\n\n### J. Kesihatan & Keselamatan\n\n**Perlu bawa mask untuk ke Kawah Putih?**\n\nBoleh bawa untuk standby, lebih-lebih lagi bagi mereka yang ada masalah pernafasan - bau sulfur di Kawah Putih agak kuat.\n\n**Boleh bawa mesin nebuliser portable?**\n\nBoleh dibawa on board. Jika ada surat doktor, boleh bawa sekali.\n\n**Sesuai guna stroller sepanjang trip?**\n\nKami galakkan membawa stroller bagi yang memerlukan, namun terdapat beberapa tempat yang tidak stroller-friendly. Disarankan bawa stroller yang travel-friendly atau mudah dilipat.\n\n### K. Praktikal\n\n**Soket plug di Indonesia jenis apa?**\n\n2 pin. Bawa travel universal adaptor. Digalakkan bawa extension plug jika banyak alatan elektrik.\n\n**Zon waktu Indonesia berapa?**\n\nWaktu Indonesia Barat (WIB), GMT+7 - 1 jam lebih lewat daripada Malaysia.\n\n**Internet macam mana? SIM kad, roaming atau pocket wifi?**\n\nRoaming atau pocket wifi lebih mudah. SIM kad tempatan Indonesia memerlukan pendaftaran IMEI telefon dengan pihak berkuasa Indonesia, dan telefon bernilai melebihi kira-kira RM 2,000 boleh dikenakan cukai import. Pilihan lain ialah Tourist SIM yang sah 7 hingga 30 hari dan memerlukan pasport untuk pendaftaran.\n\n**Boleh bawa powerbank?**\n\nBoleh, maksimum 100Wh (kira-kira 20,000mAh) dan wajib dalam hand carry. Tiada bateri atau powerbank dibenarkan dalam check-in luggage.\n\n### L. Packing\n\n**Apa yang perlu dibawa?**\n\nPasport (sah 6 bulan), pakaian mengikut bilangan hari, pakaian ibadah (sejadah, telekung), peralatan mandi, barangan elektrik dan pengecas, universal adaptor, duit poket, kasut selesa untuk banyak berjalan, dan keperluan perubatan peribadi.\n\n**Berapa banyak luggage boleh bawa?**\n\nSila bawa maksimum 1 luggage seorang kerana ia menjejaskan kapasiti kenderaan sepanjang tour. Had bagasi penerbangan pula bergantung kepada tiket yang dibeli sendiri.\n\n**Cecair dan barang tajam boleh bawa dalam hand carry?**\n\nHanya cecair tidak melebihi 100ml boleh dibawa naik ke kabin dan perlu dibungkus dalam plastik yang diikat ketat. Cecair melebihi 100ml dan barang tajam seperti gunting kecil, mata pisau pencukur, pembuka botol atau pemotong kuku perlu check-in.\n\n**Perlu bawa jaket?**\n\nYa. Bandung dan kawasan Lembang serta Ciwidey boleh sejuk terutama waktu pagi dan malam - bawa jaket nipis.\n"}</script>

<script>

$("#pkgRow").innerHTML=KB.packages.map((p,i)=>`<button class="tcard" onclick="showPackage(${i})"><div class="im">${p.img?`<img src="${W(p.img)}" alt="${esc(p.n)}">`:""}<span class="chip">${esc(p.tag)}</span>${heart()}</div><div class="body"><b>${esc(p.n)}</b><p>${esc(p.sub||"")}</p><span class="cta">Lihat butiran →</span></div></button>`).join("");
$("#gallery").innerHTML=KB.attractions.map((a,i)=>`<button class="tcard" onclick="showAttraction(${i})"><div class="im">${a.img?`<img src="${W(a.img)}" alt="${esc(a.n)}">`:""}<span class="chip">${esc(a.t)}</span>${heart()}</div><div class="body"><b>${esc(a.n)}</b><p>${esc(a.short||"")}</p><span class="cta">Lihat butiran →</span></div></button>`).join("");
document.querySelectorAll(".tcard img").forEach(im=>im.onerror=function(){this.style.display="none";});

function renderItin(i){const rows=KB.itineraries[i];if(!rows)return"";
  let out='<div class="itin"><h3>Itinerari Ringkas (Day-to-Day)</h3>';
  out+=rows.map(r=>`<div class="itday"><div class="itd"><small>DAY</small><b>${r.d}</b></div><div class="itc"><p class="itt">${esc(r.t)} ${r.m?`<span class="rtag">${esc(r.m)}</span>`:""}</p><ul>${r.a.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></div>`).join("");
  out+='</div>';return out;}

function showAttraction(i){const a=KB.attractions[i];if(!a)return;
  $("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore").forEach(e=>e.classList.add("hidden"));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.add("hidden"));
  $("#topicbar").classList.add("hidden");$("#noresult").style.display="none";
  const v=$("#attractionview");
  v.innerHTML=`<button class="backbtn" onclick="closeAttraction()">← Kembali ke Overview</button>
    <div class="adhero"><img src="${a.img?W(a.img):''}" alt="${esc(a.n)}" onerror="this.style.display='none'"><div class="adscrim"></div><div class="adtitle"><span class="chip">${esc(a.t)}</span><h1>${esc(a.n)}</h1></div></div>
    <div class="adbody"><p class="adlead">${esc(a.intro)}</p>
      <h3>Tarikan utama</h3><ul>${(a.hi||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul>
      <p><b>Masa terbaik:</b> ${esc(a.best||"")}</p>
      ${a.muslim?`<div class="muslimnote"><b>Muslim-friendly:</b> ${esc(a.muslim)}</div>`:""}

    </div>`;
  v.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
}
function closeAttraction(){const v=$("#attractionview");v.classList.add("hidden");v.innerHTML="";$("#topicbar").classList.remove("hidden");showTopic("all");}
function showPackage(i){const p=KB.packages[i];if(!p)return;
  $("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore").forEach(e=>e.classList.add("hidden"));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.add("hidden"));
  $("#topicbar").classList.add("hidden");$("#noresult").style.display="none";
  const v=$("#attractionview");
  v.innerHTML=`<button class="backbtn" onclick="closeAttraction()">← Kembali ke Overview</button>
    <div class="adhero"><img src="${p.img?W(p.img):''}" alt="${esc(p.n)}" onerror="this.style.display='none'"><div class="adscrim"></div><div class="adtitle"><span class="chip">${esc(p.tag)}</span><h1>${esc(p.n)}</h1></div></div>
    <div class="adbody"><p class="adlead">${esc(p.intro)}</p>
      ${p.note?`<div class="pkgnote"><b>Nota:</b> ${esc(p.note)}</div>`:""}
      ${renderItin(i)}
      <div class="incexc"><div class="incbox"><h3>Termasuk</h3><ul>${(p.inc||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div><div class="excbox"><h3>Tidak termasuk</h3><ul>${(p.exc||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></div>
      <p class="pkgfoot">Rujuk tab <b>Harga & Pakej</b> untuk kadar katalog & surcharge.</p>
    </div>`;
  v.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
}

/* --- markdown engine --- */
function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"compare",t:"Perbezaan Pakej"},
 {id:"itin",t:"Itinerary & Aktiviti"},{id:"map",t:"Travel Map"},{id:"pricing",t:"Harga & Pakej"},{id:"custom",t:"Simple Customisation"},
 {id:"surcharge",t:"Surcharge"},{id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"prayer",t:"Solat"},{id:"flight",t:"Flight & Airport"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},
 {id:"polisi",t:"Polisi & Payment"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(ht=>`<div class="hcard">${ht.img?`<div class="ph" style="height:auto;aspect-ratio:1/1"><img src="${W(ht.img)}" alt="${esc(ht.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.style.display='none'"></div>`:""}<div class="hb"><div class="tier">${esc(ht.tier)}</div><div class="hn">${esc(ht.name)}</div><div class="hnote">${esc(ht.note||"")}</div></div></div>`).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(g=>'<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(function(it){var n=(typeof it==="string")?it:it.n;var im=(it&&it.img)?it.img:"";return '<div class="actcard"><div class="actim">'+(im?'<img src="'+W(im)+'" alt="'+esc(n)+'" loading="lazy" referrerpolicy="no-referrer">':'')+'</div><div class="actname">'+esc(n)+'</div></div>';}).join('')+'</div>').join('');
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  TOPICS.map(function(t){return [t.id,B[t.id]];}).forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){var _inner=b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,"");var _h=existing.querySelector("h2");if(_h)_h.insertAdjacentHTML("afterend",_inner);else existing.insertAdjacentHTML("afterbegin",_inner);}
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay){var _hh=renderHotels();if(_hh){var _sq=_stay.querySelector("details.qa");if(_sq)_sq.insertAdjacentHTML("beforebegin",_hh);else _stay.insertAdjacentHTML("beforeend",_hh);}}
  var _itin=document.querySelector('.block[data-topic="itin"]');var _acts=renderActs();if(_itin&&_acts){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+_acts);}
  document.querySelectorAll("details.qa").forEach(function(d){if(!d.dataset.text)d.dataset.text=(d.textContent||"").toLowerCase().replace(/\s+/g," ").trim();});
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.map(function(t){return document.querySelector('.block[data-topic="'+t.id+'"]')?t:null;}).filter(Boolean));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const _t=d.dataset.text||(d.textContent||"").toLowerCase().replace(/\s+/g," ");const show=_t.includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);
</script>
</body>
</html>
