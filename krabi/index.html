<style>
/* =========================================================================
   ARBA DESTINATION KB — SHARED STYLE (DO NOT EDIT PER DESTINATION)
   Only the KB {} data object in the script below changes per destination.
   ========================================================================= */
:root{
  color-scheme: light;
  --ink:#1c1c1c; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --soft:#f7f7f7;
  --green:#c8172b; --green2:#e23744; --greend:#a01223; --greensoft:#fdebed;
  --halal:#0a7d63; --star:#c8172b;
  --sea1:#0e5c53; --sea2:#0a7d63;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.11);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;
  font-size:15px;line-height:1.5}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:12px;text-decoration:none}
.brandmark{display:inline-flex;flex-direction:column;align-items:center;line-height:.85;color:var(--green);font-weight:800}
.brandmark>.big{font-size:24px;letter-spacing:.5px}
.brandmark>.sub{font-size:8px;letter-spacing:5px;font-weight:700;margin-top:3px}
.kbtag{font-size:12.5px;color:var(--muted);font-weight:700;border-left:1px solid var(--line);padding-left:12px}
.miniS{flex:1;max-width:520px;margin-left:auto;position:relative}
.miniS input{width:100%;padding:10px 14px 10px 40px;border:1px solid #d9d9d9;border-radius:999px;font-size:14px;outline:none;background:#fff}
.miniS input:focus{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.miniS .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:22px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--sea1),var(--sea2))}
.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,40,36,.34),rgba(6,40,36,.55))}
.hero .in{position:relative;color:#fff;padding:46px 22px;width:100%;max-width:640px}
.kicker{font-size:11.5px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9;margin-bottom:14px}
.hero h1{margin:0 0 10px;font-size:44px;font-weight:800;letter-spacing:-1.5px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero .lead{font-size:15.5px;opacity:.95;margin:0 auto 24px;max-width:500px;font-weight:400;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.bigsearch{position:relative;background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(0,0,0,.24);display:flex;align-items:center;padding:6px 6px 6px 20px;max-width:560px;margin:0 auto}
.bigsearch .si{color:var(--muted);font-size:18px}
.bigsearch input{flex:1;border:none;outline:none;font-size:16px;padding:14px 12px;background:transparent;color:var(--ink)}
.bigsearch button{border:none;background:var(--green2);color:#fff;font-weight:800;border-radius:999px;padding:13px 24px;font-size:15px;cursor:pointer;transition:.15s}
.bigsearch button:hover{background:var(--greend)}
.topicbar{position:sticky;top:53px;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding:2px 0}
.topicbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:#3d3d3d;padding:13px 15px;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--green)}
.tab.active{color:var(--ink);border-bottom-color:var(--green);font-weight:800}
.infosub{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
button.tcard{font:inherit;text-align:left;width:100%;cursor:pointer}
#attractionview{margin-top:18px}
.backbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);margin:2px 0 14px}
.backbtn:hover{border-color:var(--green);color:var(--green)}
.adhero{position:relative;border-radius:20px 20px 0 0;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--sea1),#1596a8)}
.adhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.62))}
.adtitle{position:relative;padding:24px;color:#fff}
.adtitle h1{margin:9px 0 0;font-size:30px;font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.adbody{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 20px 20px;padding:24px;box-shadow:var(--shadow)}
.adlead{font-size:15.5px;line-height:1.6;margin:0 0 6px}
.adbody h3{font-size:15px;font-weight:800;margin:18px 0 8px}
.adbody ul{margin:6px 0;padding-left:20px}.adbody li{margin:6px 0;font-size:14.5px}
.muslimnote{background:#eaf7f0;border:1px solid #cdeede;color:#2f7a60;border-radius:12px;padding:13px 15px;margin:18px 0 6px;font-size:13.5px;line-height:1.55}
.muslimnote b{color:var(--halal)}
.maplink{display:inline-block;margin-top:12px;font-weight:800;font-size:13.5px;color:var(--green);text-decoration:none}
.maplink:hover{text-decoration:underline}
.incexc{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media(max-width:560px){.incexc{grid-template-columns:1fr}}
.incbox,.excbox{border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.incbox{background:#f6fbf8;border-color:#cdeede}
.excbox{background:#fbf7f7;border-color:#f0dede}
.incbox h3,.excbox h3{margin:0 0 9px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.incbox h3{color:var(--halal)}.excbox h3{color:#b03030}
.incbox ul,.excbox ul{list-style:none;padding:0;margin:0}
.incbox li,.excbox li{position:relative;padding:6px 0 6px 23px;font-size:13.5px;border-bottom:1px solid rgba(0,0,0,.05);line-height:1.45}
.incbox li:last-child,.excbox li:last-child{border-bottom:none}
.incbox li::before{content:"\2713";position:absolute;left:2px;top:6px;color:var(--halal);font-weight:800}
.excbox li::before{content:"\2715";position:absolute;left:2px;top:6px;color:#b03030;font-weight:800}
.pkgnote{background:#fff7e6;border:1px solid #f0e0b8;color:#7a5b12;border-radius:12px;padding:11px 14px;margin:14px 0 4px;font-size:13px}
.pkgfoot{margin-top:16px;font-size:12.5px;color:var(--muted)}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 4px}
.shead h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.4px}
.ssub{color:var(--muted);font-size:13.5px;margin:2px 0 16px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.tcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.16s}
.tcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.tcard .im{position:relative;height:160px;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center}
.tcard .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tcard .im .emoji{font-size:46px;opacity:.92;z-index:0}
.tcard .chip{position:absolute;left:11px;top:11px;z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.heart{position:absolute;right:10px;top:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  border:none;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);color:#333}
.heart.on{color:#e0245e}
.tcard .body{padding:13px 14px 15px}
.tcard .body b{font-size:15.5px;font-weight:800;display:block;letter-spacing:-.2px}
.tcard .body p{margin:5px 0 0;font-size:13px;color:var(--muted)}
.tcard .cta{margin-top:11px;display:inline-block;background:#fff;border:1.5px solid var(--ink);color:var(--ink);
  font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;transition:.14s}
.tcard:hover .cta{background:var(--ink);color:#fff}
section.block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
section.block>h2{margin:0 0 12px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
section.block .subtitle{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 12px}
.status{font-size:12.5px;color:var(--muted);margin:12px 0;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#c9ced9;display:inline-block}
.dot.live{background:var(--halal)}.dot.loading{background:#eab308;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
ul.klist{list-style:none;padding:0;margin:8px 0}
ul.klist li{position:relative;padding:8px 0 8px 24px;border-bottom:1px solid var(--soft);font-size:14px}
ul.klist li:last-child{border-bottom:none}
ul.klist li:before{content:"\2713";position:absolute;left:2px;top:7px;color:var(--green);font-weight:800}
table.kb{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
table.kb th{background:var(--greensoft);color:var(--greend);text-align:left;padding:9px 10px;font-weight:800;border:1px solid #f0cdd1}
table.kb td{padding:8px 10px;border:1px solid var(--line);vertical-align:top}
table.kb tr:nth-child(even) td{background:#fafafa}
details.qa{border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff;overflow:hidden}
details.qa[open]{border-color:var(--green);box-shadow:0 2px 12px rgba(200,23,43,.1)}
details.qa summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;font-size:14.5px;display:flex;gap:11px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary .tw{color:var(--green);transition:.15s;flex:0 0 auto;margin-top:1px;font-size:12px}
details.qa[open] summary .tw{transform:rotate(90deg)}
.ans{padding:2px 16px 15px 42px;font-size:14px;color:#333}
.ans p{margin:6px 0}.ans strong{color:var(--ink)}
.ans ul,.ans ol{margin:6px 0;padding-left:20px}.ans li{margin:3px 0}
mark{background:#fff3ba;padding:0 2px;border-radius:3px}
.badge-halal{display:inline-block;background:#eaf7f0;color:var(--halal);border:1px solid #c7ebda;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.noresult{text-align:center;color:var(--muted);padding:30px;display:none}
footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.hidden{display:none!important}
@media(max-width:560px){.hero h1{font-size:26px}.miniS{display:none}.shead h2{font-size:19px}}
.mkt{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:6px 0 22px}
.mkt .mkth{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.mkt .mkth b{font-size:15px;font-weight:700}
.mkt .mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:760px){.mkt .mgrid{grid-template-columns:1fr}}
.mkt h5{margin:0 0 7px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.usp{background:#eaf7f0;border:1px solid #c7ebda;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--halal);margin-top:10px}
.season{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:2px}
.season td{border:1px solid var(--line);padding:5px 9px}
.season td:first-child{font-weight:700;white-space:nowrap;background:#fff}
.expect{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.expect li{margin:3px 0}
.itin{margin:22px 0 4px}
.itin h3{font-size:15px;margin:0 0 12px}
.itday{display:flex;gap:14px;padding:0 0 14px;position:relative}
.itday:not(:last-child)::before{content:"";position:absolute;left:26px;top:30px;bottom:0;width:2px;background:var(--line)}
.itd{flex:0 0 54px;height:54px;border-radius:12px;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;z-index:1}
.itd small{font-size:9px;font-weight:600;opacity:.85;letter-spacing:1px}
.itd b{font-size:19px}
.itc{flex:1;padding-top:3px}
.itc .itt{font-weight:700;font-size:13.5px;margin:0 0 4px}
.itc ul{margin:0;padding-left:17px}
.itc li{font-size:12.8px;margin:2px 0;color:#333}
.custblk{margin:0 0 20px}
.custblk h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.ctbl{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ctbl th{background:var(--soft);text-align:left;padding:8px 10px;font-weight:700;font-size:11.5px;letter-spacing:.3px;border-bottom:1px solid var(--line)}
.ctbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ctbl tr:last-child td{border-bottom:none}
.ctbl .add{color:var(--greend);font-weight:700;white-space:nowrap}
.ctbl .ded{color:var(--halal);font-weight:700;white-space:nowrap}
.ctbl .it{font-weight:600}
.custnote{font-size:11.5px;color:var(--muted);margin:6px 2px 0;font-style:italic}
@media(max-width:640px){.ctbl{font-size:11.5px}.ctbl th,.ctbl td{padding:6px 7px}}
.rtag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;vertical-align:middle}
.notebox{background:var(--greensoft);border:1px solid #f4c9cf;border-radius:12px;padding:11px 14px;font-size:12.8px;color:#4a2b2f;margin:2px 0 14px}
.notebox b{color:var(--greend)}
.hotels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 8px}
@media(max-width:640px){.hotels{grid-template-columns:1fr}}
.hcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.hcard .ph{height:110px;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
.hcard .hb{padding:9px 12px}
.hcard .tier{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.hcard .hn{font-size:13.5px;font-weight:700;margin:2px 0 0}
.hcard .hnote{font-size:12px;color:var(--muted);margin-top:2px}
.actcity{font-size:14px;margin:14px 0 8px;padding-bottom:3px;border-bottom:2px solid var(--green);display:inline-block}
.actgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
@media(max-width:720px){.actgrid{grid-template-columns:repeat(2,1fr)}}
.actcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.actim{aspect-ratio:4/3;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center;font-size:30px}
.actname{padding:7px 9px;font-size:12.5px;font-weight:600}

.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 4px}
.cmp th{background:var(--green);color:#fff;padding:11px 8px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.5px;border:2px solid #fff}
.cmp th.blank{background:transparent;border:none}
.cmp td{border:2px solid #fff;padding:9px 12px;vertical-align:middle}
.cmp td.feat{background:#f3d97a;color:#5a4a12;font-weight:700;font-size:12.5px;width:46%}
.cmp td.val{background:#fbf6e6;text-align:center;font-weight:800;color:#3d3d3d}
.cmp .tick{color:#1a8a3c;font-size:17px;font-weight:900}
.cmp .no{color:#c4c4c4;font-weight:800}
.actim img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
/* ---- Simple Calculator ---- */
.calcblk{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 15px 15px}
.calcblk h3{margin:0 0 10px;font-size:13.5px;color:var(--greend);text-transform:uppercase;letter-spacing:.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.cgrid2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.fld .fl{font-weight:600}
.fld .fh{font-size:11px;color:var(--muted)}
.calcblk input[type=text],.calcblk input[type=number],.calcblk input[type=date],
.calcblk textarea,.calcblk select{
  font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);width:100%}
.calcblk select{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:28px}
.calcblk textarea{resize:vertical}
.calcblk input:focus,.calcblk textarea:focus,.calcblk select:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.cbx{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;font-size:12.5px;cursor:pointer}
.cbx input{margin-top:2px;accent-color:var(--green);width:15px;height:15px;flex:0 0 auto}
.calctbl input.qin{width:74px;padding:5px 6px;font-size:12.5px;text-align:right}
.calctbl input.tin{width:100%;padding:5px 6px;font-size:12.5px}
.calctbl td{vertical-align:middle}
.tr-sum,.cu-sum{font-weight:700;white-space:nowrap}
.calcnote{font-size:11.5px;color:var(--muted);margin:8px 2px 10px}

/* ---- panel boleh-buka (Quick mode) ---- */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 9px;overflow:hidden}
.panel>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;cursor:pointer;
  list-style:none;font-size:13px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .tw{color:var(--green);font-size:10px;transition:transform .15s}
.panel[open]>summary .tw{transform:rotate(90deg)}
.panel>summary .pt{font-weight:700}
.panel>summary .psum{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.panel[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.pbody{padding:13px}
.calcblk .panel{margin-bottom:0}

/* ---- bar ringkasan itinerary ---- */
.dbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--greensoft);border:1px solid var(--line);border-radius:11px;
  padding:8px 12px;font-size:12.5px;margin-bottom:10px}

/* ---- kad hari ---- */
.dayc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.dayc>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;cursor:pointer;
  list-style:none;font-size:12.5px}
.dayc>summary::-webkit-details-marker{display:none}
.dayc[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.dayc.dragging{opacity:.45}
.dayc.dropto{outline:2px dashed var(--green2);outline-offset:-2px}
.dgrip{flex:0 0 auto;color:var(--muted);font-size:14px;cursor:grab;line-height:1;user-select:none}
.dgrip:active{cursor:grabbing}
.dayc>summary{user-select:none}
.dnum{flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:var(--green);color:#fff;
  font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.ddate{flex:0 0 auto;color:var(--muted);font-size:11.5px;min-width:78px}
.dname{flex:1 1 170px;font-weight:700}
.dchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dchip{font-size:10.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;
  padding:2px 8px;color:var(--muted);white-space:nowrap}
.dayc[open]>summary .dchip{background:#fff}
.dchip.dcost{font-weight:700}
.dchip.dcost.on{background:var(--greensoft);border-color:var(--green2);color:var(--greend)}
.dacts{display:flex;gap:4px;flex:0 0 auto}
.xbtn{font:inherit;font-size:13px;line-height:1;width:24px;height:24px;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.xbtn:hover{background:var(--greensoft);color:var(--greend);border-color:var(--green2)}
.dbody{padding:11px}
.aowrap{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.aowrap>.fl{display:block;font-weight:600;margin-bottom:6px}
.aorow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.aorow select{flex:1 1 210px;width:auto}
.aorow input.qin{width:78px}
.aosum{font-weight:700;min-width:76px;text-align:right;font-size:12px;white-space:nowrap}

.ctot{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.ctot>div{flex:1 1 190px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ctl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ctv{display:block;font-size:19px;font-weight:800;color:var(--greend);margin-top:2px}
.cbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.cbtn{font:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;border:none;
  background:var(--green);color:#fff;cursor:pointer}
.cbtn:hover{background:var(--green2)}
.cbtn2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.cbtn2:hover{background:var(--soft)}
.cbtn3{background:#fff;color:var(--greend);border:1px solid var(--line);font-size:12px;padding:6px 13px}
.cbtn3:hover{background:var(--greensoft)}
@media(max-width:640px){
  .calctbl input.qin{width:58px}
  .ddate{display:none}
  .aorow input.qin{width:64px}
}

/* ---- pemilih varian pakej (destinasi berbilang pakej) ---- */
.pkgsel{margin-bottom:12px}
.pkgsel .fl{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
.pkgsel select{font:inherit;font-size:13.5px;font-weight:600;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);width:100%;cursor:pointer}
.pkgsel select:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.dayc .dchips .dchip.dreg{color:var(--ink);font-weight:700;letter-spacing:.3px}
.dayc .dchips .dchip.dwarn{background:#fdecec;color:#b3261e;border-color:#f3c9c6;font-weight:700}
.dayc .dchips .dchip.dcost.dded{background:#eef3fb;border-color:#c9d8ef;color:#1a4d8f}
.dayc .dnum.dnumx{background:#eef3fb;color:#1a4d8f;box-shadow:inset 0 0 0 1.5px #9dbbe4}
.calcblk .calcwarn,.block[data-topic="calc"]>.calcwarn{margin:10px 0 0;padding:9px 12px;border-radius:10px;
  background:#fdecec;border:1px solid #f3c9c6;color:#b3261e;font-size:12.5px;line-height:1.45}
.dname{flex:1 1 210px;min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:400}
.dnm{font-weight:700}
.dprev{font-size:11.5px;color:var(--muted);line-height:1.35;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dstops{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.dstops>.fl{display:block;font-weight:600;margin-bottom:6px}
.dlist{margin:0;padding-left:17px}
.dlist li{margin-bottom:3px}
.calcblk .calcincl{margin:9px 0 0;padding:8px 11px;border-radius:9px;background:var(--soft);
  border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.45}
.warnred{color:#b3261e}


/* ---- breakdown harga per pax (bawah jadual ringkasan) ---- */
.calcbrk{width:100%;border-collapse:collapse;margin:.35rem 0 .5rem}
.calcbrk td{padding:.28rem .5rem;border-bottom:1px solid var(--line,#e5e7eb);font-size:.86rem}
.calcbrk td.add{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.calcbrk td.add.dded{color:#b3261e}
.calcbrk tr.brkt td{border-top:2px solid var(--line,#e5e7eb);border-bottom:none;
  background:var(--soft,#f8fafc)}
.brkh{margin:.6rem 0 .1rem;font-size:.9rem}
.brkn{margin:.15rem 0 0;font-size:.78rem;color:var(--muted,#64748b);line-height:1.45}
.calcbrk tr.brks td{border-top:1px solid var(--line);color:var(--muted)}
.calcbrk tr.brks td.add{color:var(--ink)}

/* ---- cip flag tambah/tolak pada baris hari ---- */
.dchip.dadj{background:var(--soft,#f1f5f9);border:1px solid var(--line,#e2e8f0);
  font-size:.72rem;font-weight:600}
.dchip.dadj.dded{color:#b3261e;border-color:#f3c9c4}
.dchip.dadj.dtrip{border-style:dashed;opacity:.9}

</style>
</head>

k-kanak.","inc":["3 Nights Accommodation (3 Star Hotel)","Private Transportation (D1 & D4)","Shared Transport Activities","Entrance Fees (as stated in itinerary)","Half-board Meals (3 International Breakfast, 2 Lunch)","Tour Guide (English Spoken)","Tipping Fee"],"exc":["International Flight Ticket","In-Flight Meal","Additional Tours & Meals","Personal Expenses","Travel Insurance","Dinner"]},{"n":"PT Krabi Standard 4D3N","tag":"Krabi · 4D3N · Standard · dari RM1,297/pax","sub":"4-Islands + pilihan Emerald Pool / Phi Phi — dari RM1,297/pax","emoji":"⛰️","img":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Railay_Beach_5.jpg/1280px-Railay_Beach_5.jpg","intro":"Pakej penuh. Krabi City Tour, 4-Islands Tour, dan Day 3 pilihan Emerald Pool + Tiger Cave (land tour) ATAU Phi Phi Island / Maya Bay (+RM100/pax, speedboat). Harga katalog dari RM1,297/pax.","note":"Day 3 boleh pilih Emerald Pool (default) atau Phi Phi Island (+RM100/pax). Harga jual sama; kos beza (speedboat lebih mahal).","inc":["3 Nights Accommodation (3 Star Hotel)","Private Transportation (D1 & D4)","Shared Transport Activities","Entrance Fees (as stated in itinerary)","Half-board Meals (3 International Breakfast, 2 Lunch)","Tour Guide (English Spoken)","Tipping Fee"],"exc":["International Flight Ticket","In-Flight Meal","Additional Tours & Meals","Personal Expenses","Travel Insurance","Dinner"]},{"n":"PT Krabi Honeymoon 4D3N","tag":"Krabi · 4D3N · Honeymoon","sub":"Standard + candlelight dinner, bouquet & room decoration","emoji":"💑","img":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/A_view_of_Ao_Nang_beach%2C_Krabi.jpg/1280px-A_view_of_Ao_Nang_beach%2C_Krabi.jpg","intro":"Untuk pasangan. Itinerari sama seperti Standard, ditambah candlelight dinner (D1), sejambak bunga, hiasan bilik honeymoon dan fullboard (semua dinner included). Sebut harga dengan ops.","note":"Honeymoon = Standard + candlelight dinner, bouquet, room deco, fullboard. Harga: sebut harga (base Standard + honeymoon label class='fld'><span class='fl'>Child With Bed (3-11)</span><input id='c_cwb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Child No Bed (3-7)</span><input id='c_cnb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Infant (bawah 2)</span><input id='c_inf' type='number' min='0' value='0'><span class='fh'>Bawah 3 tahun = FOC (katalog)</span></label><label class='fld'><span class='fl'>Bilik single</span><input id='c_single' type='number' min='0' value='0'><span class='fh'>Single supplement +RM450/pax (semua varian)</span></label></div><p class='calcnote' id='c_tier'></p></div><details class='panel' id='p_itin'><summary><span class='tw'>&#9654;</span><span class='pt'>Ubah itinerary</span><span class='psum' id='p_itin_s'></span></summary><div class='pbody'><div class='dbar'><span id='c_bar'></span><button type='button' id='c_expand' class='cbtn cbtn3'>Buka semua</button></div><div id='c_days'></div><div class='cbtns'><button type='button' id='c_addday' class='cbtn'>+ Tambah Hari</button><button type='button' id='c_reload' class='cbtn cbtn2'>Muat semula itinerary asal</button></div><p class='calcnote'>Seret baris hari (&#10303;) untuk susun semula &mdash; nombor hari dan tarikh berubah sendiri. Tambah atau buang hari akan laraskan <b>return date</b>. Pilihan bertanda <i>Termasuk pakej</i> tidak menambah kos.</p></div></details><div class='custblk calcblk'><h3>Ringkasan quotation</h3><table class='ctbl calctbl'><thead><tr><th>Item</th><th>Bil.</th><th>Harga seunit (RM)</th><th>Jumlah (RM)</th></tr></thead><tbody id='c_lines'></tbody></table><div class='ctot'><div><span class='ctl'>Grand Total</span><span class='ctv' id='c_grand'>RM 0</span></div><div><span class='ctl'>Per pax (final, semua kos)</span><span class='ctv' id='c_perpax'>RM 0</span></div><div><span class='ctl'>Deposit</span><span class='ctv' id='c_dep_amt'>RM 0</span></div></div><div class='cbtns'><button type='button' id='c_pdf' class='cbtn'>Jana Quotation PDF</button><button type='button' id='c_reset' class='cbtn cbtn2'>Reset semua</button></div><p class='calcnote'>Quotation dibuka dalam <b>tab baharu</b> mengikut format rasmi ARBA &mdash; dari situ tekan <b>Muat turun PDF</b> untuk simpan fail.</p></div>","surcharge":"<h2>Surcharge</h2><p class='ssub'>Surcaj ikut katalog customer — dari tab Surcharge &amp; Accommodation PT R&amp;D Costing Hub.</p><div class='custblk'><h3>PAKEJ KRABI BASIC · 4D3N · PAKEJ KRABI STANDARD · 4D3N · PAKEJ KRABI HONEYMOON · 4D3N</h3><table class='ctbl'><thead><tr><th>Musim</th><th>Tarikh perjalanan</th><th>Surcaj</th></tr></thead><tbody><tr><td class='it'>Peak Season</td><td>11 Jan 2026 - 30 Apr 2026</td><td class=add>RM250/Pax</td></tr><tr><td class='it'>Peak Season</td><td>01 Nov 2026 - 31 Dec 2026</td><td class=add>RM300/Pax</td></tr><tr><td class='it'>May - June</td><td>-</td><td class=add>No Additional Surcharge</td></tr></tbody></table></div>","transport":"<h2>Transportation &amp; Guide</h2><div class='custblk'><table class='ctbl'><thead><tr><th>Hari</th><th>Transport</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>D1 & D4</td><td>Private transport</td><td>Airport ⇄ hotel (10 jam basis)</td></tr><tr><td class='it'>D2</td><td>SIC Long-tail Boat</td><td>4-Islands (sharing)</td></tr><tr><td class='it'>D3</td><td>SIC Speedboat / Coach</td><td>Hong Island / Emerald / Phi Phi</td></tr><tr><td class='it'>Guide</td><td>English speaking (tempatan)</td><td>Tipping included</td></tr></tbody></table><p class='custnote'>Private transport 10 jam basis; extra hour cash to driver (negotiable).</p></div>","stay":"<h2>Accommodation</h2><p class='ssub'>Hotel 3★ Aonang (3 malam), sarapan included — Aonang Silver Orchid / Apasari. Upgrade 4★ +RM240/pax; 4★+ Aonang Princeville sebut harga. Single supplement +RM450/pax.</p>","flight":"<div class='custblk'><h3>✈️ Flight Recommendation (KUL → KBV)</h3><table class='ctbl'><thead><tr><th>Airline</th><th>Flight</th><th>Departs KUL</th><th>Arrives KBV</th><th>Type</th><th>Est. RTP (RM)</th><th>Freq</th></tr></thead><tbody><tr><td class='it'>AirAsia X</td><td>AK 868</td><td>1:40 PM</td><td>1:55 PM</td><td>Low Cost</td><td class='add'>RM 320–380</td><td>*Mon/Wed NA</td></tr><tr><td class='it'>Firefly</td><td>FY 3610</td><td>11:30 AM</td><td>12:00 PM</td><td>Low Cost</td><td class='add'>RM 360–400</td><td>Daily</td></tr></tbody></table><p class='custnote'>KUL–KBV direct ~1j 20–25 min. Batik Air Malaysia juga terbang laluan ini. Anggaran round-trip; harga & jadual berubah — sahkan semasa booking.</p></div>","freegift":"<h2>🎁 Free Gift (Promo)</h2><details class='qa' data-text='free gift untuk campaign atau promo? krabi: upgrade to 7 islands + sunset bbq + plankton kod: fkbv2 bullet: brb luggage tag / pocket wifi 4g (per booking) *bullet wajib tanya po/leader disclaimer: sila sahkan dengan po jika di luar waktu promo.'><summary><span class='tw'>▶</span><span>Free Gift untuk campaign atau Promo?</span></summary><div class='ans'><p><strong>Krabi:</strong> Upgrade to 7 Islands + Sunset BBQ + Plankton <span class='rtag'>Kod: FKBV2</span></p><p><strong>Bullet:</strong> BRB Luggage Tag / Pocket WiFi 4G (per booking)</p><p style='color:#b03030'>*Bullet wajib tanya PO/Leader</p><p style='color:#b03030'><strong>Disclaimer:</strong> Sila sahkan dengan PO jika di luar waktu Promo.</p></div></details>"},"snapshot":"# PT Krabi — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*3 varian: **Budget** (4-Islands + Hong Island), **Standard** (4-Islands + Emerald Pool/Phi Phi), **Honeymoon** (Standard + candlelight dinner, bouquet, room deco, fullboard). Semua 4D3N, ground-only, 3★ Aonang.*\n\n- CWB = Adult − RM200 · CNB = Adult − RM400 · Infant (<3 thn) FOC. Umur: Adult ≥12, CWB 3–11, CNB 3–7.\n- Pakej **ground-only** — tiket penerbangan tidak termasuk (ARBA boleh uruskan).\n- Meals: **halfboard** (3B + 2L); dinner own expense kecuali **Honeymoon** (fullboard).\n- Budget Day 3 = Hong Island; **tiada** pilihan Emerald/Phi Phi. Standard/Honeymoon Day 3 = Emerald Pool (default) atau Phi Phi (+RM100/pax).\n- Itinerari & hotel difinalkan **15 hari** sebelum trip.\n- Private transport 10 jam basis (extra hour cash to driver).\n- Passport sah minimum **6 bulan**; Malaysia **visa-free 30 hari** (isi TDAC sebelum tiba).\n- Island hopping tidak digalakkan untuk warga emas / wanita mengandung — bot mencabar. Musim terbaik **Nov–Apr**.\n- Muslim-friendly (halal, surau/masjid) baseline — Krabi komuniti Muslim besar, halal mudah di Aonang. Awas monyet di Phra Nang Cave & pantai.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Apa yang best di Krabi?**\nKrabi destinasi mesra Muslim — mudah cari makanan halal & masjid. Terkenal dengan alam & jungle: tebing batu kapur, lagun tersembunyi, emerald pool dan island hopping long-tail boat. Bandar kecil santai berbanding Phuket.\n\n**Beza Budget, Standard dan Honeymoon?**\nBudget: 4-Islands + Hong Island. Standard: 4-Islands + Day 3 pilihan Emerald Pool atau Phi Phi (+RM100). Honeymoon: sama Standard + candlelight dinner, bouquet, hiasan bilik & fullboard.\n\n**Ada aktiviti snorkeling?**\nYa — island hopping & snorkeling aktiviti utama Day 2 (4-Islands) dan Day 3 (Hong Island / Phi Phi). Air laut jernih, boleh lihat terumbu karang.\n\n**Pakej termasuk tiket flight?**\nBelum. Private ground-only. Book sendiri (AirAsia AK868 / Firefly FY3610) atau minta ARBA belikan.\n\n**Boleh customize itinerari?**\nBoleh — Private Tour fleksibel. Contoh add-on: Phi Phi (+RM100), 7-Islands + Plankton (+RM80 upgrade / RM250 full), kayaking Hong Island (RM70/50).\n\n**Berapa lama transport tiap hari?**\nPrivate transport 10 jam basis (D1 & D4). Extra hour dikenakan cash to driver.\n\n### B. Halal, Makanan & Solat\n\n**Senang dapat makanan halal di Krabi?**\nSangat mudah, terutama Aonang — komuniti Muslim besar, banyak restoran Thai-Muslim, seafood halal & gerai berhampiran masjid (Jame Food Centre, Madina).\n\n**Macam mana ARBA pastikan halal?**\nTeam ARBA pergi ke Krabi untuk pastikan operator pilih restoran yang menepati kriteria halal / Muslim-friendly.\n\n**Ada masjid / surau untuk solat?**\nYa — Masjid Nurul Islam / Ao Nang Mosque untuk solat harian & Jumaat. Di pulau tiada surau — solat jamak-qasar di hotel.\n\n**Akan makan apa?**\nHalfboard: 3 sarapan + 2 makan tengahari (dinner own expense). Honeymoon: fullboard (semua meals). Lunch island tour sharing buffet.\n\n### C. Visa & Passport\n\n**Perlu visa ke Thailand?**\nTidak. Rakyat Malaysia visa-exempt 30 hari. Perlu bukti perjalanan pulang.\n\n**Perlu isi apa-apa sebelum masuk?**\nYa — Thailand Digital Arrival Card (TDAC) dalam talian sebelum tiba.\n\n**Passport sah berapa lama?**\nMinimum 6 bulan dari tarikh berlepas.\n\n### D. Flight & Airport\n\n**Berapa lama flight KL–Krabi?**\nDirect ~1 jam 25 minit ke Krabi International Airport (KBV). AirAsia X (AK868) & Firefly (FY3610) — Batik Air Malaysia juga terbang laluan ini.\n\n**Anggaran harga tiket?**\nRate card: AK868 RM320–380 (Mon/Wed NA), FY3610 RM360–400 (daily) round-trip. Harga berubah — sahkan semasa booking.\n\n**Transfer dari airport macam mana?**\nPrivate transport disediakan Day 1 & Day 4 (airport ⇄ hotel).\n\n### E. Hotel & Bilik\n\n**Boleh upgrade hotel?**\nBoleh — 4★ +RM240/pax (Krabi Cha-Da / Heritage / Blue Tara / Aonang Buri / AVA Sea / Ananta Burin / Bluesotel). 4★+ Aonang Princeville sebut harga.\n\n**Berapa orang sebilik?**\n2–3 orang sebilik. Single occupancy +RM450/pax.\n\n**Sesuai honeymoon?**\nYa — varian Honeymoon ada candlelight dinner, sejambak bunga & hiasan bilik.\n\n### F. Cuaca & Musim\n\n**Bila waktu terbaik?**\nNovember–April (musim kering) — laut tenang, cuaca cerah, sesuai island hopping. Suhu 22–32°C.\n\n**Macam mana Mei–Oktober?**\nMusim hujan (monsoon) — hujan lebat & ribut petir boleh jejas aktiviti laut. Kelebihan: harga lebih murah, kurang orang.\n\n**Kalau aktiviti pulau cancel sebab hujan?**\nAmalan biasa: tiada refund. Driver-guide adjust itinerari (cth city tour). Sahkan dengan operator.\n\n### G. Shopping & Duit\n\n**Mata wang apa?**\nThai Baht (THB). Kad OK di hotel & restoran besar; tunai THB perlu untuk pasar, kedai kecil & add-on on-site.\n\n**Cash poket berapa?**\nCadangan RM500–1,500 per orang bergantung tabiat membeli-belah & optional activities.\n\n### H. Payment & Refund\n\n**Bila itinerari difinalkan?**\n15 hari sebelum trip. Harga quotation sah 24 jam. Pakej sah travel hingga 31 Dec 2026.\n\n### I. Add-ons & Customization\n\n**Apa boleh tambah?**\nPhi Phi D3 (+RM100), upgrade 7-Islands + Plankton (+RM80 / RM250 full), kayaking Hong Island (RM70/50), Pocket WiFi (RM80/120), takaful TripCare 360, luggage tracker.\n\n**Free gift promo?**\nKrabi: Upgrade to 7 Islands + Sunset BBQ + Plankton (kod FKBV2). Bullet (BRB Luggage Tag / Pocket WiFi 4G) — wajib tanya PO/Leader; sahkan jika di luar waktu Promo.\n\n### J. Kesihatan & Keselamatan\n\n**Island hopping sesuai untuk semua?**\nSesuai untuk kebanyakan orang, TAPI tidak digalakkan untuk warga emas, wanita mengandung atau yang ada masalah kesihatan — perjalanan bot mencabar. Pakai life jacket.\n\n**Awas apa-apa?**\nMonyet di Phra Nang Cave & pantai — jangan tunjuk makanan, tutup beg. Ambil takaful perjalanan (aktiviti laut ada risiko).\n\n### K. Praktikal (SIM / Socket / Toilet)\n\n**Internet macam mana?**\nPocket WiFi RoamingMan (3GB 4G RM80 / 10GB 5G RM120 untuk 4D3N) atau roaming/eSIM sendiri. Liputan baik di Aonang & Krabi Town.\n\n**Socket & plug?**\nThailand Type A/B/C, 220V. Bawa universal adapter.\n\n### L. Packing\n\n**Apa perlu bawa?**\nBaju ringan cepat kering, swimwear muslim-friendly, sunblock, topi, kasut air, telekung/sejadah ringkas, bekal snek halal, dan cash THB.\n"}</script>

/* --- markdown engine --- */
function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"compare",t:"Perbezaan Pakej"},
 {id:"itin",t:"Itinerary & Aktiviti"},{id:"pricing",t:"Harga & Pakej"},{id:"custom",t:"Simple Customisation"},
 {id:"calc",t:"Simple Calculator"},
 {id:"surcharge",t:"Surcharge"},{id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"flight",t:"Flight & Airport"},{id:"prayer",t:"Solat"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},
 {id:"polisi",t:"Polisi & Payment"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(ht=>`<div class="hcard"><div class="ph">${ht.img?`<img src="${W(ht.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=String.fromCharCode(127976)">`:(ht.emoji||"🏨")}</div><div class="hb"><div class="tier">${esc(ht.tier)}</div><div class="hn">${esc(ht.name)}</div><div class="hnote">${esc(ht.note||"")}</div></div></div>`).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(g=>'<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(function(it){var n=(it&&typeof it==="object")?it.n:it;var im=(it&&typeof it==="object")?it.img:"";var ph=im?'<img src="'+W(im)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=String.fromCharCode(128205)">':String.fromCharCode(128205);return '<div class="actcard"><div class="actim">'+ph+'</div><div class="actname">'+esc(n)+'</div></div>';}).join('')+'</div>').join('');
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  [["compare",B.compare],["pricing",B.pricing],["custom",B.custom],["calc",B.calc],["surcharge",B.surcharge],["transport",B.transport],["stay",B.stay],["flight",B.flight],["freegift",B.freegift]].forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){existing.insertAdjacentHTML("beforeend",b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,""));}
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay)_stay.insertAdjacentHTML("beforeend",renderHotels());
  var _itin=document.querySelector('.block[data-topic="itin"]');if(_itin){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+renderActs());}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=(d.dataset.text||d.textContent||"").toLowerCase().includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});

  function optsG(arr,sel){

    for(var i=0;i<arr.length;i++){
      var o=arr[i],g=o.g||"";
      if(g!==cur){
        if(open){out+="</optgroup>";open=false;}
        if(g){out+="<optgroup label='"+esc2(g)+"'>";open=true;}
        cur=g;
      }
      out+="<option value='"+o.v+"'"+(o.v===sel?" selected":"")+">"+o.t+"</option>";
    }
    if(open)out+="</optgroup>";
    return out;
  }
  /* amaun bertanda — pilihan boleh menolak dari harga katalog, jadi jangan andai '+' */
  function sgn(v){return (v<0?"-":"+")+rm0(Math.abs(v));}
  /* Label pilihan untuk SATU hari: awalan kawasan hari itu + amaun sebenar yang akan
     dikenakan. Tujuannya supaya TC nampak kos itu berlabuh pada blok itinerary yang
     dipilih (contoh "[Nami] Private Transport ... - RM 1,400"), bukan angka generik. */
  function optsFor(arr,sel,reg,kind){
    return arr.map(function(o){
      var lbl=(reg&&kind==="trp"&&(o.guided||o.cost==="day")?reg+" ":"")+o.t,bits=[];
      if(kind==="trp"&&o.cost==="day"){
        var dr=dayRateFor(reg);
        bits.push(dr.amt?rm0(dr.amt):"kadar belum diisi");
      }
      if(kind==="acc"&&o.cost==="night"){
        var nr=accNightRate(o,reg);
        bits.push(nr?rm0(nr)+" per pax":"kadar belum diisi");
      }
      if(kind==="meal"){var ma=mealAmt(o);if(ma)bits.push(sgn(ma)+" per pax");}
      var a=optAmt(o,reg);
      if(a.unitPax)bits.push(sgn(a.unitPax)+" per pax");
      if(a.unitVeh)bits.push(sgn(a.unitVeh));
      if(a.gap&&!bits.length)bits.push("kadar belum diisi");
      if(bits.length)lbl+=" &mdash; "+bits.join(" &middot; ");
      return "<option value='"+o.v+"'"+(o.v===sel?" selected":"")+">"+lbl+"</option>";
    }).join("");
  }
  function addonOpts(sel){return ADDONS.map(function(a,i){
    return "<option value='"+i+"'"+(i===sel?" selected":"")+">"+a[0]+(a[1]?" ("+rm0(a[1])+")":"")+"</option>";}).join("");}

  /* ---------- model hari ---------- */
  var days=[],state={},dragFrom=null;
  /* Hari yang TC tambah sendiri ditanda `ext:true`. Bezanya penting: harga katalog
     sudah termasuk hari berpandu + malam pakej, jadi hari PAKEJ mesti kekal 'termasuk'
     walau apa pun blok itinerary yang dipilih. Hanya hari tambahan yang berkos.
     CFG.extDefaults = {acc:"...", trp:"..."} menetapkan pilihan mana yang dipakai
     bila satu blok 'termasuk' diletak pada hari tambahan. */
  var EXTD=CFG.extDefaults||{};
  /* Tukar blok itinerary = enjin pilih sendiri pilihan transport/hotel yang betul.
     Keputusan bergantung pada PERALIHAN, bukan sekadar sama ada hari itu tambahan:

       hari sudah berpandu  + blok berpandu     -> kekal 'termasuk pakej' (swap, RM 0)
       hari tiada transport + blok berpandu     -> hari berpandu tambahan  -> berkos
       hari sudah berpandu  + blok tanpa guide  -> tolak dari katalog (ProdReq 8.6)
       hari tambahan (ext)  + apa-apa blok      -> sentiasa berkos

     TC masih boleh menimpa mana-mana pilihan selepas itu. */
  /* Pilihan yang sudah menanggung kosnya sendiri — auto-substitusi tidak boleh
     menimpanya, sebab config sengaja memilih pilihan itu untuk blok tersebut. */
  function hasOwnCost(o){
    return !!(o.perPax||o.perVehicle||o.perPaxRate||o.perVehicleRate);
  }
  function applyPreset(d,pr){
    var oldTrp=find(TRP,d.trp);
    var wasGuided=!!oldTrp.guided,               /* hari berpandu (pakej atau tambahan) */
        wasExt=oldTrp.cost==="day",              /* sudah ditanda hari tambahan berkos  */
        wasDrop=!!EXTD.trpDrop&&oldTrp.v===EXTD.trpDrop;  /* sudah ditanda tolak        */
    d.preset=pr.v;d.acc=pr.acc;d.meal=pr.meal;d.trp=pr.trp;
    var newAcc=find(ACC,pr.acc),newTrp=find(TRP,pr.trp);
    if(d.ext){
      if(EXTD.acc&&newAcc.cost==="incl")d.acc=EXTD.acc;
      if(EXTD.trp&&newTrp.cost==="incl")d.trp=EXTD.trp;
      return;
    }
    /* Jadi hari tambahan berkos bila pakej tiada transport untuk hari ini, ATAU bila
       hari ini sudah ditanda tambahan sebelum ini (tukar blok lagi jangan hilangkan kos). */
    if(EXTD.trp&&newTrp.guided&&newTrp.cost==="incl"&&(!wasGuided||wasExt))d.trp=EXTD.trp;
    /* Kekalkan tolakan bila hari berpandu pakej ditukar kepada blok tanpa guide —
       KECUALI blok itu sendiri sudah bawa kos (contoh KTX / flight pindah bandar),
       kerana pilihannya sendiri yang betul, bukan pilihan tolakan. */
    else if(EXTD.trpDrop&&!newTrp.guided&&newTrp.cost==="zero"&&!hasOwnCost(newTrp)
            &&(wasGuided||wasDrop))
      d.trp=EXTD.trpDrop;
  }
  function mkDay(p,isExt,baseRegion){
    var pr=find(presets(),p||"ext");
    var d={preset:pr.v,custom:"",date:"",acc:pr.acc,meal:pr.meal,trp:pr.trp,
           ext:!!isExt,baseRegion:baseRegion||"",
           addons:[{i:0,qa:0,qc:0,auto:false}],open:false};
    applyPreset(d,pr);
    return d;
  }
  function loadDefault(){
    days=presets().slice(0,V().itin.length).map(function(p){return mkDay(p.v,false,p.region);});
  }
  function lastIdx(){return days.length-1;}
  function autoDates(){var dep=$c("c_dep").value;days.forEach(function(d,i){d.date=dep?shift(dep,i):"";});}
  function syncReturn(){var dep=$c("c_dep").value;if(dep)$c("c_ret").value=shift(dep,days.length-1);}
  function syncDaysToDates(){
    var dep=$c("c_dep").value,ret=$c("c_ret").value;
    if(!dep||!ret)return;
    var target=daysBetween(dep,ret)+1;
    if(target<2||target>60){syncReturn();return;}
    while(days.length<target)days.splice(Math.max(1,lastIdx()),0,mkDay("ext",true));
    while(days.length>target&&days.length>2)days.splice(Math.max(1,lastIdx()-1),1);
    autoDates();
  }

  /* ---------- kadar bergantung musim ---------- */
  function payPax(){return n("c_adult")+n("c_cwb")+n("c_cnb");}
  function vehicles(){return Math.max(1,Math.ceil((payPax()||1)/(EX().paxPerVehicle||7)));}
  function isPeakTrip(){return (state.season&&state.season.peakNights)>0;}
  /* Kadar extension boleh datang dalam dua bentuk:
       ext.night / ext.day        -> satu pasang {normal,peak} untuk semua saiz group
       ext.nightTiers / dayTiers  -> [{from,to,normal,peak}] bila kadar ikut bilangan pax
                                     (contoh NZ: transport RM2300 untuk 2-3 pax, RM3600 untuk 7-10)
     Padanan tier ikut julat PERTAMA yang muat, sama seperti tierRow(), jadi julat
     bertindih dalam rate sheet (2-3, 3-4, 4-5 ...) berkelakuan seperti bracket kapasiti. */
  function extTier(list,p){
    for(var i=0;i<list.length;i++)if(p>=list[i].from&&p<=list[i].to)return list[i];
    return p<list[0].from?list[0]:list[list.length-1];
  }
  function extRate(flat,tiers){
    var r=(tiers&&tiers.length)?extTier(tiers,payPax()||1):(flat||{normal:0,peak:0});
    return isPeakTrip()?(r.peak||0):(r.normal||0);
  }
  function nightRate(){var e=EX();return extRate(e.night,e.nightTiers);}
  /* Pilihan accommodation boleh bawa `nightRate` (kunci ext.rates) kalau malam
     tambahannya ada kadar tersiar sendiri — contoh malam 4 bintang RM400 (ProdReq 7),
     bukan malam 3 bintang RM250 campur upgrade. Kalau tiada, ext.night dipakai. */
  function accNightRate(o,region){
    if(o&&o.nightRate){var a=rateAmt(o.nightRate,region);return a==null?0:a;}
    return nightRate();
  }
  /* ---------- breakfast ikut varian ----------
     Sesetengah pakej memang sudah termasuk breakfast hotel dan sesetengah tidak
     (Perth: Standard 3 bintang apartment tanpa breakfast, Premium 4 bintang hotel
     dengan breakfast). Blok itinerary DIKONGSI antara varian, jadi blok yang
     membawa breakfast akan menjanjikan breakfast yang tidak dijual bila dipilih
     pada varian Standard -- dan menjatuhkannya bila blok tanpa breakfast dipilih
     pada Premium. `variants[].breakfast` memaksa komponen breakfast mengikut
     varian supaya TC tidak perlu fikir, dan mealDelta kekal neutral kerana
     baseline dan pilihan semasa kedua-duanya dinormalkan oleh mealOf().
     Pilihan bertanda `bfLock` dikecualikan -- guna untuk hari ketibaan, yang tiada
     breakfast pada mana-mana varian. Tanpa `variants[].breakfast`, mealOf() pulang
     pilihan itu sendiri, jadi config destinasi lain tidak berubah sama sekali. */
  function bfOn(){var v=V();return (v&&v.breakfast!=null)?!!v.breakfast:null;}
  function mealOf(key){
    var o=find(MEAL,key),on=bfOn();
    if(on===null||!o||o.bfLock)return o;
    var c={},k;for(k in o)c[k]=o[k];
    c.b=on?1:0;
    var parts=String(o.lbl==null?"":o.lbl).split(", ").filter(function(x){
      return x&&x!=="-"&&!/breakfast/i.test(x);});
    if(on)parts.unshift(CFG.breakfastLabel||"Hotel Breakfast");
    c.lbl=parts.length?parts.join(", "):"-";
    return c;
  }
  function mealRate(){return CFG.meals||{lunch:0,dinner:0};}
  /* Bilangan hidangan satu pilihan meal (breakfast + lunch + dinner). */
  function mealCount(o){return o?((o.b?1:0)+(o.l?1:0)+(o.d?1:0)):0;}
  /* CFG.mealDelta = {add, drop} - kadar per pax PER HIDANGAN bila TC menambah atau
     membuang hidangan berbanding apa yang blok itinerary itu sendiri isytiharkan.
     Ini menyelesaikan dua masalah sekaligus:
       - CFG.meals mengenakan SETIAP lunch/dinner dalam itinerari, termasuk yang sudah
         ada dalam harga katalog -> double-count. Sebab itu ia diset 0.
       - Tetapi dengan 0, menukar dropdown meal jadi PERCUMA secara senyap.
     Delta berbanding blok menyelesaikan kedua-duanya: tiada perubahan = RM 0, dan
     setiap hidangan yang ditambah/dibuang dicaj pada kadarnya sendiri (tidak simetri:
     tambah RM45, tolak RM30). Baseline ialah `meal` blok itu, bukan indeks hari, jadi
     ia kekal betul walaupun hari disusun semula atau ditambah. */
  function mealDeltaOf(d,pr,pay){
    var md=CFG.mealDelta;if(!md)return null;
    var basen=mealCount(mealOf((pr&&pr.meal)||d.meal)),
        curn=mealCount(mealOf(d.meal)),dn=curn-basen;
    if(!dn)return null;
    var per=dn>0?dn*(md.add||0):dn*(md.drop||0);
    return {meals:dn,perPax:per,total:per*(pay||0)};
  }
  /* Kos makan satu hari untuk satu pax, ikut pilihan meal yang dipilih. */
  function mealAmt(o){var m=mealRate();
    return (o.l||0)*(m.lunch||0)+(o.d||0)*(m.dinner||0);}
  /* Hint yang menyebut kadar sebenar, bukan "ikut kadar makan" yang kabur. */
  function mealHint(o){
    var m=mealRate(),b=[];
    if(o.l&&m.lunch)b.push(o.l+" lunch x "+rm0(m.lunch));
    if(o.d&&m.dinner)b.push(o.d+" dinner x "+rm0(m.dinner));
    if(b.length)return b.join(" + ")+" = "+sgn(mealAmt(o))+" per pax";
    if(o.l||o.d)return "Kadar makan belum diisi &mdash; untuk paparan quotation sahaja";
    return "";
  }
  /* Hari "berpandu" = hari yang ada transport + guide (pilihan bertanda guided:true).
     `free` = berpandu tetapi dikira sebagai bahagian pakej (cost incl);
     `paid` = berpandu tetapi dicaj sebagai hari tambahan (cost day). */
  function guidedOf(list){
    var free=0,paid=0;
    list.forEach(function(x){
      var o=find(TRP,x.trp);
      if(!o||!o.guided)return;
      if(o.cost==="day")paid++;else free++;
    });
    return {free:free,paid:paid,total:free+paid};
  }
  function guidedBase(){return guidedOf(V().itin||[]);}

  /* ---------- kadar berkunci: kunci -> region -> band pax -> normal/peak ----------
     ext.rates = { kunci: { "<region>"|"_default": [{from,to,normal,peak}] } }
     Satu mekanisme untuk semua kadar yang bergantung pada kawasan itinerary, saiz
     group dan musim. Pulang null bila kunci/region/band tiada dalam sumber — pemanggil
     menandakannya sebagai 'kadar belum diisi' supaya TC nampak, bukan diam-diam free. */
  function rateAmt(key,region){
    var m=(EX().rates||{})[key];
    if(!m)return null;
    var list=(region&&m[region])||m._default;
    if(!list||!list.length)return null;
    var b=extTier(list,payPax()||1);
    var a=isPeakTrip()?(b.peak!=null?b.peak:b.normal):b.normal;
    return (a==null)?null:a;
  }
  /* Kadar hari extension. Kalau config ada ext.rates.day, ia MENGGANTIKAN ext.day —
     tiada fallback senyap, sebab region tanpa kadar tersiar mesti kelihatan sebagai gap. */
  /* Adakah destinasi ini memang ada kadar ikut kawasan? Destinasi tanpa ProdReq
     (contoh Switzerland) hanya ada `_default`, jadi menyuruh TC "pilih blok supaya
     kadar ikut kawasan" mengelirukan — tiada blok yang akan mengubahnya. */
  function hasRegions(){
    var m=(EX().rates||{}).day;
    if(!m)return false;
    for(var k in m)if(Object.prototype.hasOwnProperty.call(m,k)&&k!=="_default")return true;
    return false;
  }
  function dayRateFor(region){
    var e=EX();
    if(e.rates&&e.rates.day){var a=rateAmt("day",region);return{amt:a||0,gap:!a};}
    var f=extRate(e.day,e.dayTiers);return{amt:f,gap:!f};
  }
  function dayRate(region){return dayRateFor(region).amt;}
  /* Apa yang satu pilihan dropdown tambah (atau tolak) untuk satu hari.
     perPax / perVehicle = nombor literal; perPaxRate / perVehicleRate = kunci ext.rates. */
  function optAmt(o,region){
    var perPax=0,perVeh=0,gap=false;
    /* perVehicleQty: berapa kali kos per-kenderaan itu berlaku dalam SATU hari.
       Contoh pindah bandar perlu 2 transfer (hotel->stesen, stesen->hotel). */
    var vq=(o.perVehicleQty!=null)?o.perVehicleQty:1;
    if(o.perPax!=null)perPax+=o.perPax;
    if(o.perVehicle!=null)perVeh+=o.perVehicle*vq;
    if(o.perPaxRate){var a=rateAmt(o.perPaxRate,region);if(!a)gap=true;perPax+=a||0;}
    if(o.perVehicleRate){var b=rateAmt(o.perVehicleRate,region);if(!b)gap=true;perVeh+=(b||0)*vq;}
    return {unitPax:perPax,unitVeh:perVeh,
            pax:perPax*payPax(),veh:perVeh*vehicles(),gap:gap};
  }
  /* label Inggeris untuk baris quotation; `t` kekal Melayu untuk UI KB */
  function optLine(o){return o.line||o.t;}

  /* Dengan autoNights, malam tambahan dikira di peringkat TRIP (panjang trip vs
     `variants[].nights`), jadi ia tidak berlabuh pada mana-mana hari secara semula
     jadi - baris hari jadi bisu walaupun grand total naik RM300/pax. Peta ini
     menetapkan hari MANA yang menanggung setiap malam tambahan, supaya ia boleh
     diflagkan berasingan daripada kos transport.
     Keutamaan: hari yang TC tambah sendiri (`ext`) dahulu; kalau masih berbaki
     (contoh return date ditarik tanpa hari ditanda ext), ambil dari hari terakhir. */
  function extraNightMap(){
    var autoN=!!EX().autoNights;if(!autoN)return {};
    var base=V().nights||0,selfDrop=0;
    days.forEach(function(x){var ac=find(ACC,x.acc);if(ac.dropsNight)selfDrop++;});
    var over=Math.max(0,Math.max(0,days.length-1-selfDrop)-base);
    var map={},n=0;
    days.forEach(function(x,i){
      if(n>=over)return;
      var ac=find(ACC,x.acc);
      if(x.ext&&ac.cost!=="zero"&&!ac.dropsNight){map[i]=1;n++;}
    });
    for(var i=days.length-1;i>=0&&n<over;i--){
      if(map[i])continue;
      var ac2=find(ACC,days[i].acc);
      if(ac2.cost!=="zero"&&!ac2.dropsNight){map[i]=1;n++;}
    }
    return map;
  }
  function dayParts(d,idx){
    var pay=payPax(),mr=mealRate(),reg=dayRegion(d);
    var pr=find(presets(),d.preset);
    var ml=mealOf(d.meal),tp=find(TRP,d.trp),ac=find(ACC,d.acc),c=0,gap=false;
    /* Setiap tambah/tolak dikumpul sebagai satu entri supaya baris hari boleh
       memaparkannya satu-persatu - TC perlu tahu item mana sudah ditolak, bukan
       sekadar satu jumlah bersih. `scope:"trip"` = amaun itu dikira di peringkat
       keseluruhan trip (bukan hari), jadi ia dipapar sebagai maklumat sahaja dan
       TIDAK ditambah ke dalam kos hari (elak kira dua kali). */
    var adj=[];
    function A(label,amt,scope){if(amt)adj.push({label:label,amt:amt,scope:scope||"day"});}
    /* Malam tambahan yang kadarnya datang dari `nightRate` boleh tiada kadar tersiar
       untuk kawasan/musim itu (contoh NZ: rate sheet hanya ada lajur peak). Itu satu
       gap, bukan malam percuma - tandakannya seperti gap kadar transport. */
    if(ac.cost==="night"){var _nr=accNightRate(ac,reg);c+=_nr*pay;
      A("Malam tambahan "+rm0(_nr)+"/pax",_nr*pay);
      if(ac.nightRate&&!_nr)gap=true;}
    var mfix=(ml.l*mr.lunch+ml.d*mr.dinner)*pay;
    c+=mfix; A("Meal",mfix);
    /* delta meal berbanding blok - inilah yang membuat dropdown meal tidak lagi percuma */
    var mdl=mealDeltaOf(d,pr,pay);
    if(mdl){c+=mdl.total;
      A((mdl.meals>0?"Tambah ":"Tolak ")+Math.abs(mdl.meals)+" meal "+
        sgn(mdl.perPax)+"/pax",mdl.total);}
    if(tp.cost==="day"){var dr=dayRateFor(reg);c+=dr.amt*vehicles();
      A("Transport"+(reg?" "+reg:""),dr.amt*vehicles());if(dr.gap)gap=true;}
    [ac,ml,tp].forEach(function(o){var a=optAmt(o,reg);c+=a.pax+a.veh;
      if(a.pax)A(optLine(o)+" "+sgn(a.pax/(pay||1))+"/pax",a.pax);
      if(a.veh)A(optLine(o),a.veh);
      if(a.gap)gap=true;});
    /* Tolakan malam yang ditanggung di peringkat trip (pilihan dropsNight). Ia TIDAK
       masuk kos hari, tetapi mesti kelihatan pada hari itu - kalau tidak baris hari
       tulis "Termasuk" sedangkan grand total turun. */
    if(ac.dropsNight){
      var ns=rateAmt("nightShort","");
      if(ns)adj.push({label:"Tolak 1 malam pakej "+sgn(ns)+"/pax",amt:ns*pay,scope:"trip"});
    }
    /* Malam tambahan hotel - diflagkan BERASINGAN daripada transport, guna kadar
       sebenar yang terpakai (normal atau peak, ikut tarikh trip). */
    if(idx!=null&&extraNightMap()[idx]){
      var nr=nightRate();
      adj.push({label:"Malam tambahan hotel "+(nr?sgn(nr)+"/pax":"kadar belum diisi"),
                amt:nr*pay,scope:"trip"});
    }
    d.addons.forEach(function(a){var q=ADDONS[a.i];
      if(!a.i)return;
      var at=a.qa*q[1]+a.qc*(q[2]||0);c+=at;A(q[0],at);});
    adj.forEach(function(x){if(x.scope==="trip")c+=x.amt;});
    return {cost:c,gap:gap,region:reg,adj:adj};
  }
  function dayCost(d,idx){return dayParts(d,idx).cost;}

  /* ---------- render baris hari ---------- */
  function dayHtml(d,idx){
    var P=dropdownPresets(),pr=find(presets(),d.preset);
    var nm=d.preset==="cus"?(d.custom||"Custom"):pr.t;
    var ml=mealOf(d.meal),tp=find(TRP,d.trp),ac=find(ACC,d.acc);
    var parts=dayParts(d,idx),cost=parts.cost,reg=parts.region;
    /* Destinasi sebenar hari ini. Nama hari sahaja ("Seoul City") tidak cukup
       untuk TC semak itinerary, jadi senarai ini dipapar terus pada baris hari. */
    var acts=(pr.act&&pr.act.length)?pr.act:[];
    var dt=d.date?dfmt(parseIso(d.date)):"Tiada tarikh";
    /* hint setiap medan: kadar sebenar yang dikenakan untuk hari ini, ikut region */
    function hint(o,base){
      var a=optAmt(o,reg),bits=[];
      if(base)bits.push(base);
      if(a.unitPax)bits.push(sgn(a.unitPax)+" per pax");
      if(a.unitVeh)bits.push(sgn(a.unitVeh)+" per transport");
      if(a.gap)bits.push("kadar belum diisi");
      return bits.length?bits.join(" &middot; "):"Tiada kos tambahan";
    }
    var _dr=dayRateFor(reg);
    var ao=d.addons.map(function(a,ai){
      var q=ADDONS[a.i];
      return "<div class='aorow' data-ai='"+ai+"'>"+
        "<select class='d-ai'>"+addonOpts(a.i)+"</select>"+
        "<input class='qin d-aqa' type='number' min='0' value='"+a.qa+"' title='"+
        (a.auto?"Qty dewasa - diisi sendiri ikut pax, boleh ubah":"Qty dewasa")+"'>"+
        "<input class='qin d-aqc' type='number' min='0' value='"+a.qc+"' title='"+
        (a.auto?"Qty kanak-kanak - diisi sendiri ikut pax, boleh ubah":"Qty kanak-kanak")+"'>"+
        "<span class='aosum'>"+(a.i?rm0(a.qa*q[1]+a.qc*q[2]):"&mdash;")+"</span>"+
        "<button type='button' class='xbtn d-aodel' title='Buang add-on'>&times;</button></div>";
    }).join("");
    return "<details class='dayc'"+(d.open?" open":"")+" data-i='"+idx+"'>"+
      "<summary draggable='true'><span class='dgrip' title='Seret untuk susun semula'>&#10303;</span>"+
      "<span class='dnum"+(d.ext?" dnumx":"")+"'"+

      (pr&&pr.mustPick?"<span class='dchip dwarn' title='Hari ini belum berlabuh pada segmen rate card - pilih satu blok itinerary'>pilih blok</span>":"")+

      "</div>"+
      (acts.length?"<div class='dstops'><span class='fl'>Itinerary hari ini</span>"+
        "<ul class='dlist'>"+acts.map(function(x){return "<li>"+esc2(x)+"</li>";}).join("")+
        "</ul></div>":"")+
