<style>
/* =========================================================================
   ARBA DESTINATION KB — SHARED STYLE (DO NOT EDIT PER DESTINATION)

:root{
  color-scheme: light;
  --ink:#1c1c1c; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --soft:#f7f7f7;
  --green:#c8172b; --green2:#e23744; --greend:#a01223; --greensoft:#fdebed;
  --halal:#0a7d63; --star:#c8172b;
  --sea1:#0e5c53; --sea2:#0a7d63;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.11);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;
  font-size:15px;line-height:1.5}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:12px;text-decoration:none}
.brandmark{display:inline-flex;flex-direction:column;align-items:center;line-height:.85;color:var(--green);font-weight:800}
.brandmark>.big{font-size:24px;letter-spacing:.5px}
.brandmark>.sub{font-size:8px;letter-spacing:5px;font-weight:700;margin-top:3px}
.kbtag{font-size:12.5px;color:var(--muted);font-weight:700;border-left:1px solid var(--line);padding-left:12px}
.miniS{flex:1;max-width:520px;margin-left:auto;position:relative}
.miniS input{width:100%;padding:10px 14px 10px 40px;border:1px solid #d9d9d9;border-radius:999px;font-size:14px;outline:none;background:#fff}
.miniS input:focus{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.miniS .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:22px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--sea1),var(--sea2))}
.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,40,36,.34),rgba(6,40,36,.55))}
.hero .in{position:relative;color:#fff;padding:46px 22px;width:100%;max-width:640px}
.kicker{font-size:11.5px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9;margin-bottom:14px}
.hero h1{margin:0 0 10px;font-size:44px;font-weight:800;letter-spacing:-1.5px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero .lead{font-size:15.5px;opacity:.95;margin:0 auto 24px;max-width:500px;font-weight:400;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.bigsearch{position:relative;background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(0,0,0,.24);display:flex;align-items:center;padding:6px 6px 6px 20px;max-width:560px;margin:0 auto}
.bigsearch .si{color:var(--muted);font-size:18px}
.bigsearch input{flex:1;border:none;outline:none;font-size:16px;padding:14px 12px;background:transparent;color:var(--ink)}
.bigsearch button{border:none;background:var(--green2);color:#fff;font-weight:800;border-radius:999px;padding:13px 24px;font-size:15px;cursor:pointer;transition:.15s}
.bigsearch button:hover{background:var(--greend)}
.topicbar{position:sticky;top:53px;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding:2px 0}
.topicbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:#3d3d3d;padding:13px 15px;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--green)}
.tab.active{color:var(--ink);border-bottom-color:var(--green);font-weight:800}
.infosub{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
button.tcard{font:inherit;text-align:left;width:100%;cursor:pointer}
#attractionview{margin-top:18px}
.backbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);margin:2px 0 14px}
.backbtn:hover{border-color:var(--green);color:var(--green)}
.adhero{position:relative;border-radius:20px 20px 0 0;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--sea1),#1596a8)}
.adhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.62))}
.adtitle{position:relative;padding:24px;color:#fff}
.adtitle h1{margin:9px 0 0;font-size:30px;font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.adbody{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 20px 20px;padding:24px;box-shadow:var(--shadow)}
.adlead{font-size:15.5px;line-height:1.6;margin:0 0 6px}
.adbody h3{font-size:15px;font-weight:800;margin:18px 0 8px}
.adbody ul{margin:6px 0;padding-left:20px}.adbody li{margin:6px 0;font-size:14.5px}
.muslimnote{background:#eaf7f0;border:1px solid #cdeede;color:#2f7a60;border-radius:12px;padding:13px 15px;margin:18px 0 6px;font-size:13.5px;line-height:1.55}
.muslimnote b{color:var(--halal)}
.maplink{display:inline-block;margin-top:12px;font-weight:800;font-size:13.5px;color:var(--green);text-decoration:none}
.maplink:hover{text-decoration:underline}
.incexc{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media(max-width:560px){.incexc{grid-template-columns:1fr}}
.incbox,.excbox{border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.incbox{background:#f6fbf8;border-color:#cdeede}
.excbox{background:#fbf7f7;border-color:#f0dede}
.incbox h3,.excbox h3{margin:0 0 9px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.incbox h3{color:var(--halal)}.excbox h3{color:#b03030}
.incbox ul,.excbox ul{list-style:none;padding:0;margin:0}
.incbox li,.excbox li{position:relative;padding:6px 0 6px 23px;font-size:13.5px;border-bottom:1px solid rgba(0,0,0,.05);line-height:1.45}
.incbox li:last-child,.excbox li:last-child{border-bottom:none}
.incbox li::before{content:"\2713";position:absolute;left:2px;top:6px;color:var(--halal);font-weight:800}
.excbox li::before{content:"\2715";position:absolute;left:2px;top:6px;color:#b03030;font-weight:800}
.pkgnote{background:#fff7e6;border:1px solid #f0e0b8;color:#7a5b12;border-radius:12px;padding:11px 14px;margin:14px 0 4px;font-size:13px}
.pkgfoot{margin-top:16px;font-size:12.5px;color:var(--muted)}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 4px}
.shead h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.4px}
.ssub{color:var(--muted);font-size:13.5px;margin:2px 0 16px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.tcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.16s}
.tcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.tcard .im{position:relative;height:160px;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center}
.tcard .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tcard .im .emoji{font-size:46px;opacity:.92;z-index:0}
.tcard .chip{position:absolute;left:11px;top:11px;z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.heart{position:absolute;right:10px;top:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  border:none;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);color:#333}
.heart.on{color:#e0245e}
.tcard .body{padding:13px 14px 15px}
.tcard .body b{font-size:15.5px;font-weight:800;display:block;letter-spacing:-.2px}
.tcard .body p{margin:5px 0 0;font-size:13px;color:var(--muted)}
.tcard .cta{margin-top:11px;display:inline-block;background:#fff;border:1.5px solid var(--ink);color:var(--ink);
  font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;transition:.14s}
.tcard:hover .cta{background:var(--ink);color:#fff}
section.block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
section.block>h2{margin:0 0 12px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
section.block .subtitle{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 12px}
.status{font-size:12.5px;color:var(--muted);margin:12px 0;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#c9ced9;display:inline-block}
.dot.live{background:var(--halal)}.dot.loading{background:#eab308;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
ul.klist{list-style:none;padding:0;margin:8px 0}
ul.klist li{position:relative;padding:8px 0 8px 24px;border-bottom:1px solid var(--soft);font-size:14px}
ul.klist li:last-child{border-bottom:none}
ul.klist li:before{content:"\2713";position:absolute;left:2px;top:7px;color:var(--green);font-weight:800}
table.kb{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
table.kb th{background:var(--greensoft);color:var(--greend);text-align:left;padding:9px 10px;font-weight:800;border:1px solid #f0cdd1}
table.kb td{padding:8px 10px;border:1px solid var(--line);vertical-align:top}
table.kb tr:nth-child(even) td{background:#fafafa}
details.qa{border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff;overflow:hidden}
details.qa[open]{border-color:var(--green);box-shadow:0 2px 12px rgba(200,23,43,.1)}
details.qa summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;font-size:14.5px;display:flex;gap:11px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary .tw{color:var(--green);transition:.15s;flex:0 0 auto;margin-top:1px;font-size:12px}
details.qa[open] summary .tw{transform:rotate(90deg)}
.ans{padding:2px 16px 15px 42px;font-size:14px;color:#333}
.ans p{margin:6px 0}.ans strong{color:var(--ink)}
.ans ul,.ans ol{margin:6px 0;padding-left:20px}.ans li{margin:3px 0}
mark{background:#fff3ba;padding:0 2px;border-radius:3px}
.badge-halal{display:inline-block;background:#eaf7f0;color:var(--halal);border:1px solid #c7ebda;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.noresult{text-align:center;color:var(--muted);padding:30px;display:none}
footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.hidden{display:none!important}
@media(max-width:560px){.hero h1{font-size:26px}.miniS{display:none}.shead h2{font-size:19px}}
.mkt{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:6px 0 22px}
.mkt .mkth{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.mkt .mkth b{font-size:15px;font-weight:700}
.mkt .mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:760px){.mkt .mgrid{grid-template-columns:1fr}}
.mkt h5{margin:0 0 7px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.usp{background:#eaf7f0;border:1px solid #c7ebda;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--halal);margin-top:10px}
.season{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:2px}
.season td{border:1px solid var(--line);padding:5px 9px}
.season td:first-child{font-weight:700;white-space:nowrap;background:#fff}
.expect{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.expect li{margin:3px 0}
.itin{margin:22px 0 4px}
.itin h3{font-size:15px;margin:0 0 12px}
.itday{display:flex;gap:14px;padding:0 0 14px;position:relative}
.itday:not(:last-child)::before{content:"";position:absolute;left:26px;top:30px;bottom:0;width:2px;background:var(--line)}
.itd{flex:0 0 54px;height:54px;border-radius:12px;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;z-index:1}
.itd small{font-size:9px;font-weight:600;opacity:.85;letter-spacing:1px}
.itd b{font-size:19px}
.itc{flex:1;padding-top:3px}
.itc .itt{font-weight:700;font-size:13.5px;margin:0 0 4px}
.itc ul{margin:0;padding-left:17px}
.itc li{font-size:12.8px;margin:2px 0;color:#333}
.custblk{margin:0 0 20px}
.custblk h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.ctbl{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ctbl th{background:var(--soft);text-align:left;padding:8px 10px;font-weight:700;font-size:11.5px;letter-spacing:.3px;border-bottom:1px solid var(--line)}
.ctbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ctbl tr:last-child td{border-bottom:none}
.ctbl .add{color:var(--greend);font-weight:700;white-space:nowrap}
.ctbl .ded{color:var(--halal);font-weight:700;white-space:nowrap}
.ctbl .it{font-weight:600}
.custnote{font-size:11.5px;color:var(--muted);margin:6px 2px 0;font-style:italic}
@media(max-width:640px){.ctbl{font-size:11.5px}.ctbl th,.ctbl td{padding:6px 7px}}
.rtag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;vertical-align:middle}
.notebox{background:var(--greensoft);border:1px solid #f4c9cf;border-radius:12px;padding:11px 14px;font-size:12.8px;color:#4a2b2f;margin:2px 0 14px}
.notebox b{color:var(--greend)}
.hotels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 8px}
@media(max-width:640px){.hotels{grid-template-columns:1fr}}
.hcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.hcard .ph{height:110px;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
.hcard .hb{padding:9px 12px}
.hcard .tier{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.hcard .hn{font-size:13.5px;font-weight:700;margin:2px 0 0}
.hcard .hnote{font-size:12px;color:var(--muted);margin-top:2px}
.actcity{font-size:14px;margin:14px 0 8px;padding-bottom:3px;border-bottom:2px solid var(--green);display:inline-block}
.actgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
@media(max-width:720px){.actgrid{grid-template-columns:repeat(2,1fr)}}
.actcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.actim{aspect-ratio:4/3;background:linear-gradient(135deg,var(--sea1),#1596a8);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.actim img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.actname{padding:7px 9px;font-size:12.5px;font-weight:600}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 4px}
.cmp th{background:var(--green);color:#fff;padding:11px 8px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.5px;border:2px solid #fff}
.cmp th.blank{background:transparent;border:none}
.cmp td{border:2px solid #fff;padding:9px 12px;vertical-align:middle}
.cmp td.feat{background:#f3d97a;color:#5a4a12;font-weight:700;font-size:12.5px;width:52%}
.cmp td.val{background:#fbf6e6;text-align:center;font-weight:800;color:#3d3d3d}
.cmp .tick{color:#1a8a3c;font-size:17px;font-weight:900}
.cmp .no{color:#c4c4c4;font-weight:800}
/* ---- Simple Calculator ---- */
.calcblk{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 15px 15px}
.calcblk h3{margin:0 0 10px;font-size:13.5px;color:var(--greend);text-transform:uppercase;letter-spacing:.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.cgrid2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.fld .fl{font-weight:600}
.fld .fh{font-size:11px;color:var(--muted)}
.calcblk input[type=text],.calcblk input[type=number],.calcblk input[type=date],
.calcblk textarea,.calcblk select{
  font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);width:100%}
.calcblk select{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:28px}
.calcblk textarea{resize:vertical}
.calcblk input:focus,.calcblk textarea:focus,.calcblk select:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.cbx{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;font-size:12.5px;cursor:pointer}
.cbx input{margin-top:2px;accent-color:var(--green);width:15px;height:15px;flex:0 0 auto}
.calctbl input.qin{width:74px;padding:5px 6px;font-size:12.5px;text-align:right}
.calctbl input.tin{width:100%;padding:5px 6px;font-size:12.5px}
.calctbl td{vertical-align:middle}
.tr-sum,.cu-sum{font-weight:700;white-space:nowrap}
.calcnote{font-size:11.5px;color:var(--muted);margin:8px 2px 10px}

/* ---- panel boleh-buka (Quick mode) ---- */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 9px;overflow:hidden}
.panel>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;cursor:pointer;
  list-style:none;font-size:13px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .tw{color:var(--green);font-size:10px;transition:transform .15s}
.panel[open]>summary .tw{transform:rotate(90deg)}
.panel>summary .pt{font-weight:700}
.panel>summary .psum{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.panel[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.pbody{padding:13px}
.calcblk .panel{margin-bottom:0}

/* ---- bar ringkasan itinerary ---- */
.dbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--greensoft);border:1px solid var(--line);border-radius:11px;
  padding:8px 12px;font-size:12.5px;margin-bottom:10px}

/* ---- kad hari ---- */
.dayc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.dayc>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;cursor:pointer;
  list-style:none;font-size:12.5px}
.dayc>summary::-webkit-details-marker{display:none}
.dayc[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.dayc.dragging{opacity:.45}
.dayc.dropto{outline:2px dashed var(--green2);outline-offset:-2px}
.dgrip{flex:0 0 auto;color:var(--muted);font-size:14px;cursor:grab;line-height:1;user-select:none}
.dgrip:active{cursor:grabbing}
.dayc>summary{user-select:none}
.dnum{flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:var(--green);color:#fff;
  font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.ddate{flex:0 0 auto;color:var(--muted);font-size:11.5px;min-width:78px}
.dname{flex:1 1 170px;font-weight:700}
.dchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dchip{font-size:10.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;
  padding:2px 8px;color:var(--muted);white-space:nowrap}
.dayc[open]>summary .dchip{background:#fff}
.dchip.dcost{font-weight:700}
.dchip.dcost.on{background:var(--greensoft);border-color:var(--green2);color:var(--greend)}
.dacts{display:flex;gap:4px;flex:0 0 auto}
.xbtn{font:inherit;font-size:13px;line-height:1;width:24px;height:24px;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.xbtn:hover{background:var(--greensoft);color:var(--greend);border-color:var(--green2)}
.dbody{padding:11px}
.aowrap{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.aowrap>.fl{display:block;font-weight:600;margin-bottom:6px}
.aorow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.aorow select{flex:1 1 210px;width:auto}
.aorow input.qin{width:78px}
.aosum{font-weight:700;min-width:76px;text-align:right;font-size:12px;white-space:nowrap}

.ctot{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.ctot>div{flex:1 1 190px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ctl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ctv{display:block;font-size:19px;font-weight:800;color:var(--greend);margin-top:2px}
.cbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.cbtn{font:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;border:none;
  background:var(--green);color:#fff;cursor:pointer}
.cbtn:hover{background:var(--green2)}
.cbtn2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.cbtn2:hover{background:var(--soft)}
.cbtn3{background:#fff;color:var(--greend);border:1px solid var(--line);font-size:12px;padding:6px 13px}
.cbtn3:hover{background:var(--greensoft)}
@media(max-width:640px){
  .calctbl input.qin{width:58px}
  .ddate{display:none}
  .aorow input.qin{width:64px}
}

/* ---- pemilih varian pakej (destinasi berbilang pakej) ---- */
.pkgsel{margin-bottom:12px}
.pkgsel .fl{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
.pkgsel select{font:inherit;font-size:13.5px;font-weight:600;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);width:100%;cursor:pointer}
.pkgsel select:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.dayc .dchips .dchip.dreg{color:var(--ink);font-weight:700;letter-spacing:.3px}
.dayc .dchips .dchip.dwarn{background:#fdecec;color:#b3261e;border-color:#f3c9c6;font-weight:700}
.dayc .dchips .dchip.dcost.dded{background:#eef3fb;border-color:#c9d8ef;color:#1a4d8f}
.dayc .dnum.dnumx{background:#eef3fb;color:#1a4d8f;box-shadow:inset 0 0 0 1.5px #9dbbe4}
.calcblk .calcwarn,.block[data-topic="calc"]>.calcwarn{margin:10px 0 0;padding:9px 12px;border-radius:10px;
  background:#fdecec;border:1px solid #f3c9c6;color:#b3261e;font-size:12.5px;line-height:1.45}
.dname{flex:1 1 210px;min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:400}
.dnm{font-weight:700}
.dprev{font-size:11.5px;color:var(--muted);line-height:1.35;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dstops{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.dstops>.fl{display:block;font-weight:600;margin-bottom:6px}
.dlist{margin:0;padding-left:17px}
.dlist li{margin-bottom:3px}
.calcblk .calcincl{margin:9px 0 0;padding:8px 11px;border-radius:9px;background:var(--soft);
  border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.45}
.warnred{color:#b3261e}


/* ---- breakdown harga per pax (bawah jadual ringkasan) ---- */
.calcbrk{width:100%;border-collapse:collapse;margin:.35rem 0 .5rem}
.calcbrk td{padding:.28rem .5rem;border-bottom:1px solid var(--line,#e5e7eb);font-size:.86rem}
.calcbrk td.add{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.calcbrk td.add.dded{color:#b3261e}
.calcbrk tr.brkt td{border-top:2px solid var(--line,#e5e7eb);border-bottom:none;
  background:var(--soft,#f8fafc)}
.brkh{margin:.6rem 0 .1rem;font-size:.9rem}
.brkn{margin:.15rem 0 0;font-size:.78rem;color:var(--muted,#64748b);line-height:1.45}
.calcbrk tr.brks td{border-top:1px solid var(--line);color:var(--muted)}
.calcbrk tr.brks td.add{color:var(--ink)}

/* ---- cip flag tambah/tolak pada baris hari ---- */
.dchip.dadj{background:var(--soft,#f1f5f9);border:1px solid var(--line,#e2e8f0);
  font-size:.72rem;font-weight:600}
.dchip.dadj.dded{color:#b3261e;border-color:#f3c9c4}
.dchip.dadj.dtrip{border-style:dashed;opacity:.9}

</style>
</head>

k tentang taktik perang gerila — sebahagian terowong boleh dimasuki (sempit).","hi":["Terowong bawah tanah bersejarah","Paparan taktik perang gerila","Pengalaman mendidik untuk keluarga"],"best":"Pagi — elak panas & sesak (banyak berjalan).","muslim":"Masjid Jamia Al Muslimin dilawati pada hari yang sama (pakej 4D3N) — boleh solat. Makan halal diatur guide.","map":"https://www.google.com/maps/search/?api=1&query=Cu+Chi+Tunnels+Ho+Chi+Minh"},{"n":"Masjid Jamia Al Muslimin (Saigon Central Mosque)","t":"Ho Chi Minh · Masjid","emoji":"🕌","img":"","short":"Masjid utama District 1 — berjalan kaki dari Ben Thanh.","intro":"Masjid pusat Ho Chi Minh di District 1 (Jalan Dong Khoi), dibina komuniti Muslim India Selatan. Berdekatan Ben Thanh Market & Malaysia Street — memudahkan solat Zohor/Asar semasa shopping. Sesuai disinggahi semasa free & easy di HCM.","hi":["Masjid aktif dengan ruang wanita","Walking distance dari Ben Thanh & Malaysia Street","Kedai makan halal India/Melayu berhampiran"],"best":"Waktu Zohor/Asar semasa tour bandar atau sesi shopping Ben Thanh.","muslim":"Ruang solat lelaki & wanita berasingan, tempat wuduk disediakan. Guide boleh atur berhenti solat di sini semasa tour bandar HCM. Dilawati pada Hari 3 (city tour) dalam pakej ini.","map":"https://www.google.com/maps/search/?api=1&query=Jamia+Al+Muslimin+Mosque+Ho+Chi+Minh"},{"n":"War Remnants Museum","t":"Ho Chi Minh · Sejarah","emoji":"🏛️","img":"","short":"Muzium Perang Vietnam","intro":"Muzium paling dikunjungi di Ho Chi Minh — pameran gambar, kenderaan tentera & artifak Perang Vietnam. Beberapa galeri ada gambar yang agak grafik.","hi":["Kereta kebal, jet & helikopter di halaman luar","Galeri foto sejarah perang","±1–1.5 jam lawatan"],"best":"Pagi atau awal petang (tutup sekejap waktu tengah hari).","muslim":"Tiada surau dalam muzium. Masjid Jamia Al Muslimin (District 1) ±10 minit — guide susun solat sebelum/selepas lawatan.","map":"https://www.google.com/maps/search/?api=1&query=War+Remnants+Museum+ terus shopping borong.</td></tr><tr><td class='it'>HCM &rarr; Mekong Delta (My Tho)</td><td class='add'>&plusmn;2 jam sehala</td><td>Hari 2 &mdash; tur sehari penuh.</td></tr><tr><td class='it'>HCM &rarr; Chu Chi Tunnel</td><td class='add'>&plusmn;1.5&ndash;2 jam sehala</td><td>Hari 3 pagi, kemudian city tour.</td></tr></tbody></table></div><details class='qa' data-text='nota operasi transport &amp; guide toilet break disediakan sepanjang perjalanan — guide akan pilih stop dengan tandas &amp; ruang solat jika ada. guide adalah orang tempatan vietnam, muslim , boleh bertutur melayu — terlatih uruskan makanan halal &amp; waktu solat. guide biasanya lelaki ; guide perempuan tidak dijamin. guide berpengalaman bawa group lelaki &amp; perempuan. tipping sudah termasuk dalam pakej — customer tidak perlu bayar tambahan kepada guide/driver. port charger dalam kenderaan tidak dijamin — sarankan customer bawa power bank (hand carry, ≤100wh). aktiviti bayar terus kepada guide — sediakan cash vnd.'><summary><span class='tw'>&#9654;</span><span>Nota operasi transport &amp; guide</span></summary><div class='ans'><ul><li>Toilet break disediakan sepanjang perjalanan &mdash; guide akan pilih stop dengan tandas &amp; ruang solat jika ada.</li><li>Guide adalah <strong>orang tempatan Vietnam, Muslim</strong>, boleh bertutur Melayu &mdash; terlatih uruskan makanan halal &amp; waktu solat.</li><li>Guide biasanya <strong>lelaki</strong>; guide perempuan tidak dijamin. Guide berpengalaman bawa group lelaki &amp; perempuan.</li><li><strong>Tipping sudah termasuk</strong> dalam pakej &mdash; customer tidak perlu bayar tambahan kepada guide/driver.</li><li>Port charger dalam kenderaan tidak dijamin &mdash; sarankan customer bawa power bank (hand carry, &le;100Wh).</li><li>Aktiviti bayar terus kepada guide &mdash; sediakan cash VND.</li></ul></div></details>","stay":"<h2>Accommodation</h2><p class='ssub'>Hotel 3&#9733; (default) diutamakan dekat pusat bandar; jika tidak tersedia, lokasi mungkin ong> biasanya perlu request di kaunter.</li><li><strong>Sabun &amp; syampu</strong> disediakan di semua hotel.</li><li><strong>Laundry:</strong> ada servis hotel (berbayar), <strong>tiada self-service laundry</strong> &mdash; sarankan customer bawa baju secukupnya.</li><li><strong>Breakfast</strong> di hotel; lunch &amp; dinner di restoran halal luar.</li><li>Upgrade hanya <strong>jenis bilik/hotel</strong>, tertakluk availability.</li></ul></div></details>","freegift":"<h2>Free Gift (Promo)</h2><details class='qa' open data-text='free gift untuk campaign atau promo? pt hcm 4d3n: tiada kod free gift dalam freegift campaign. bullet: brb luggage tag / pocket wifi 4g (per booking) *bullet wajib tanya po/leader promo operator (ibrahim): group 16 pax dewasa foc 1 pax (15+1). disclaimer: promo operator bersyarat. sila sahkan dengan po.'><summary><span class='tw'>&#9654;</span><span>Free Gift untuk campaign atau Promo?</span></summary><div class='ans'><p><strong>PT HCM 4D3N:</strong> tiada kod free gift dalam FreeGift campaign &mdash; sahkan dengan PO.</p><p><strong>Bullet:</strong> BRB Luggage Tag / Pocket Wifi 4G <em>(per booking)</em></p><p style='color:var(--greend)'>*Bullet wajib tanya PO/Leader</p><p><strong>Promo operator (Ibrahim):</strong> 16 pax dewasa = 1 FOC (15 + 1).</p><p><strong>Disclaimer:</strong> <span style='color:var(--greend)'>Promo operator bersyarat. Sila sahkan dengan PO.</span></p></div></details>","flight":"<h2>Flight &amp; Airport</h2><p class='ssub'>Cadangan <b>return flight (pergi-balik)</b> KUL &#8596; <b>Tan Son Nhat (SGN)</b>, Ho Chi Minh. Tiket <b>tidak termasuk</b> dalam pakej &mdash; customer beli sendiri (bagasi, in-flight meal &amp; airport tax juga excluded). Harga anggaran adalah <b>round-trip</b> per pax.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Airline</th><th>Pergi</th><th>KUL &rarr; SGN</th><th>Balik</th><th>SGN &rarr; KUL</th><th>Jenis</th><th>Anggaran return (RM)</th></tr></thead><tbody><tr><td class='it'>AirAsia</td><td>AK 520</td><td>07:05 &ndash; 08:05</td><td>AK 521</td><td>08:35 &ndash; 11:35</td><td>Low Cost</td><td class='add'>RM 580 &ndash; 900</td></tr><tr><td class='it'>VietJet Air</td><td>VJ 826</td><td>13:35 &ndash; 14:20</td><td>VJ 825</td><td>09:30 &ndash; 12:35</td><td>Low Cost</td><td class='add'>RM 500 &ndash; 800</td></tr><tr><td class='it'>Malaysia Airlines</td><td>MH 750</td><td>09:00 &ndash; 10:00</td><td>MH 751</td><td>11:00 &ndash; 13:55</td><td>Full Service</td><td class='add'>RM 1,100 &ndash; 1,500</td></tr><tr><td class='it'>Malaysia Airlines</td><td>MH 758</td><td>14:30 &ndash; 15:40</td><td>MH 759</td><td>16:40 &ndash; 19:14</td><td>Full Service</td><td class='add'>RM 1,100 &ndash; 1,500</td></tr></tbody></table><p class='custnote'>Durasi &plusmn;2 jam sehala. Waktu pergi dari Flight Recommendation (ARBA); waktu balik dari jadual penerbangan awam airline. Semua leg beroperasi harian.</p></div><div class='custblk'><h3>Waktu flight yang disyorkan katalog</h3><table class='ctbl'><thead><tr><th>Leg</th><th>Syor katalog</th><th>Sebab</th></tr></thead><tbody><tr><td class='it'>Ketibaan Day 1</td><td class='add'>12:00 tengah hari atau lebih awal</td><td>Hari 1 terus Wholesale Shopping Tour selepas ketibaan. Tiba lewat = masa shopping berkurang.</td></tr><tr><td class='it'>Berlepas hari akhir</td><td class='add'>2:00 petang atau lewat</td><td>Ikut katalog (<i>Suggested Departure Time: 2pm onwards</i>) &mdash; pagi shopping Ben Thanh, kemudian transfer ke SGN.</td></tr></tbody></table><p class='custnote'>Padanan terbaik dengan syor katalog: pergi <b>AK 520</b> (tiba 08:05) atau <b>MH 750</b> (tiba 10:00); balik <b>MH 759</b> (16:40). AK 521 / MH 751 / VJ 825 berlepas pagi &mdash; terlalu awal untuk Hari 4 (katalog: 2pm onwards), customer akan terlepas shopping Ben Thanh. VJ 826 tiba 14:20 &mdash; lewat untuk shopping tour Hari 1.</p></div><details class='qa' data-text='bagasi, powerbank &amp; hand carry airasia: check-in 20kg — maksimum 2 luggage/pax , satu beg tidak melebihi 30kg. hand carry 7kg. share allowance: boleh dikongsi dengan ahli keluarga (cth 3 pax × 20kg = 60kg). tiada limit kuantiti beg jika combine, tetapi setiap beg ≤30kg. powerbank &amp; semua bateri: wajib hand carry, tidak boleh dalam check-in. had 100wh (±20,000mah). cecair &gt;100ml dan barang tajam (gunting, pencukur, pemotong kuku) — mesti check-in. hand carry: 1 handbag/sling + 1 cabin luggage. backpack besar dikira sebagai luggage. infant &lt;2 tahun: tiada baggage allowance; stroller foc (tag di kaunter, boleh bawa ke pintu pesawat). barang bayi dikira dalam 7kg penjaga. katalog: bawa maksimum 1 luggage per pax — kapasiti kenderaan private terhad, terutama mpv untuk 2–4 pax. wrap bag: tidak wajib — disyorkan untuk luggage keras.'><summary><span class='tw'>&#9654;</span><span>Bagasi, powerbank &amp; hand carry</span></summary><div class='ans'><ul><li><strong>AirAsia:</strong> check-in 20kg &mdash; maksimum <strong>2 luggage/pax</strong>, satu beg tidak melebihi 30kg. Hand carry 7kg.</li><li><strong>Share allowance:</strong> boleh dikongsi dengan ahli keluarga (cth 3 pax &times; 20kg = 60kg). Tiada limit kuantiti beg jika combine, tetapi setiap beg &le;30kg.</li><li><strong>Powerbank &amp; semua bateri:</strong> WAJIB hand carry, tidak boleh dalam check-in. Had 100Wh (&plusmn;20,000mAh).</li><li><strong>Cecair &gt;100ml</strong> dan barang tajam (gunting, pencukur, pemotong kuku) &mdash; mesti check-in.</li><li><strong>Hand carry:</strong> 1 handbag/sling + 1 cabin luggage. Backpack besar dikira sebagai luggage.</li><li><strong>Infant &lt;2 tahun:</strong> tiada baggage allowance; stroller FOC (tag di kaunter, boleh bawa ke pintu pesawat). Barang bayi dikira dalam 7kg penjaga.</li><li><strong>Katalog:</strong> bawa <strong>maksimum 1 luggage per pax</strong> &mdash; kapasiti kenderaan private terhad, terutama MPV untuk 2&#8211;4 pax.</li><li><strong>Wrap bag:</strong> tidak wajib &mdash; disyorkan untuk luggage keras.</li></ul></div></details><details class='qa' data-text='arrival card, seat &amp; dokumen arrival card: vietnam tiada arrival card — tidak perlu isi apa-apa borang online sebelum berlepas. seat: untuk pt, customer beli tiket sendiri — seat selection diuruskan sendiri melalui airline. sarankan pilih seat awal jika mahu duduk bersama keluarga, terutama yang ada anak kecil atau warga emas. (susunan seat oleh airport conductor / tl hanya terpakai untuk group booking jt.) dokumen: tour voucher (softcopy memadai, 1 per family) + covernote insurance. bawa printed jika risau tiada internet. bawah 18 tahun: passport sahaja cukup jika bersama parents; photocopy surat beranak sebagai standby. tiba klia/klia2 3 jam sebelum berlepas (lebih awal pada musim puncak).'><summary><span class='tw'>&#9654;</span><span>Arrival card, seat &amp; dokumen</span></summary><div class='ans'><ul><li><strong>Arrival card:</strong> <strong>Vietnam tiada arrival card</strong> &mdash; tidak perlu isi apa-apa borang online sebelum berlepas.</li><li><strong>Seat:</strong> untuk PT, customer beli tiket sendiri &mdash; seat selection diuruskan sendiri melalui airline. Sarankan pilih seat awal jika mahu duduk bersama keluarga, terutama yang ada anak kecil atau warga emas. (Susunan seat oleh Airport Conductor / TL hanya terpakai untuk group booking JT.)</li><li><strong>Dokumen:</strong> Tour Voucher (softcopy memadai, 1 per family) + Covernote Insurance. Bawa printed jika risau tiada internet.</li><li><strong>Bawah 18 tahun:</strong> passport sahaja cukup jika bersama parents; photocopy surat beranak sebagai standby.</li><li>Tiba KLIA/KLIA2 <strong>3 jam</strong> sebelum berlepas (lebih awal pada musim puncak).</li></ul></div></details>","food":"<h2>Halal &amp; Makanan</h2><p class='ssub'>Fullboard <b>100% halal</b> &mdash; 3B/3L/3D. Breakfast di hotel; semua lunch &amp; dinner diuruskan guide di restoran Muslim/halal di luar. Tipping sudah termasuk.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Kawasan</th><th>Situasi halal</th><th>Nota untuk TC</th></tr></thead><tbody><tr><td class='it'>Ho Chi Minh</td><td class='add'>Mudah</td><td>Banyak restoran Muslim &amp; halal sekitar District 1 / Malaysia Street berhampiran Ben Thanh.</td></tr><tr><td class='it'>Mekong Delta</td><td>Diatur</td><td>Itinerari termasuk Masjid My Tho &mdash; makan tengah hari halal diatur di sekitar.</td></tr></tbody></table><p class='custnote'>Guide adalah orang tempatan Vietnam, Muslim, boleh bertutur Melayu &mdash; biasa menguruskan makanan halal &amp; waktu solat. Meals tidak boleh direfund jika customer pilih untuk tidak makan.</p></div><details class='qa' data-text='perlu bawa sambal atau pek kembara? tidak perlu. fullboard sudah cukup dan mengenyangkan — 3 kali makan setiap hari, semuanya halal. kalau customer tetap mahu bawa: boleh, tetapi elak daging &amp; buah segar (halangan kastam). letak semua makanan dalam satu beg berlabel jelas.'><summary><span class='tw'>&#9654;</span><span>Perlu bawa sambal atau pek kembara?</span></summary><div class='ans'><p>Tidak perlu. Fullboard sudah cukup dan mengenyangkan &mdash; 3 kali makan setiap hari, semuanya halal.</p><p>Kalau customer tetap mahu bawa: boleh, tetapi <strong>elak daging &amp; buah segar</strong> (halangan kastam). Letak semua makanan dalam satu beg berlabel jelas.</p></div></details><details class='qa' data-text='makanan bayi, ubat &amp; declaration makanan bayi: boleh dibawa dalam cabin — kekalkan dalam pek asal berlabel (jangan buka atau salin pek). air panas untuk bancuh susu boleh diminta dari flight attendant. ubat preskripsi (darah tinggi, kencing manis): bawa bersama surat doktor. surat boleh didapatkan dari mana-mana klinik jika hilang. ubat otc (panadol, selsema) tidak perlu preskripsi dan tidak wajib label. letak semua makanan &amp; ubat dalam satu beg khas berlabel jelas untuk memudahkan pemeriksaan kastam.'><summary><span class='tw'>&#9654;</span><span>Makanan bayi, ubat &amp; declaration</span></summary><div class='ans'><ul><li><strong>Makanan bayi:</strong> boleh dibawa dalam cabin &mdash; kekalkan dalam pek asal berlabel (jangan buka atau salin pek).</li><li><strong>Air panas</strong> untuk bancuh susu boleh diminta dari flight attendant.</li><li><strong>Ubat preskripsi</strong> (darah tinggi, kencing manis): bawa bersama surat doktor. Surat boleh didapatkan dari mana-mana klinik jika hilang.</li><li><strong>Ubat OTC</strong> (panadol, selsema) tidak perlu preskripsi dan tidak wajib label.</li><li>Letak semua makanan &amp; ubat dalam <strong>satu beg khas berlabel jelas</strong> untuk memudahkan pemeriksaan kastam.</li></ul></div></details><details class='qa' data-text='solat &amp; kemudahan hcm: saigon central mosque (district 1) &amp; beberapa masjid lain. itinerari lawat masjid my tho (hari 2) &amp; jamia al muslimin (hari 3). maghrib &amp; isyak biasanya dijamak di hotel; zohor &amp; asar di masjid atau restoran yang ada ruang solat. guide kongsi waktu solat. wajib bawa: telekung, sejadah kecil, botol kecil/spray untuk wudhu — tandas di vietnam biasanya tiada getah paip.'><summary><span class='tw'>&#9654;</span><span>Solat &amp; kemudahan</span></summary><div class='ans'><ul><li><strong>HCM:</strong> Saigon Central Mosque (District 1) &amp; beberapa masjid lain. Itinerari lawat Masjid My Tho (Hari 2) &amp; Jamia Al Muslimin (Hari 3).</li><li>Maghrib &amp; Isyak biasanya <strong>dijamak di hotel</strong>; Zohor &amp; Asar di masjid atau restoran yang ada ruang solat.</li><li>Guide kongsi waktu solat.</li><li><strong>Wajib bawa:</strong> telekung, sejadah kecil, botol kecil/spray untuk wudhu &mdash; tandas di Vietnam biasanya tiada getah paip.</li></ul></div></details>"},"snapshot":"# PT Ho Chi Minh — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*1 pakej: **PT Ho Chi Minh Standard 4D3N** — 3★ fullboard, tipping & driving guide Melayu/English included, ground only. Shopping Tour · Mekong River · Chu Chi Tunnel.*\n\n- **Hotel Upgrade 3★ → 4★:** +RM130/pax/malam (Nesta Hotel / Gem Ben Thanh Hotel atau setara).\n- **Travel Date 2027 (Jan – Feb 2027):** surcaj **+RM120/pax** (ikut katalog).\n- **Blockout (tidak boleh booking):** CNY 2027 **17–18 Feb 2027**.\n- **Wajib check availability** dahulu untuk: Chinese New Year · Raya Aidilfitri & Raya Haji · New Year · Christmas Holiday.\n- Kategori umur (ikut tarikh travel): **Adult** 9 tahun ke atas · **CWB** 6–8 tahun · **CNB** 2–5 tahun · **Infant** bawah 2 tahun (**FOC**).\n- **Tiket flight pergi-balik TIDAK termasuk** — customer beli sendiri. Bagasi, in-flight meal & airport tax juga excluded.\n- **Waktu flight:** ketibaan SGN **12 tengah hari atau lebih awal** Hari 1 & berlepas **2 petang atau lewat** Hari 4.\n- **Single supplement:** quoted upon request (sahkan dengan PO).\n- **Fullboard included** — tiada refund jika tidak dimakan. Aktiviti free tidak boleh ditukar dengan cash/voucher.\n- Itinerari, flight & harga tertakluk perubahan (cuaca, trafik, keselamatan). **Final itinerari & hotel disahkan 14 hari** sebelum trip.\n- **Larangan Vietnam:** vape / e-cigarette **dilarang sepenuhnya** sejak 1 Jan 2025 — jangan bawa masuk.\n- Requirement **muslim-friendly** (halal, masjid/surau, solat) adalah **baseline** setiap pakej.\n- Sila semak validity trip dengan staff sebelum booking connecting domestic flight.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Pakej ini cover apa?**\n**PT Ho Chi Minh Standard 4D3N** — HCM sahaja: Hari 1 shopping borong (baju kurung, tudung, telekung, kasut & beg) + street night market · Hari 2 Mekong Delta sehari penuh (4 pulau, honey bee-farm, coconut candy, pedati kuda, Masjid My Tho, borong Dainy/Sarah) · Hari 3 Chu Chi Tunnel, Masjid Jamia Al Muslimin, War Remnants Museum, Central Post Office, Notre Dame, Opera House, Taka Plaza & Saigon Square · Hari 4 Ben Thanh Market & transfer ke SGN.\n\n**Beza dengan pakej HCM-Dalat-Mui Ne?**\nPakej ini **tiada long drive** ke Dalat (6–8 jam) & Mui Ne — semua dalam HCM & sekitar (Mekong / Chu Chi ±2 jam sehala). Lebih banyak masa shopping, dan **Chu Chi Tunnel + Mekong sudah termasuk**. Kalau customer mahu cuaca sejuk Dalat atau sand dunes, guna KB HCM-Dalat-Mui Ne.\n\n**Chu Chi Tunnel termasuk?**\nYa — Hari 3 pagi, termasuk entrance. Terowong sempit & rendah; yang tak selesa boleh tunggu di atas. Banyak berjalan.\n\n**Sesuai untuk warga emas atau anak kecil?**\nSesuai — tiada long drive panjang. Perjalanan paling jauh ±2 jam sehala (Mekong, Chu Chi). Chu Chi Tunnel banyak berjalan & terowong sempit; masuk terowong adalah pilihan.\n\n**Boleh customize itinerari?**\nBoleh untuk PT — tambah/tolak aktiviti, tukar hotel tier, tambah malam. Rujuk tab **Simple Customisation** untuk kadar add-on. Sahkan availability dengan operator sebelum confirm kepada customer.\n\n**Guide bercakap Melayu?**\nYa. Guide adalah orang tempatan Vietnam, **Muslim**, boleh bertutur Melayu — terlatih uruskan makanan halal & waktu solat. Guide biasanya lelaki; guide perempuan tidak dijamin.\n\n**Boleh pilih tarikh sendiri?**\nUntuk **PT (Private Tour)** ya — customer pilih tarikh sendiri. Untuk **JT (Join Trip)** tarikh sudah ditetapkan; kalau nak tarikh sendiri, cadangkan tukar ke PT.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal disediakan?**\nYa — **fullboard 100% halal**: 3B (International) / 3L / 3D. Breakfast di hotel; lunch & dinner di restoran Muslim/halal yang diatur guide.\n\n**Ada masjid/surau untuk solat?**\nYa. Itinerari lawat **Masjid My Tho** (Hari 2, Mekong) & **Masjid Jamia Al Muslimin / Saigon Central Mosque** (Hari 3, District 1). Banyak masjid & surau kecil sekitar District 1 / Malaysia Street.\n\n**Cadangan makanan untuk kanak-kanak?**\nNasi putih, ayam, ikan, sup sayur dan pho (mi sup Vietnam) mudah didapati di restoran halal. Rasa tidak terlalu pedas.\n\n**Boleh bawa makanan sendiri / sambal / pek kembara?**\nBoleh, tetapi **tidak perlu** — meals sudah cukup dan mengenyangkan. Elak bawa daging & buah segar (halangan kastam). Letak makanan & ubat dalam satu beg berlabel jelas untuk memudahkan pemeriksaan.\n\n**Makanan bayi boleh dibawa?**\nBoleh dalam cabin — kekalkan dalam **pek asal berlabel** (jangan buka atau salin pek). Air panas untuk bancuh susu boleh diminta dari flight attendant di atas flight.\n\n**Solat di mana — masjid atau hotel?**\nMaghrib & Isyak biasanya **dijamak di hotel**. Zohor & Asar di restoran yang ada ruang solat, di surau/masjid jika ada, atau 'on road'. Jika hari itu ada lawatan masjid, solat di masjid. Guide kongsi waktu solat dalam group WhatsApp.\n\n**Perlu bawa apa untuk solat?**\n**Wajib:** telekung, sejadah kecil dan botol kecil/spray untuk wudhu — tandas di Vietnam biasanya **tiada getah paip/bidet**.\n\n### C. Visa & Passport\n\n**Perlu visa ke Vietnam?**\nTidak. Warganegara Malaysia **bebas visa sehingga 30 hari** untuk pelancongan — pakej 4D3N jauh di bawah had ini.\n\n**Syarat passport?**\nPassport mesti sah **sekurang-kurangnya 6 bulan** dari tarikh berlepas. Tanggungjawab customer untuk semak tarikh luput lebih awal.\n\n**Kalau nak tinggal lebih 30 hari?**\nRakyat Malaysia layak mohon **e-Visa sehingga 90 hari** secara berasingan — tetapi untuk pakej ini bebas visa sudah memadai.\n\n**Kanak-kanak bawah 18 tahun perlu dokumen tambahan?**\nJika bersama parents, **passport sahaja cukup**. Boleh sediakan photocopy surat beranak sebagai standby.\n\n### D. Flight & Airport\n\n**Flight apa disyorkan dari KUL (pergi-balik)?**\nKUL → **Tan Son Nhat (SGN)**: AirAsia AK 520 (07:05–08:05) · MAS MH 750 (09:00–10:00) · VietJet VJ 826 (13:35–14:20 — lewat dari syor ketibaan). Balik: pilih flight **2 petang atau lewat** (cth MH 759 16:40). Rujuk tab **Flight & Airport**.\n\n**Waktu flight mana yang sesuai?**\nKetibaan **12 tengah hari atau lebih awal** pada Hari 1 (terus shopping tour borong) dan berlepas **2 petang atau lewat** pada Hari 4 (pagi shopping Ben Thanh).\n\n**Flight termasuk dalam harga?**\nTidak — pakej **ground only**. Flight, bagasi, in-flight meal & airport tax semuanya excluded.\n\n**Berapa lama flight KL ke HCM?**\n±2 jam direct.\n\n**Bagasi macam mana untuk AirAsia?**\nCheck-in **20kg**, maksimum **2 luggage/pax**, satu beg tidak melebihi **30kg**. Hand carry **7kg**.\n\n**Boleh share luggage allowance dengan keluarga?**\nBoleh. Contoh 3 pax × 20kg = 60kg untuk satu keluarga. Jika combine tiada limit kuantiti beg, tetapi total tidak melebihi allowance dan setiap beg ≤30kg. Setiap orang maksimum 2 luggage.\n\n**Apa boleh & tak boleh dalam hand carry?**\nCecair **≤100ml** sahaja, dibungkus dalam plastik yang diikat ketat. Cecair >100ml mesti check-in. Barang tajam (gunting kecil, mata pisau pencukur, pembuka botol, pemotong kuku) mesti check-in. Dibenarkan 1 handbag/sling + 1 cabin luggage — backpack besar dikira sebagai luggage.\n\n**Powerbank & bateri macam mana?**\n**Semua bateri & powerbank WAJIB hand carry** — tidak boleh dalam check-in luggage. Had **100Wh (±20,000mAh)**.\n\n**Barang bayi & stroller dikira sebagai bagasi?**\nInfant bawah 2 tahun **tiada baggage allowance**; **stroller FOC** (inform kaunter, dapat tag, boleh bawa hingga pintu pesawat). Beg susu/pampers/wet tissue dikira dalam 7kg hand carry penjaga.\n\n**Perlu isi arrival card?**\n**Tidak — Vietnam tiada arrival card.** Tiada borang online yang perlu diisi sebelum berlepas.\n\n**Boleh pilih seat dalam flight?**\nTiket group booking — seat ditetapkan **random** oleh airline. Airport Conductor / Tour Leader akan susun supaya keluarga duduk berdekatan, keutamaan kepada keluarga dengan anak kecil & warga emas.\n\n**Dokumen apa perlu disediakan?**\n**Tour Voucher** (softcopy memadai, 1 per family) + **Covernote Insurance**. Bawa printed jika risau tiada internet. Tiba KLIA/KLIA2 **3 jam** sebelum berlepas (lebih awal pada musim puncak).\n\n**Perlu wrap bag?**\nTidak wajib — disyorkan untuk luggage keras.\n\n**Kalau flight delay dan terlepas itinerari?**\nMaklum ARBA secepat mungkin — guide akan adjust itinerari. Aktiviti yang terlepas mungkin tidak dapat diganti dan tiada refund.\n\n### E. Hotel & Bilik\n\n**Hotel di area mana?**\n3★: Nicecy Boutique Hotel / Queen Central Hotel atau setara — kawasan tengah bandar (District 1), walking distance ke Malaysia Street / Ben Thanh Market.\n\n**Boleh upgrade hotel?**\nBoleh — 4★ (Nesta Hotel / Gem Ben Thanh Hotel atau setara) **+RM130/pax/malam**. Tertakluk availability.\n\n**Customer nak book hotel sendiri — apa yang perlu diingatkan?**\nBoleh, tetapi **wajib** dalam District 1, sekitar Malaysia Street / Ben Thanh — pickup & itinerari dikira dari lokasi hotel rasmi. Maklumkan nama & alamat penuh hotel kepada consultant sebelum booking.\n\n**Bilik untuk berapa orang?**\n2–3 orang sebilik (twin/triple). Triple = tambah katil sahaja. Saiz bilik selesa & agak luas. Single supplement dikenakan untuk bilik seorang.\n\n**Boleh minta connecting/family room?**\n**Connecting room tidak tersedia.** Untuk satu keluarga, arrangement bilik berdekatan akan diusahakan — tertakluk availability pada hari itu.\n\n**Towel, sterika, sabun & syampu ada?**\nTowel dalam bilik; **sterika perlu request di kaunter**. Sabun & syampu disediakan di semua hotel.\n\n**Ada laundry?**\nAda servis laundry hotel (berbayar) tetapi **tiada self-service** — sarankan customer bawa baju secukupnya.\n\n**Bila hotel disahkan?**\nFinal itinerari & susunan hotel disahkan **14 hari** sebelum trip.\n\n### F. Cuaca & Musim\n\n**Cuaca HCM macam mana?**\nPanas **28–33°C** sepanjang tahun, hampir sama seperti Malaysia. Musim hujan May–Okt (hujan lebat petang). Pakaian ringan, topi, sunscreen & payung.\n\n**Bila musim terbaik?**\n**Nov–Apr (musim kering)** paling sesuai. Elak **May–Oct (musim hujan)** — hujan lebat Ogos–Sept, risiko banjir kawasan Mekong.\n\n**Ada tarikh perayaan yang banyak kedai tutup?**\nSemasa **CNY** banyak kedai tutup, tetapi tempat pelancongan dibuka seperti biasa. CNY juga blockout untuk booking. Musim ramai: cuti sekolah Malaysia.\n\n### G. Shopping & Duit\n\n**Aktiviti optional bayar macam mana?**\nCyclo Tour (RM97/pax) & Saigon River Cruise (RM107/pax) boleh ditempah awal melalui consultant — rujuk tab **Simple Customisation**.\n\n**Beli apa di sana?**\nBaju kurung, tudung, telekung, baju borong, kasut, beg tangan & beg (wholesale HCM), kain (Dainy/Sarah, Saigon Square / Ben Thanh), buah tangan, fridge magnet, keychain & coklat. **'Malaysia Street'** berhampiran Ben Thanh khusus jual barang Muslim.\n\n**Boleh shopping sendiri?**\nBoleh di HCM — hotel yang di-book biasanya dekat dengan Malaysia Street & Ben Thanh Market. Guide juga akan tunjuk tempat souvenir murah.\n\n**Boleh tempah baju/blazer siap dalam sehari?**\nBoleh — ada beberapa kedai tailor di HCM yang menyediakan khidmat express. Customer berurusan sendiri dengan kedai; boleh tanya guide untuk lokasi.\n\n**Mata wang & bawa duit berapa?**\n**Vietnam Dong (VND)**. Cadangan duit poket **RM1,500–RM3,000/orang** (ikut sebanyak mana nak shopping; RM1,000–2,000 sudah cukup untuk yang sederhana). Tukar di Malaysia lebih senang.\n\n**Boleh guna kad atau e-wallet?**\nBoleh di sesetengah tempat (kad debit/kredit, BigPay/Wise) — aktifkan overseas transaction sebelum berlepas. Tetapi **sedia cash VND** kerana banyak tempat, terutama pasar & aktiviti optional, cash sahaja.\n\n### H. Payment & Refund\n\n**Ada surcharge apa yang perlu diberitahu awal?**\nLate booking <45 hari **+RM50/booking** · Last minute <3 minggu **+RM300/pax (2 pax)** atau **+RM200/pax (3+ pax)** · Travel date Jan–Feb 2027 **+RM120/pax** · Blockout CNY 17–18 Feb 2027 · Single supplement (quoted upon request) · Upgrade 4★ +RM130/pax/malam. Rujuk tab **Surcharge**.\n\n### I. Add-ons & Customization\n\n**Apa boleh tambah?**\nCyclo Tour HCM RM97/pax · Saigon River Cruise RM107/pax · extra meal RM30/pax · transport hari tambahan · pocket wifi RM80 · takaful · luggage tracker. Rujuk tab **Simple Customisation**.\n\n**Pocket wifi macam mana?**\nRoamingMan 3GB/hari — RM80 per trip (4D3N). Satu unit boleh share beberapa telefon. Alternatif: SIM local Viettel/Mobifone.\n\n**Boleh tambah malam atau tukar hotel tier?**\nBoleh untuk PT — upgrade 4★ +RM130/pax/malam; malam tambahan 3★ ikut Rate Card Operasi (RM120/pax/malam). Guna Simple Calculator.\n\n**Ada insurans/takaful?**\nYa — Etiqa **TripCare 360** (Individual 1–5 hari RM45 · Couple RM79 · Family RM100, Area 1 ASEAN). **Sangat disyorkan** kerana insurans tidak termasuk dalam pakej.\n\n**Ada luggage tracker?**\nBlue Ribbon Luggage Tracker RM20–70 (Silver RM20 · Gold RM40 · Platinum RM55 · Diamond RM70).\n\n### J. Kesihatan & Keselamatan\n\n**Selamat ke Vietnam?**\nSelamat secara umum. Jaga barang peribadi terutama di kawasan sesak & pasar (Ben Thanh) — risiko seluk saku & snatch. Simpan passport di hotel safe; bawa salinan sahaja.\n\n**Larangan penting yang mesti diberitahu customer?**\nSejak **1 Januari 2025 Vietnam melarang vape / e-cigarette sepenuhnya**. **JANGAN bawa masuk** — risiko ditahan di lapangan terbang & saman tinggi. Ini antara soalan paling kritikal untuk disebut awal.\n\n**Boleh bawa ubat preskripsi?**\nBoleh — bawa bersama **surat doktor** (cth ubat darah tinggi, kencing manis). Surat boleh didapati dari mana-mana klinik jika yang asal hilang. Ubat OTC (panadol, selsema) tidak perlu preskripsi atau label.\n\n**Mesin nebuliser portable boleh dibawa?**\nBoleh dibawa on board; sertakan surat doktor jika ada.\n\n### K. Praktikal (SIM/Socket/Toilet)\n\n**Internet & SIM?**\nRoamingMan pocket wifi atau SIM local (Viettel/Mobifone). **WhatsApp, Google, Facebook & Instagram semua boleh guna** — tiada sekatan seperti di China, jadi tidak perlu VPN.\n\n**Soket plug jenis apa?**\nSoket **2-pin**. Bawa universal travel adaptor & extension plug jika banyak alatan elektrik.\n\n**Tandas macam mana?**\nKebanyakan tandas **tiada getah paip/bidet** — bawa botol kecil untuk kegunaan sendiri & wudhu. Tandas di tempat persinggahan kualiti berbeza-beza.\n\n**Ada port charger dalam kenderaan?**\nTidak dijamin — sarankan customer bawa power bank (hand carry, ≤100Wh).\n\n**Waktu tempatan sama dengan Malaysia?**\nVietnam **1 jam ke belakang** dari Malaysia (GMT+7). Ambil kira untuk waktu solat & jadual flight.\n\n### L. Packing\n\n**Kasut apa sesuai?**\nKasut sport/selesa — banyak berjalan di Chu Chi Tunnel, Mekong & pasar.\n\n**Apa yang selalu customer terlupa?**\nBotol kecil untuk wudhu, adaptor 2-pin, beg kosong/foldable untuk barang shopping, dan payung (musim hujan).\n\n**Apa nak bawa?**\nPassport (sah 6 bulan+), pakaian ikut aktiviti & bilangan hari, pakaian ibadah (telekung/sejadah), peralatan mandi, peralatan solek, universal adaptor, powerbank, duit poket RM1,500–3,000, sepasang kasut selesa, dan ubat peribadi jika ada keperluan harian.\n"}</script>

      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"itin",t:"Itinerary & Aktiviti"},{id:"compare",t:"Perbezaan Pakej"},{id:"map",t:"Travel Map"},{id:"pricing",t:"Harga & Pakej"},
 {id:"custom",t:"Simple Customisation"},
 {id:"calc",t:"Simple Calculator"},{id:"surcharge",t:"Surcharge"},
 {id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"prayer",t:"Solat"},{id:"flight",t:"Flight & Airport"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},{id:"polisi",t:"Polisi & Payment"},
 {id:"trippix",t:"Gambar Trip Lepas"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(function(ht){var ph=ht.img?('<img src="'+W(ht.img)+'" alt="'+esc(ht.name)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\''+(ht.emoji||"🏨")+'\'">'):(ht.emoji||"🏨");return '<div class="hcard"><div class="ph" style="height:auto;aspect-ratio:1/1">'+ph+'</div><div class="hb"><div class="tier">'+esc(ht.tier)+'</div><div class="hn">'+esc(ht.name)+'</div><div class="hnote">'+esc(ht.note||"")+'</div></div></div>';}).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(function(g){
    return '<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(function(it){
      var n=(typeof it==="string")?it:it.n;
      var img=(it&&typeof it==="object"&&it.img)?it.img:"";
      var inner=img?'<img src="'+W(img)+'" alt="'+esc(n)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=&#39;\u{1F4CD}&#39;">':'\u{1F4CD}';
      return '<div class="actcard"><div class="actim">'+inner+'</div><div class="actname">'+esc(n)+'</div></div>';
    }).join('')+'</div>';
  }).join("");
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  TOPICS.map(function(t){return [t.id,B[t.id]];}).forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){
      const inner=b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,"");
      const h=existing.querySelector("h2");
      if(h)h.insertAdjacentHTML("afterend",inner); else existing.insertAdjacentHTML("afterbegin",inner);
    }
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay){var _hh=renderHotels();var _fq=_stay.querySelector("details.qa");if(_fq)_fq.insertAdjacentHTML("beforebegin",_hh);else _stay.insertAdjacentHTML("beforeend",_hh);}
  var _itin=document.querySelector('.block[data-topic="itin"]');var _acts=renderActs();if(_itin&&_acts){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+_acts);}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=(d.dataset.text||d.textContent||"").toLowerCase().includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});

(function(){

  function sect(k){var v=V();return (v&&v[k])||CFG[k]||{};}
  function PK(){return sect("peak");}
  function EX(){return sect("ext");}

  function DEPO(){var v=V();return (v&&v.deposit!=null)?v.deposit:(CFG.deposit||0);}

  /* ---------- kadar katalog ---------- */
  function tierRow(p){
    var t=V().tiers;
    for(var i=0;i<t.length;i++)if(p>=t[i].from&&p<=t[i].to)return t[i];

  var MTH=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];

  function iso(d){var m=d.getMonth()+1,y=d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y;}
  function parseIso(s){return new Date(s+"T00:00:00");}
  function shift(s,n){var x=parseIso(s);x.setDate(x.getDate()+n);return iso(x);}
  function daysBetween(a,b){return Math.round((parseIso(b)-parseIso(a))/86400000);}
  function todayIso(){return iso(new Date());}
  function dfmt(d){return d.getDate()+" "+MS[d.getMonth()]+" "+d.getFullYear();}

  function winReq(w){return !!(w&&w.length>3&&w[3]==="request");}
  function winVal(w){return winReq(w)?0:((w&&w.length>3&&w[3]!=null)?w[3]:PK().value);}
