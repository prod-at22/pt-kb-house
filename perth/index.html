/* ---- Simple Calculator ---- */

ate</span><input id='c_dep' type='date'><span class='fh'>Hari 1 trip</span></label><label class='fld'><span class='fl'>Return date</span><input id='c_ret' type='date'><span class='fh'>Hari terakhir &mdash; tentukan panjang trip</span></label><label class='fld'><span class='fl'>Adult (12 tahun ke atas)</span><input id='c_adult' type='number' min='0' value='2'></label><label class='fld'><span class='fl'>Child With Bed (5&ndash;11)</span><input id='c_cwb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Child No Bed (2&ndash;4)</span><input id='c_cnb' type='number' min='0' value='0'></label><label class='fld'><span class='fl'>Infant (bawah 2)</span><input id='c_inf' type='number' min='0' value='0'><span class='fh'>FOC &mdash; tiada caj (bawah 2 tahun)</span></label><label class='fld'><span class='fl'>Bilik single</span><input id='c_single' type='number' min='0' value='0'><span class='fh'>Standard +RM 1,500 &middot; Premium +RM 2,500</span></label></div><p class='calcnote' id='c_tier'></p></div><details class='panel' id='p_itin'><summary><span class='tw'>&#9654;</span><span class='pt'>Ubah itinerary</span><span class='psum' id='p_itin_s'></span></summary><div class='pbody'><div class='dbar'><span id='c_bar'></span><button type='button' id='c_expand' class='cbtn cbtn3'>Buka semua</button></div><div id='c_days'></div><div class='cbtns'><button type='button' id='c_addday' class='cbtn'>+ Tambah Hari</button><button type='button' id='c_reload' class='cbtn cbtn2'>Muat semula itinerary asal</button></div><p class='calcnote'>Seret baris hari (&#10303;) untuk susun semula &mdash; nombor hari dan tarikh berubah sendiri. Tambah atau buang hari akan laraskan <b>return date</b>. Pilihan bertanda <i>Termasuk pakej</i> tidak menambah kos.</p></div></details><div class='custblk calcblk'><h3>Ringkasan quotation</h3><table class='ctbl calctbl'><thead><tr><th>Item</th><th>Bil.</th><th>Harga seunit (RM)</th><th>Jumlah (RM)</th></tr></thead><tbody id='c_lines'></tbody></table><div class='ctot'><div><span class='ctl'>Grand Total</span><span class='ctv' id='c_grand'>RM 0</span></div><div><span class='ctl'>Per pax (final, semua kos)</span><span class='ctv' id='c_perpax'>RM 0</span></div><div><span class='ctl'>Deposit</span><span class='ctv' id='c_dep_amt'>RM 0</span></div></div><div class='cbtns'><button type='button' id='c_pdf' class='cbtn'>Jana Quotation PDF</button><button type='button' id='c_reset' class='cbtn cbtn2'>Reset semua</button></div><p class='calcnote'>Quotation dibuka dalam <b>tab baharu</b> mengikut format rasmi ARBA &mdash; dari situ tekan <b>Muat turun PDF</b> untuk simpan fail.</p></div>","surcharge":"<h2>Surcaj &amp; Peak Season</h2><p class='ssub'>Semua kadar ikut katalog PT Perth v3 (jadual Surcharge - Accommodation Upgrade &amp; Peak Season). Surcaj peak dikira atas harga pakej.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Bila / Nota</th></tr></thead><tbody><tr><td class='it'>Peak — Autumn &amp; Winter</td><td class='add'>3★ Apartment +RM 80 · 3★ Hotel +RM 120 · 4★ Mercure +RM 220 · 5★ Duxton +RM 250 (per pax / malam)</td><td>19–31 Mac 2026 · 1–20 April 2026 · 1–15 Julai 2026 · 19–31 Ogos 2026</td></tr><tr><td class='it'>Peak — Spring &amp; Summer</td><td class='add'>+5% per pax</td><td>1–30 September 2026 · 1–30 November 2026 · 1–20 Disember 2026</td></tr><tr><td class='it'>Peak — Christmas &amp; New Year</td><td class='add'>+10% per pax</td><td>21–31 Disember 2026 · 1–31 Januari 2027 · 1–20 Februari 2027</td></tr><tr><td class='it'>Single supplement — Standard</td><td class='add'>+RM 1,500 / pax</td><td>Single occupancy sepanjang trip</td></tr><tr><td class='it'>Single supplement — Premium</td><td class='add'>+RM 2,500 / pax</td><td>Single occupancy sepanjang trip</td></tr><tr><td class='it'>Upgrade Standard → 3★ Hotel</td><td class='add'>Criterion +RM 180 · European +RM 200 (per pax / malam)</td><td>Kedua-duanya tiada breakfast</td></tr><tr><td class='it'>Upgrade Standard → 4★ Hotel</td><td class='add'>+RM 300 / pax / malam</td><td>Mercure On Hay atau seumpama, termasuk breakfast</td></tr><tr><td class='it'>Upgrade Premium → 5★ Hotel</td><td class='add'>+RM 350 / pax / malam</td><td>Duxton Hotel, breakfast halal tersedia</td></tr><tr><td class='it'>Late booking</td><td class='add'>+RM 50 / booking</td><td>Booking kurang 45 hari sebelum departure (per booking, bukan per pax)</td></tr><tr><td class='it'>Extra hour transport &amp; guide</td><td class='add'>AUD 50 / jam</td><td>Selepas jam tour dalam itinerari. Bayar tunai kepada driver</td></tr><tr><td class='it'>Airport transfer lewat malam</td><td class='add'>AUD 50 / jam</td><td>Ketibaan atau pulang 10:01 malam – 5:59 pagi. Dikenakan sebelum ketibaan</td></tr></tbody></table></div><div class='custblk' style='margin-top:14px'><h3 style='margin:0 0 6px'>Add-on Travel Date 2027</h3><table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Travel date 1 Jan – 30 Jun 2027</td><td class='add'>+RM 100 / pax</td><td>Ditambah di atas harga pakej dan surcaj peak. Sumber: rate card ARBA 2026/2027 — tiada dalam katalog</td></tr><tr><td class='it'>Late booking — 2 pax ke atas</td><td class='add'>+RM 50 / pax</td><td>By request. Sumber: rate card ARBA 2026/2027 — tiada dalam katalog</td></tr></tbody></table></div>","transport":"<h2>Transportation & Guide</h2><p class='ssub'>Private transport operator K&N (Perth specialist) — tiada share coach. Tour 8–10 jam sehari ikut itinerari. Extra hour AUD 50/jam bayar tunai kepada driver.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Pax</th><th>Kenderaan</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>2–4 pax</td><td>6-Seater (kereta / van kecil)</td><td>Driver-cum-guide (English speaking, K&N)</td></tr><tr><td class='it'>5–12 pax</td><td>12-Seater Hiace</td><td>Standard untuk kebanyakan booking</td></tr><tr><td class='it'>13+ pax</td><td>24-Seater Bus</td><td>Group besar</td></tr></tbody></table></div><p class='ssub' style='margin-top:10px'>Standard: 2x airport transfer + 2x tour 8 jam (Day 2 & 4), Day 3 tiada transport. Premium: 2x airport transfer + tour 6–10 jam bergantung hari. Airport transfer termasuk 06:00–22:00; luar waktu itu ada surcaj midnight.</p>","stay":"<h2>Accommodation</h2><p class='ssub'>Hotel ikut tier & pakej. Standard = apartment 3★ (bukan CBD, kitchenette, 1 bilik air). Premium = hotel 4★ CBD dengan breakfast halal-friendly. Bilik: 2 pax twin · 3 pax triple · 4 pax quad · 5 pax quint · 6 pax 2× triple. Lokasi apartment/hotel dikonfirmasi 15 hari sebelum departure.</p>","freegift":"<h2>Free Gift (Promo)</h2><details class='qa' data-text='free gift untuk campaign atau promo? perth: free lobster lunch kod: fper3 (all pax) bullet: brb luggage tag / pocket wifi 4g (per booking) *bullet wajib tanya po/leader disclaimer: sila sahkan dengan po jika di luar waktu promo.'><summary><span class='tw'>▶</span><span>Free Gift untuk campaign atau promo?</span></summary><div class='ans'><p><strong>Perth:</strong> Free Lobster Lunch <span style='background:var(--green);border:none;color:#fff;font-weight:800;font-size:11px;border-radius:999px;padding:3px 11px'>Kod: FPER3</span> (All pax)</p><p><strong>Bullet:</strong> BRB Luggage Tag / Pocket Wifi 4G (per booking)</p><p style='color:var(--greend)'>*Bullet wajib tanya PO/Leader</p><p style='color:var(--greend)'><strong>Disclaimer:</strong> Sila sahkan dengan PO jika di luar waktu Promo.</p></div></details>","flight":"<h2>Flight &amp; Airport</h2><p class='ssub'>Tiket flight tidak termasuk dalam pakej. Direct KUL–PER ~5 jam 35 minit, tiada beza zon waktu (Perth AWST = UTC+8, sama dengan Malaysia).</p><div class='custblk'><table class='ctbl'><thead><tr><th>Airline</th><th>Leg</th><th>Flight</th><th>Berlepas</th><th>Tiba</th><th>Hari</th><th>Anggaran return</th></tr></thead><tbody><tr><td class='it'>AirAsia X</td><td>KUL → PER</td><td>AK 606</td><td>14:15</td><td>19:50</td><td>Harian</td> **Late booking** &lt;45 hari: +RM 50/booking. Peak season surcaj ikut musim & hotel tier (lihat tab Surcaj).\n- **Final itinerari** dikonfirmasi 14 hari sebelum trip; lokasi apartment/hotel 15 hari sebelum departure.\n- **Airport transfer** termasuk 06:00–22:00. Tiba/pulang 10:01 malam–5:59 pagi kena surcaj AUD 50/jam (bayar tunai). Check-in hotel biasanya ~12 tengah hari — jika perlu early check-in, tambah 1 malam.\n- **Extra hour transport** AUD 50/jam bayar TUNAI kepada driver.\n- **Pinnacles & Lancelin (PREM Day 5):** permukaan tidak rata & berhabuk, perjalanan ~2 jam sehala — kurang sesuai warga emas / anak kecil.\n- **Passport** sah minimum 6 bulan. Immigration Australia ketat.\n- Umur dikira ikut **tarikh travel**: Adult 12+, Child w/Bed 5–11, Child no Bed 2–4, Infant &lt;2 (FOC).\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Apa beza Standard 5D4N dengan Premium 6D5N?**\nStandard: apartment 3★ (bukan CBD, kitchenette), 2 hari tour (Swan Valley + Fremantle) + 1 hari Free & Easy, 2x lunch halal, Caversham included. Premium: hotel 4★ CBD dengan breakfast, driver-cum-guide sepanjang trip, tambah Mandurah Dolphin Cruise + Pinnacles Desert + Lancelin Sand Dunes, 4x breakfast + 3x lunch halal.\n\n**Pakej ni rushing tak?**\nTidak rushing. Standard ada 1 hari Free & Easy (Day 3). Premium ada half-day F&E (Day 2 petang). Tour 6–10 jam sehari dengan stop rehat untuk solat. Nota: Pinnacles Day (PREM Day 5) 10 jam, agak panjang untuk warga emas.\n\n**Pakej ni ada tourist trap / compulsory shopping tak?**\nTiada. ARBA tidak include mana-mana compulsory shopping atau tourist trap. Semua tempat dalam itinerari adalah genuine sightseeing/experience.\n\n**Boleh bawa personal stop / request sendiri?**\nBoleh untuk private tour. Bincang dengan Travel Consultant sebelum trip atau on-the-spot dengan driver.\n\n**Sesuai ke untuk family & kanak-kanak?**\nSangat sesuai. Caversham Wildlife Park (kangaroo feeding, koala) family-favourite, Mandurah Cruise child-friendly, Kings Park ada playground. Elak Pinnacles/Lancelin untuk toddler.\n\n**Sesuai untuk warga emas / yang tak boleh jalan jauh?**\nSesuai, cuma elak Pinnacles (long drive + permukaan tidak rata). Kings Park (PREM) ada laluan wheelchair. Maklumkan Travel Consultant awal untuk kenderaan sesuai.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal senang dapat di Perth?**\nYa. Perth ada ramai penduduk Muslim (~50,000+) & banyak restoran halal bersijil — Melayu, Indonesia, Indian Muslim, Middle Eastern, Halal Chinese. Kebanyakan buka ~10 pagi ke atas.\n\n**Kita akan makan apa dalam pakej?**\nStandard (2x lunch): Day 2 Charcoal Chicken (halal), Day 4 Kailis Fish & Chips Fremantle (halal-friendly). Premium (4x breakfast + 3x lunch): breakfast hotel halal-friendly + Charcoal Chicken, Kailis, dan Fish & Chips Pinnacles. Dinner semua hari TIDAK termasuk — explore restoran halal Perth.\n\n**Breakfast macam mana?**\nStandard: masak sendiri di apartment (kitchenette — telur, mi segera, cereal) atau restoran halal (~buka 10 pagi). Premium: breakfast buffet hotel halal-friendly (roti, cereal, pastri, vegetarian, buah, jus).\n\n**Ada masjid/surau untuk solat?**\nYa. Solat time-blocked di masjid pada Day 2 & Day 4 (Standard), dan surau Watertown pada Premium Day 4. Ada Masjid Perth (William St, Northbridge) & masjid di Fremantle. Untuk tempat outdoor (Pinnacles, Cottesloe, Rottnest) — bawa sejadah & solat di rest stop.\n\n### C. Visa & Passport\n\n**Perlu visa ke Australia?**\nYa — ETA Australia (Subclass 601), dimohon online/app rasmi (~AUD 20). Multiple entry setahun, tinggal hingga 3 bulan setiap lawatan. ARBA cadang mohon 90 hari (3 bulan) sebelum trip. Biasanya diluluskan dalam beberapa hari–2 minggu.\n\n**ARBA bantu proses visa?**\nYa, ARBA boleh bantu proses ETA untuk Warganegara Malaysia (service fee mungkin apply). Non-Malaysian perlu arrange visa sendiri.\n\n**Passport perlu sah berapa lama?**\nMinimum 6 bulan dari tarikh berlepas. Immigration Australia ketat.\n\n### D. Flight & Airport\n\n**Kita naik flight apa?**\nFlight tidak termasuk (customer self-arrange, ARBA boleh bantu book). Pilihan direct KUL–PER: Malaysia Airlines (premium, ~5j 35min, bagasi 25–30kg, in-flight meal), AirAsia X (kos efektif, bagasi 20kg add-on), Batik Air. ~4 penerbangan direct sehari.\n\n**Berapa lama flight & ada transit tak?**\nDirect, tiada transit. Masa penerbangan ~5 jam 35 minit KUL–PER.\n\n**Berapa kg bagasi?**\nPremium airlines: 25–30kg (MH Economy 25kg). AirAsia X: 20kg add-on. Semak dengan airline.\n\n**Boleh combine dengan flight domestik Australia (Sydney/Melbourne)?**\nBoleh — bincang Travel Consultant untuk domestic flight + connecting itinerary. Semak validity trip sebelum book connecting flight.\n\n### E. Hotel & Bilik\n\n**Hotel apa digunakan?**\nStandard: Apartment 3★ (Comfort Inn & Suites / Good Health) — bukan CBD, kitchenette, 1 bilik air/unit. Premium: Hotel 4★ (Mercure On Hay / Mercure Perth / Ibis Perth) di CBD dengan breakfast halal-friendly. Upgrade tersedia (3★ Hotel CBD, 4★, atau 5★ Duxton).\n\n**Bilik macam mana?**\n2 pax twin · 3 pax triple · 4 pax quad · 5 pax quint · 6 pax 2× triple. Apartment Quad/Quint kongsi 1 tandas — jika tak selesa, tukar double/triple. Single occupancy tambah single supplement.\n\n**Boleh book multiple hotels untuk pengalaman berbeza?**\nBoleh, tapi ARBA cadang satu hotel untuk minimize check-in/out & pergerakan luggage. Multi-hotel via Travel Consultant (extra cost mungkin apply).\n\n### F. Cuaca & Musim\n\n**Musim & cuaca Perth macam mana? Bila terbaik?**\n4 musim: Summer (Dis–Feb) 18–32°C kadang >40°C; Autumn (Mac–Mei) 13–26°C; Winter (Jun–Ogos) 8–19°C, lebih hujan; Spring (Sep–Nov) 11–25°C, paling mild + Tulip Festival. Terbaik: Spring untuk tulip & cuaca sederhana; Summer untuk beach & fruit picking.\n\n**Mesti nampak salji ke kalau pergi musim sejuk?**\nTiada salji di bandar Perth. Winter sejuk tapi tak salji. Untuk salji perlu custom ke Ski Resort (Bluff Knoll / Stirling Range) — extra cost & hari.\n\n### G. Shopping & Duit\n\n**Beli apa & di mana?**\nWatertown Factory Outlets & DFO — Adidas, Nike, Cotton On, Levi's, Tommy Hilfiger, Coach Factory. Fremantle Market untuk produk segar & souvenir. Shopping ~1.5–3 jam.\n\n**Cadangan cash & cara bayar?**\nBawa cash RM 1,500–3,000/pax untuk personal expenses, add-on & souvenir. Kedai kecil/market: cash AUD. Shopping centre/hotel/restoran: kad (Visa/MC) & mobile pay (Apple/Google Pay) diterima meluas. ATM tersedia.\n\n### H. Payment & Refund\n\n### I. Add-ons & Customization\n\n**Apa add-on popular?**\nMandurah Dolphin Cruise (RM 180/adult — included dalam PREM), Pinnacles Day Tour (RM 3,800/transport untuk STD), Araluen Tulip Park (RM 85, seasonal Ogos–Okt), Rottnest Ferry (RM 350), Sand Board Lancelin (RM 80), Fruit Picking (RM 80, seasonal), Pocket Wifi (RM 150) / eSIM (RM 95), extra night, extra meal, takaful.\n\n**Boleh extend stay?**\nBoleh. Extra night 4★ Mercure RM 350/pax/malam, 3★ Apartment RM 200/pax/malam. Bincang Travel Consultant.\n\n### J. Kesihatan & Keselamatan\n\n**Pinnacles Desert berbahaya untuk warga emas / kanak-kanak?**\nPinnacles & Lancelin Sand Dunes kurang sesuai warga emas/anak kecil sebab permukaan longgar & tidak rata (risiko tergelincir/terseliuh). Walking ~30–45 minit. Bawa kasut sukan/hiking, topi, sunblock.\n\n**Ada precaution kesihatan?**\nPerth bukan altitud tinggi — tiada altitude sickness. Summer boleh >40°C (hydrate); Winter sejuk (bawa jaket). UV Australia kuat — sunblock SPF30+.\n\n### K. Praktikal (SIM, Socket, Internet)\n\n**Adapter plug & voltan?**\nAustralia guna Type I (3-pin bersudut), 230V/50Hz. Bawa universal travel adapter (perlu untuk laptop/hairdryer walaupun ada USB port di hotel).\n\n**Internet macam mana? Boleh roaming?**\nPilihan: Pocket Wifi RoamingMan (RM 150/trip, 3GB, kongsi 5 device), eSIM Australia (RM 95/7 hari, 5GB), roaming telco MY (paling mahal), atau Wifi hotel percuma. Tiada sekatan VPN — Google, FB, IG, YouTube, WhatsApp semua berfungsi.\n\n**Ada service dobi/laundry?**\nLaundry tidak termasuk pakej. Apartment Standard ada washing machine (free). Ada laundromat di CBD. Laundry hotel mahal (~AUD 5–10/item).\n\n### L. Packing\n\n**Apa patut bawa?**\nKasut selesa untuk berjalan (kasut hiking untuk Pinnacles/Lancelin), jaket (angin kuat di pantai & winter sejuk), topi & sunblock SPF30+, sejadah/telekung untuk solat outdoor, universal adapter, dan cash AUD untuk market. Pakaian sopan untuk pantai.\n"}</script>

function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(ht=>`<div class="hcard">${ht.img?`<div class="ph"><img loading="lazy" referrerpolicy="no-referrer" src="${W(ht.img)}" alt="${esc(ht.name)}" onerror="this.parentNode.remove()"></div>`:""}<div class="hb"><div class="tier">${esc(ht.tier)}</div><div class="hn">${esc(ht.name)}</div><div class="hnote">${esc(ht.note||"")}</div></div></div>`).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(g=>'<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(it=>{const n=(typeof it==="string")?it:it.n;const im=(it&&typeof it==="object"&&it.img)?it.img:"";return `<div class="actcard"><div class="actim">${im?`<img loading="lazy" referrerpolicy="no-referrer" src="${W(im)}" alt="${esc(n)}" onerror="this.parentNode.textContent='📍'">`:"📍"}</div><div class="actname">${esc(n)}</div></div>`;}).join('')+'</div>').join('');
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  TOPICS.map(function(t){return [t.id,B[t.id]];}).forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){
      const inner=b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,"");
      const h=existing.querySelector("h2");
      if(h)h.insertAdjacentHTML("afterend",inner); else existing.insertAdjacentHTML("afterbegin",inner);
    }
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');
  if(_stay){var _hh=renderHotels();var _fq=_stay.querySelector("details.qa");
  if(_fq)_fq.insertAdjacentHTML("beforebegin",_hh); else _stay.insertAdjacentHTML("beforeend",_hh);}
  var _itin=document.querySelector('.block[data-topic="itin"]');
  var _acts=renderActs();
  if(_itin&&_acts){var _h2=_itin.querySelector("h2");
  if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+_acts);}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=(d.dataset.text||d.textContent||"").toLowerCase().includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);

  function iso(d){var m=d.getMonth()+1,y=d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y;}
  function parseIso(s){return new Date(s+"T00:00:00");}
  function shift(s,n){var x=parseIso(s);x.setDate(x.getDate()+n);return iso(x);}
  function daysBetween(a,b){return Math.round((parseIso(b)-parseIso(a))/86400000);}
  function todayIso(){return iso(new Date());}
  function dfmt(d){return d.getDate()+" "+MS[d.getMonth()]+" "+d.getFullYear();}
  function eshort(d){return d.getDate()+" "+ENS[d.getMonth()];}
  function elong(d){return d.getDate()+" "+EN[d.getMonth()]+" "+d.getFullYear();}
  function within(ds,r){return ds>=r[0]&&ds<=r[1];}

  /* peak: sokong dua model — RM per pax per malam, atau peratus atas harga pakej */
  function peakWindowsFor(){
    var w=PK().windows||[];
    return w.filter(function(x){return !x[2]||x[2]===V().id;});
  }
  /* Elemen ke-4 tetingkap (pilihan) = nilai khusus tetingkap itu; kalau tiada,
     PK().value digunakan. Ini menyokong destinasi yang ada lebih daripada satu
     kadar peak (contoh Hokkaido: +10% biasa, +15% Christmas & New Year). */
  function winVal(w){return (w&&w.length>3&&w[3]!=null)?w[3]:PK().value;}
  function inPeak(ds){
    var w=peakWindowsFor(),hit=null;
    /* kalau tetingkap bertindih (contoh 20 Dis ada dalam dua tetingkap Hokkaido),
       ambil yang paling tinggi supaya keputusan tidak bergantung pada susunan */
    for(var i=0;i<w.length;i++)if(within(ds,w[i])&&(!hit||winVal(w[i])>winVal(hit)))hit=w[i];
    return hit;
  }

  /* ---------- pilihan dropdown ---------- */
  var ACC=CFG.accOptions||[
    {v:"incl",t:"Hotel (termasuk pakej)",cost:"incl"},
    {v:"extra",t:"Hotel (malam tambahan)",cost:"night"},
    {v:"none",t:"Tiada malam (checkout / balik)",cost:"zero"}];
  var MEAL=CFG.mealOptions||[
    {v:"none",t:"None",b:0,l:0,d:0,lbl:"-"},
    {v:"b",t:"Breakfast",b:1,l:0,d:0,lbl:"International Breakfast"},
    {v:"bl",t:"Breakfast & Lunch",b:1,l:1,d:0,lbl:"International Breakfast, Lunch"},
    {v:"bd",t:"Breakfast & Dinner",b:1,l:0,d:1,lbl:"International Breakfast, Dinner"},
    {v:"bld",t:"Breakfast, Lunch & Dinner",b:1,l:1,d:1,lbl:"International Breakfast, Lunch, Dinner"},
    {v:"ld",t:"Lunch & Dinner",b:0,l:1,d:1,lbl:"Lunch, Dinner"},
    {v:"l",t:"Lunch",b:0,l:1,d:0,lbl:"Lunch"},
    {v:"d",t:"Dinner",b:0,l:0,d:1,lbl:"Dinner"}];
  var TRP=CFG.trpOptions||[
    {v:"incl",t:"Private Transport + Guide (termasuk)",cost:"incl",lbl:"Private Transport + Guide"},
    {v:"air",t:"Airport Transfer + Guide (termasuk)",cost:"incl",lbl:"Airport Transfer + Guide"},
    {v:"ext",t:"Private Transport + Guide (extension)",cost:"day",lbl:"Private Transport + Guide"},
    {v:"none",t:"Tiada transport (free & easy)",cost:"zero",lbl:"-"}];
  var GENERIC=[
    {v:"fe",t:"Free & Easy",acc:"incl",meal:"b",trp:"none",act:["Free & easy"],
     en:"FREE & EASY",eact:["Free & easy"]},
    {v:"ext",t:"Extension - hari tambahan",acc:"extra",meal:"b",trp:"ext",
     act:["Itinerari tambahan mengikut permintaan customer"],
     en:"EXTENSION DAY",eact:["Itinerary as requested by customer"]},
    {v:"cus",t:"Custom (tulis sendiri)",acc:"incl",meal:"b",trp:"incl",act:[],en:"CUSTOM",eact:[]}];
  /* Perpustakaan blok itinerary (pilihan). Ia muncul dalam dropdown hari tetapi
     BUKAN sebahagian itinerari default — loadDefault() hanya ambil V().itin.
     Guna untuk destinasi yang ada pustaka blok hari rasmi (contoh Korea ProdReq 9). */
  function library(){return V().library||CFG.library||[];}
  function presets(){
    return V().itin.map(function(p,i){
      var o={};for(var k in p)o[k]=p[k];o.v=o.v||("d"+(i+1));return o;
    }).concat(library()).concat(GENERIC);
  }
  /* Senarai untuk DROPDOWN sahaja - presets() kekal penuh supaya find() tidak pernah
     gagal menyelesaikan satu preset yang masih dirujuk oleh hari yang ada.
     - dedupe ikut `v`: blok pustaka yang guna `v` sama dengan GENERIC (contoh "ext")
       dulu muncul DUA KALI dalam dropdown. Yang pertama menang, sama seperti find().
     - CFG.hideGeneric: senarai `v` GENERIC yang disembunyikan bagi destinasi yang
       kosnya tidak boleh dijamin (contoh Turki: "ext" dan "cus" - hari tanpa segmen
       rate card tidak boleh diberi harga, jadi TC mesti pilih blok segmen). */
  function dropdownPresets(){
    var hide=CFG.hideGeneric||[],seen={},out=[];
    presets().forEach(function(o){
      if(seen[o.v])return;
      seen[o.v]=1;
      if(hide.indexOf(o.v)>=0&&GENERIC.some(function(g){return g.v===o.v;})
         &&!library().some(function(l){return l.v===o.v;}))return;
      out.push(o);
    });
    return out;
  }
  /* Kawasan hari ini — kunci untuk cari kadar transport yang betul.
     Sandaran kepada `baseRegion`, iaitu kawasan hari PAKEJ asal pada slot itu:
     bila hari berpandu ditukar kepada blok tanpa kawasan (contoh Free & Easy),
     tolakan mesti tetap ikut kawasan hari yang dilepaskan (ProdReq 8.6 - Nami
     -RM1,200 berbanding Seoul -RM1,000), bukan jatuh ke kadar _default. */
  function dayRegion(d){
    var pr=find(presets(),d.preset);
    return (pr&&pr.region)||(d&&d.baseRegion)||"";
  }
  var ADDONS=[["-",0,0]].concat(CFG.addons||[]);
  /* Kuantiti optional activity diisi sendiri ikut pax, supaya TC tidak perlu taip
     nombor yang enjin sudah tahu. Elemen ke-4 add-on menentukan asasnya:
        "pax" (atau tiada)  -> ikut bilangan pax (dewasa / kanak-kanak)
        "unit" / "share"    -> satu unit (kos per transport / per hari, bukan per pax)
     Opt-in melalui CFG.autoAddonQty supaya config destinasi lain tidak berubah. */
  function addonBasis(i){var q=ADDONS[i];return (q&&q[3])||"pax";}
  function autoQty(a){
    if(!CFG.autoAddonQty||!a.auto||!a.i)return;
    if(addonBasis(a.i)==="pax"){
      a.qa=n("c_adult");
      a.qc=ADDONS[a.i][2]?(n("c_cwb")+n("c_cnb")):0;
    }else{a.qa=1;a.qc=0;}
  }
  function syncAutoQty(){days.forEach(function(d){d.addons.forEach(autoQty);});}

  /* ---------- util ---------- */
  var CUR=CFG.currency||"RM";
  function rm(v){return CUR+" "+(Math.round(v*100)/100).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function rm0(v){return CUR+" "+Math.round(v).toLocaleString("en-MY");}
  function n(id){var e=$c(id);var v=e?parseFloat(e.value):0;return isNaN(v)?0:v;}
  function esc2(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function find(arr,v){for(var i=0;i<arr.length;i++)if(arr[i].v===v)return arr[i];return arr[0];}
  function opts(arr,sel){return arr.map(function(o){
    return "<option value='"+o.v+"'"+(o.v===sel?" selected":"")+">"+o.t+"</option>";}).join("");}
  /* sama seperti opts() tetapi kumpulkan mengikut medan `g` — untuk pustaka blok
     itinerary yang panjang, supaya dropdown boleh dilayari ikut bandar/tema */
  function optsG(arr,sel){
    var out="",open=false,cur=null;
    for(var i=0;i<arr.length;i++){
      var o=arr[i],g=o.g||"";
      if(g!==cur){
        if(open){out+="</optgroup>";open=false;}
        if(g){out+="<optgroup label='"+esc2(g)+"'>";open=true;}
        cur=g;
      }
      out+="<option value='"+o.v+"'"+(o.v===sel?" selected":"")+">"+o.t+"</option>";
    }
    if(open)out+="</optgroup>";
    return out;
  }
  /* amaun bertanda — pilihan boleh menolak dari harga katalog, jadi jangan andai '+' */
  function sgn(v){return (v<0?"-":"+")+rm0(Math.abs(v));}
  /* Label pilihan untuk SATU hari: awalan kawasan hari itu + amaun sebenar yang akan
     dikenakan. Tujuannya supaya TC nampak kos itu berlabuh pada blok itinerary yang
     dipilih (contoh "[Nami] Private Transport ... - RM 1,400"), bukan angka generik. */
  function optsFor(arr,sel,reg,kind){
    return arr.map(function(o){
      var lbl=(reg&&kind==="trp"&&(o.guided||o.cost==="day")?reg+" ":"")+o.t,bits=[];
      if(kind==="trp"&&o.cost==="day"){
        var dr=dayRateFor(reg);
        bits.push(dr.amt?rm0(dr.amt):"kadar belum diisi");
      }
      if(kind==="acc"&&o.cost==="night"){
        var nr=accNightRate(o,reg);
        bits.push(nr?rm0(nr)+" per pax":"kadar belum diisi");
      }
      if(kind==="meal"){var ma=mealAmt(o);if(ma)bits.push(sgn(ma)+" per pax");}
      var a=optAmt(o,reg);
      if(a.unitPax)bits.push(sgn(a.unitPax)+" per pax");
      if(a.unitVeh)bits.push(sgn(a.unitVeh));
      if(a.gap&&!bits.length)bits.push("kadar belum diisi");
      if(bits.length)lbl+=" &mdash; "+bits.join(" &middot; ");
      return "<option value='"+o.v+"'"+(o.v===sel?" selected":"")+">"+lbl+"</option>";
    }).join("");
  }
  function addonOpts(sel){return ADDONS.map(function(a,i){
    return "<option value='"+i+"'"+(i===sel?" selected":"")+">"+a[0]+(a[1]?" ("+rm0(a[1])+")":"")+"</option>";}).join("");}

  /* ---------- model hari ---------- */
  var days=[],state={},dragFrom=null;
  /* Hari yang TC tambah sendiri ditanda `ext:true`. Bezanya penting: harga katalog
     sudah termasuk hari berpandu + malam pakej, jadi hari PAKEJ mesti kekal 'termasuk'
     walau apa pun blok itinerary yang dipilih. Hanya hari tambahan yang berkos.
     CFG.extDefaults = {acc:"...", trp:"..."} menetapkan pilihan mana yang dipakai
     bila satu blok 'termasuk' diletak pada hari tambahan. */
  var EXTD=CFG.extDefaults||{};
  /* Tukar blok itinerary = enjin pilih sendiri pilihan transport/hotel yang betul.
     Keputusan bergantung pada PERALIHAN, bukan sekadar sama ada hari itu tambahan:

       hari sudah berpandu  + blok berpandu     -> kekal 'termasuk pakej' (swap, RM 0)
       hari tiada transport + blok berpandu     -> hari berpandu tambahan  -> berkos
       hari sudah berpandu  + blok tanpa guide  -> tolak dari katalog (ProdReq 8.6)
       hari tambahan (ext)  + apa-apa blok      -> sentiasa berkos

     TC masih boleh menimpa mana-mana pilihan selepas itu. */
  /* Pilihan yang sudah menanggung kosnya sendiri — auto-substitusi tidak boleh
     menimpanya, sebab config sengaja memilih pilihan itu untuk blok tersebut. */
  function hasOwnCost(o){
    return !!(o.perPax||o.perVehicle||o.perPaxRate||o.perVehicleRate);
  }
  function applyPreset(d,pr){
    var oldTrp=find(TRP,d.trp);
    var wasGuided=!!oldTrp.guided,               /* hari berpandu (pakej atau tambahan) */
        wasExt=oldTrp.cost==="day",              /* sudah ditanda hari tambahan berkos  */
        wasDrop=!!EXTD.trpDrop&&oldTrp.v===EXTD.trpDrop;  /* sudah ditanda tolak        */
    d.preset=pr.v;d.acc=pr.acc;d.meal=pr.meal;d.trp=pr.trp;
    var newAcc=find(ACC,pr.acc),newTrp=find(TRP,pr.trp);
    if(d.ext){
      if(EXTD.acc&&newAcc.cost==="incl")d.acc=EXTD.acc;
      if(EXTD.trp&&newTrp.cost==="incl")d.trp=EXTD.trp;
      return;
    }
    /* Jadi hari tambahan berkos bila pakej tiada transport untuk hari ini, ATAU bila
       hari ini sudah ditanda tambahan sebelum ini (tukar blok lagi jangan hilangkan kos). */
    if(EXTD.trp&&newTrp.guided&&newTrp.cost==="incl"&&(!wasGuided||wasExt))d.trp=EXTD.trp;
    /* Kekalkan tolakan bila hari berpandu pakej ditukar kepada blok tanpa guide —
       KECUALI blok itu sendiri sudah bawa kos (contoh KTX / flight pindah bandar),
       kerana pilihannya sendiri yang betul, bukan pilihan tolakan. */
    else if(EXTD.trpDrop&&!newTrp.guided&&newTrp.cost==="zero"&&!hasOwnCost(newTrp)
            &&(wasGuided||wasDrop))
      d.trp=EXTD.trpDrop;
  }
  function mkDay(p,isExt,baseRegion){
    var pr=find(presets(),p||"ext");
    var d={preset:pr.v,custom:"",date:"",acc:pr.acc,meal:pr.meal,trp:pr.trp,
           ext:!!isExt,baseRegion:baseRegion||"",
           addons:[{i:0,qa:0,qc:0,auto:false}],open:false};
    applyPreset(d,pr);
    return d;
  }
  function loadDefault(){
    days=presets().slice(0,V().itin.length).map(function(p){return mkDay(p.v,false,p.region);});
  }
  function lastIdx(){return days.length-1;}
  function autoDates(){var dep=$c("c_dep").value;days.forEach(function(d,i){d.date=dep?shift(dep,i):"";});}
  function syncReturn(){var dep=$c("c_dep").value;if(dep)$c("c_ret").value=shift(dep,days.length-1);}
  function syncDaysToDates(){
    var dep=$c("c_dep").value,ret=$c("c_ret").value;
    if(!dep||!ret)return;
    var target=daysBetween(dep,ret)+1;
    if(target<2||target>60){syncReturn();return;}
    while(days.length<target)days.splice(Math.max(1,lastIdx()),0,mkDay("ext",true));
    while(days.length>target&&days.length>2)days.splice(Math.max(1,lastIdx()-1),1);
    autoDates();
  }

  /* ---------- kadar bergantung musim ---------- */
  function payPax(){return n("c_adult")+n("c_cwb")+n("c_cnb");}
  function vehicles(){return Math.max(1,Math.ceil((payPax()||1)/(EX().paxPerVehicle||7)));}
  function isPeakTrip(){return (state.season&&state.season.peakNights)>0;}
  /* Kadar extension boleh datang dalam dua bentuk:
       ext.night / ext.day        -> satu pasang {normal,peak} untuk semua saiz group
       ext.nightTiers / dayTiers  -> [{from,to,normal,peak}] bila kadar ikut bilangan pax
                                     (contoh NZ: transport RM2300 untuk 2-3 pax, RM3600 untuk 7-10)
     Padanan tier ikut julat PERTAMA yang muat, sama seperti tierRow(), jadi julat
     bertindih dalam rate sheet (2-3, 3-4, 4-5 ...) berkelakuan seperti bracket kapasiti. */
  function extTier(list,p){
    for(var i=0;i<list.length;i++)if(p>=list[i].from&&p<=list[i].to)return list[i];
    return p<list[0].from?list[0]:list[list.length-1];
  }
  function extRate(flat,tiers){
    var r=(tiers&&tiers.length)?extTier(tiers,payPax()||1):(flat||{normal:0,peak:0});
    return isPeakTrip()?(r.peak||0):(r.normal||0);
  }
  function nightRate(){var e=EX();return extRate(e.night,e.nightTiers);}
  /* Pilihan accommodation boleh bawa `nightRate` (kunci ext.rates) kalau malam
     tambahannya ada kadar tersiar sendiri — contoh malam 4 bintang RM400 (ProdReq 7),
     bukan malam 3 bintang RM250 campur upgrade. Kalau tiada, ext.night dipakai. */
  function accNightRate(o,region){
    if(o&&o.nightRate){var a=rateAmt(o.nightRate,region);return a==null?0:a;}
    return nightRate();
  }
  /* ---------- breakfast ikut varian ----------
     Sesetengah pakej memang sudah termasuk breakfast hotel dan sesetengah tidak
     (Perth: Standard 3 bintang apartment tanpa breakfast, Premium 4 bintang hotel
     dengan breakfast). Blok itinerary DIKONGSI antara varian, jadi blok yang
     membawa breakfast akan menjanjikan breakfast yang tidak dijual bila dipilih
     pada varian Standard -- dan menjatuhkannya bila blok tanpa breakfast dipilih
     pada Premium. `variants[].breakfast` memaksa komponen breakfast mengikut
     varian supaya TC tidak perlu fikir, dan mealDelta kekal neutral kerana
     baseline dan pilihan semasa kedua-duanya dinormalkan oleh mealOf().
     Pilihan bertanda `bfLock` dikecualikan -- guna untuk hari ketibaan, yang tiada
     breakfast pada mana-mana varian. Tanpa `variants[].breakfast`, mealOf() pulang
     pilihan itu sendiri, jadi config destinasi lain tidak berubah sama sekali. */
  function bfOn(){var v=V();return (v&&v.breakfast!=null)?!!v.breakfast:null;}
  function mealOf(key){
    var o=find(MEAL,key),on=bfOn();
    if(on===null||!o||o.bfLock)return o;
    var c={},k;for(k in o)c[k]=o[k];
    c.b=on?1:0;
    var parts=String(o.lbl==null?"":o.lbl).split(", ").filter(function(x){
      return x&&x!=="-"&&!/breakfast/i.test(x);});
    if(on)parts.unshift(CFG.breakfastLabel||"Hotel Breakfast");
    c.lbl=parts.length?parts.join(", "):"-";
    return c;
  }
  function mealRate(){return CFG.meals||{lunch:0,dinner:0};}
  /* Bilangan hidangan satu pilihan meal (breakfast + lunch + dinner). */
  function mealCount(o){return o?((o.b?1:0)+(o.l?1:0)+(o.d?1:0)):0;}
  /* CFG.mealDelta = {add, drop} - kadar per pax PER HIDANGAN bila TC menambah atau
     membuang hidangan berbanding apa yang blok itinerary itu sendiri isytiharkan.
     Ini menyelesaikan dua masalah sekaligus:
       - CFG.meals mengenakan SETIAP lunch/dinner dalam itinerari, termasuk yang sudah
         ada dalam harga katalog -> double-count. Sebab itu ia diset 0.
       - Tetapi dengan 0, menukar dropdown meal jadi PERCUMA secara senyap.
     Delta berbanding blok menyelesaikan kedua-duanya: tiada perubahan = RM 0, dan
     setiap hidangan yang ditambah/dibuang dicaj pada kadarnya sendiri (tidak simetri:
     tambah RM45, tolak RM30). Baseline ialah `meal` blok itu, bukan indeks hari, jadi
     ia kekal betul walaupun hari disusun semula atau ditambah. */
  function mealDeltaOf(d,pr,pay){
    var md=CFG.mealDelta;if(!md)return null;
    var basen=mealCount(mealOf((pr&&pr.meal)||d.meal)),
        curn=mealCount(mealOf(d.meal)),dn=curn-basen;
    if(!dn)return null;
    var per=dn>0?dn*(md.add||0):dn*(md.drop||0);
    return {meals:dn,perPax:per,total:per*(pay||0)};
  }
  /* Kos makan satu hari untuk satu pax, ikut pilihan meal yang dipilih. */
  function mealAmt(o){var m=mealRate();
    return (o.l||0)*(m.lunch||0)+(o.d||0)*(m.dinner||0);}
  /* Hint yang menyebut kadar sebenar, bukan "ikut kadar makan" yang kabur. */
  function mealHint(o){
    var m=mealRate(),b=[];
    if(o.l&&m.lunch)b.push(o.l+" lunch x "+rm0(m.lunch));
    if(o.d&&m.dinner)b.push(o.d+" dinner x "+rm0(m.dinner));
    if(b.length)return b.join(" + ")+" = "+sgn(mealAmt(o))+" per pax";
    if(o.l||o.d)return "Kadar makan belum diisi &mdash; untuk paparan quotation sahaja";
    return "";
  }
  /* Hari "berpandu" = hari yang ada transport + guide (pilihan bertanda guided:true).
     `free` = berpandu tetapi dikira sebagai bahagian pakej (cost incl);
     `paid` = berpandu tetapi dicaj sebagai hari tambahan (cost day). */
  function guidedOf(list){
    var free=0,paid=0;
    list.forEach(function(x){
      var o=find(TRP,x.trp);
      if(!o||!o.guided)return;
      if(o.cost==="day")paid++;else free++;
    });
    return {free:free,paid:paid,total:free+paid};
  }
  function guidedBase(){return guidedOf(V().itin||[]);}

  /* ---------- kadar berkunci: kunci -> region -> band pax -> normal/peak ----------
     ext.rates = { kunci: { "<region>"|"_default": [{from,to,normal,peak}] } }
     Satu mekanisme untuk semua kadar yang bergantung pada kawasan itinerary, saiz
     group dan musim. Pulang null bila kunci/region/band tiada dalam sumber — pemanggil
     menandakannya sebagai 'kadar belum diisi' supaya TC nampak, bukan diam-diam free. */
  function rateAmt(key,region){
    var m=(EX().rates||{})[key];
    if(!m)return null;
    var list=(region&&m[region])||m._default;
    if(!list||!list.length)return null;
    var b=extTier(list,payPax()||1);
    var a=isPeakTrip()?(b.peak!=null?b.peak:b.normal):b.normal;
    return (a==null)?null:a;
  }
  /* Kadar hari extension. Kalau config ada ext.rates.day, ia MENGGANTIKAN ext.day —
     tiada fallback senyap, sebab region tanpa kadar tersiar mesti kelihatan sebagai gap. */
  /* Adakah destinasi ini memang ada kadar ikut kawasan? Destinasi tanpa ProdReq
     (contoh Switzerland) hanya ada `_default`, jadi menyuruh TC "pilih blok supaya
     kadar ikut kawasan" mengelirukan — tiada blok yang akan mengubahnya. */
  function hasRegions(){
    var m=(EX().rates||{}).day;
    if(!m)return false;
    for(var k in m)if(Object.prototype.hasOwnProperty.call(m,k)&&k!=="_default")return true;
    return false;
  }
  function dayRateFor(region){
    var e=EX();
    if(e.rates&&e.rates.day){var a=rateAmt("day",region);return{amt:a||0,gap:!a};}
    var f=extRate(e.day,e.dayTiers);return{amt:f,gap:!f};
  }
  function dayRate(region){return dayRateFor(region).amt;}
  /* Apa yang satu pilihan dropdown tambah (atau tolak) untuk satu hari.
     perPax / perVehicle = nombor literal; perPaxRate / perVehicleRate = kunci ext.rates. */
  function optAmt(o,region){
    var perPax=0,perVeh=0,gap=false;
    /* perVehicleQty: berapa kali kos per-kenderaan itu berlaku dalam SATU hari.
       Contoh pindah bandar perlu 2 transfer (hotel->stesen, stesen->hotel). */
    var vq=(o.perVehicleQty!=null)?o.perVehicleQty:1;
    if(o.perPax!=null)perPax+=o.perPax;
    if(o.perVehicle!=null)perVeh+=o.perVehicle*vq;
    if(o.perPaxRate){var a=rateAmt(o.perPaxRate,region);if(!a)gap=true;perPax+=a||0;}
    if(o.perVehicleRate){var b=rateAmt(o.perVehicleRate,region);if(!b)gap=true;perVeh+=(b||0)*vq;}
    return {unitPax:perPax,unitVeh:perVeh,
            pax:perPax*payPax(),veh:perVeh*vehicles(),gap:gap};
  }
  /* label Inggeris untuk baris quotation; `t` kekal Melayu untuk UI KB */
  function optLine(o){return o.line||o.t;}

  function dayParts(d){
    var pay=payPax(),mr=mealRate(),reg=dayRegion(d);
    var pr=find(presets(),d.preset);
    var ml=mealOf(d.meal),tp=find(TRP,d.trp),ac=find(ACC,d.acc),c=0,gap=false;
    /* Setiap tambah/tolak dikumpul sebagai satu entri supaya baris hari boleh
       memaparkannya satu-persatu - TC perlu tahu item mana sudah ditolak, bukan
       sekadar satu jumlah bersih. `scope:"trip"` = amaun itu dikira di peringkat
       keseluruhan trip (bukan hari), jadi ia dipapar sebagai maklumat sahaja dan
       TIDAK ditambah ke dalam kos hari (elak kira dua kali). */
    var adj=[];
    function A(label,amt,scope){if(amt)adj.push({label:label,amt:amt,scope:scope||"day"});}
    /* Malam tambahan yang kadarnya datang dari `nightRate` boleh tiada kadar tersiar
       untuk kawasan/musim itu (contoh NZ: rate sheet hanya ada lajur peak). Itu satu
       gap, bukan malam percuma - tandakannya seperti gap kadar transport. */
    if(ac.cost==="night"){var _nr=accNightRate(ac,reg);c+=_nr*pay;
      A("Malam tambahan "+rm0(_nr)+"/pax",_nr*pay);
      if(ac.nightRate&&!_nr)gap=true;}
    var mfix=(ml.l*mr.lunch+ml.d*mr.dinner)*pay;
    c+=mfix; A("Meal",mfix);
    /* delta meal berbanding blok - inilah yang membuat dropdown meal tidak lagi percuma */
    var mdl=mealDeltaOf(d,pr,pay);
    if(mdl){c+=mdl.total;
      A((mdl.meals>0?"Tambah ":"Tolak ")+Math.abs(mdl.meals)+" meal "+
        sgn(mdl.perPax)+"/pax",mdl.total);}
    if(tp.cost==="day"){var dr=dayRateFor(reg);c+=dr.amt*vehicles();
      A("Transport"+(reg?" "+reg:""),dr.amt*vehicles());if(dr.gap)gap=true;}
    [ac,ml,tp].forEach(function(o){var a=optAmt(o,reg);c+=a.pax+a.veh;
      if(a.pax)A(optLine(o)+" "+sgn(a.pax/(pay||1))+"/pax",a.pax);
      if(a.veh)A(optLine(o),a.veh);
      if(a.gap)gap=true;});
    /* Tolakan malam yang ditanggung di peringkat trip (pilihan dropsNight). Ia TIDAK
       masuk kos hari, tetapi mesti kelihatan pada hari itu - kalau tidak baris hari
       tulis "Termasuk" sedangkan grand total turun. */
    if(ac.dropsNight){
      var ns=rateAmt("nightShort","");
      if(ns)adj.push({label:"Tolak 1 malam pakej "+sgn(ns)+"/pax",amt:ns*pay,scope:"trip"});
    }
    d.addons.forEach(function(a){var q=ADDONS[a.i];
      if(!a.i)return;
      var at=a.qa*q[1]+a.qc*(q[2]||0);c+=at;A(q[0],at);});
    return {cost:c,gap:gap,region:reg,adj:adj};
  }
  function dayCost(d){return dayParts(d).cost;}

  function renderDays(){$c("c_days").innerHTML=days.map(dayHtml).join("");}

  /* ---------- kiraan ---------- */
  function compute(){
    syncAutoQty();
    var v=V(),mr=mealRate();
    var ad=n("c_adult"),cwb=n("c_cwb"),cnb=n("c_cnb"),inf=n("c_inf");
    var pay=ad+cwb+cnb,t=tierOf(pay||v.tiers[0].from),dep=$c("c_dep").value||"";

    var nights=0,extraNights=0,nightAdd=0,extraDayCount=0,mealsL=0,mealsD=0,transfers=0,nightDates=[];
    /* kos peringkat pilihan dikumpul di sini: per pax dilipat ke harga per pax,
       per kenderaan jadi baris sendiri dalam ringkasan (kedua-dua boleh negatif) */
    var optPax={},optVeh={},extAgg={},anyGap=false,selfDrop=0;
    days.forEach(function(d){
      var ac=find(ACC,d.acc),ml=mealOf(d.meal),tp=find(TRP,d.trp),reg=dayRegion(d);
      if(ac.cost!=="zero"){nights++;if(d.date)nightDates.push(d.date);}
      if(ac.cost==="night"){extraNights++;var _n=accNightRate(ac,reg);nightAdd+=_n;
        if(ac.nightRate&&!_n)anyGap=true;}
      /* Pilihan yang menanggung tolakan malamnya sendiri (contoh 'tanpa hotel')
         tidak boleh dikira lagi oleh pelarasan malam automatik di bawah. */
      if(ac.dropsNight)selfDrop++;
      if(ml.l)mealsL++;
      if(ml.d)mealsD++;
      if(tp.cost!=="zero")transfers++;
      if(tp.cost==="day"){
        extraDayCount++;
        var dr=dayRateFor(reg);if(dr.gap)anyGap=true;
        /* kumpul ikut kawasan DAN kadar: satu baris per kawasan supaya quotation
           menunjukkan hari mana ikut kadar mana (Nami 1,400 vs Seoul 1,200) */
        if(dr.amt){var ek=reg+"|"+dr.amt;
          extAgg[ek]=extAgg[ek]||{region:reg,amt:dr.amt,days:0};extAgg[ek].days++;}
      }
      [ac,ml,tp].forEach(function(o){
        var a=optAmt(o,reg);if(a.gap)anyGap=true;
        /* Kunci kumpulan mesti termasuk amaun: pilihan yang SAMA boleh beri kadar
           berbeza ikut kawasan (contoh tolak driving guide -1,000 Seoul vs -1,200 Nami),
           jadi kumpul ikut label+amaun supaya setiap kadar jadi baris sendiri. */
        if(a.unitPax){var kp=optLine(o)+"|"+a.unitPax;
          optPax[kp]=optPax[kp]||{label:optLine(o),unit:a.unitPax,days:0};optPax[kp].days++;}
        if(a.unitVeh){var kv=optLine(o)+"|"+a.unitVeh;
          optVeh[kv]=optVeh[kv]||{label:optLine(o),unit:a.unitVeh,days:0};optVeh[kv].days++;}
      });
    });
    var peakNights=0,peakHit=null,peakPct=0,peakAmt=0;
    nightDates.forEach(function(ds){var w=inPeak(ds);if(!w)return;
      peakNights++;var pv=winVal(w)||0;peakAmt+=pv;
      if(pv>peakPct){peakPct=pv;peakHit=w;}
      peakHit=peakHit||w;});
    var lead=dep?daysBetween(todayIso(),dep):null;
    var lb=CFG.lateBooking||{lt:45,amount:0};
    var lm=v.lastMinute||CFG.lastMinute;
    var isLate=lb.amount>0&&lead!==null&&lead<lb.lt&&lead>=0;
    var isLast=!!lm&&lead!==null&&lead<lm.lt&&lead>=0;
    state.season={peakNights:peakNights,nightsDated:nightDates.length,lead:lead,
                  isLate:isLate,isLast:isLast,noDate:!dep,window:peakHit};

    /* Senarai pelarasan yang sudah dilipat ke harga per pax. Dua bahasa: `my`
       untuk baris nota dalam KB, `en` untuk ringkasan quotation customer. */
    var pp=0,sur=[];
    /* `amt` = amaun per pax yang baris ini menyumbang. Ia dipakai untuk membina
       breakdown itemised di bawah jadual ringkasan, supaya TC boleh audit harga
       per pax baris demi baris. Baris tanpa amaun (nota sahaja) hantar null. */
    function addSur(my,en,amt){sur.push({my:my,en:en,amt:(amt==null?null:amt)});}
    if(peakNights){
      var pk=PK();
      if(pk.mode==="percent"){
        /* peratus dikenakan sekali sahaja - guna kadar tertinggi antara tetingkap yang kena */
        var add=Math.round(t[0]*peakPct/100);
        pp+=add;addSur("Peak Season +"+peakPct+"% ("+rm0(add)+")",
                       "Peak season surcharge "+peakPct+"% ("+rm0(add)+" per pax)",add);
      }else{
        pp+=peakAmt;
        addSur("Peak Season "+peakNights+"/"+nights+" malam +"+rm0(peakAmt),
               "Peak season surcharge, "+peakNights+" of "+nights+" nights ("+
               rm0(peakAmt)+" per pax)",peakAmt);
      }
    }
    (CFG.extraSurcharge||[]).forEach(function(x){
      if(x.variants&&x.variants.indexOf(v.id)<0)return;
      if(x.dateIn&&!(dep&&within(dep,x.dateIn)))return;
      var amt=x.perPax||0;
      if(x.percentOfTier)amt=Math.round(t[0]*x.percentOfTier/100);
      if(amt){pp+=amt;addSur(x.label+" +"+rm0(amt),x.label+" ("+rm0(amt)+" per pax)",amt);}
    });
    if(isLast){var a=(pay<=2?lm.rate2:lm.rate3);pp+=a;
      addSur("Last minute +"+rm0(a),"Last minute booking surcharge ("+rm0(a)+" per pax)",a);}
    var mealAdd=mealsL*mr.lunch+mealsD*mr.dinner;
    pp+=mealAdd;
    if(mealAdd)addSur("Meal "+mealsL+" lunch + "+mealsD+" dinner "+sgn(mealAdd)+" per pax",
                      mealsL+" lunch + "+mealsD+" dinner ("+sgn(mealAdd)+" per pax)",mealAdd);
    /* Delta meal berbanding blok itinerary - tambah dan tolak ada kadar berbeza,
       jadi ia dijumlah berasingan supaya breakdown menunjukkan kedua-duanya. */
    if(CFG.mealDelta){
      var mUp=0,mDn=0,mUpN=0,mDnN=0;
      days.forEach(function(x){
        var md=mealDeltaOf(x,find(presets(),x.preset),1);
        if(!md)return;
        if(md.meals>0){mUpN+=md.meals;mUp+=md.perPax;}else{mDnN+=-md.meals;mDn+=md.perPax;}
      });
      if(mUp){pp+=mUp;addSur("Tambah "+mUpN+" meal "+sgn(mUp)+" per pax",
        mUpN+" additional meal"+(mUpN>1?"s":"")+" ("+sgn(mUp)+" per pax)",mUp);}
      if(mDn){pp+=mDn;addSur("Tolak "+mDnN+" meal dari pakej "+sgn(mDn)+" per pax",
        mDnN+" meal"+(mDnN>1?"s":"")+" removed from package ("+sgn(mDn)+" per pax)",mDn);}
    }
    /* ---- malam berbanding baseline pakej ----
       ext.autoNights: delta dikira terus daripada itinerari yang dibina, jadi tambah
       atau buang hari terus betul tanpa TC perlu tanda 'malam tambahan' sendiri.
       Tanpa autoNights: kekal seperti dulu (extraNights daripada pilihan acc 'night'),
       supaya config destinasi lain tidak berubah kelakuan. */
    var base=v.nights||0,autoN=!!EX().autoNights;
    /* autoNights: bilangan malam mesti datang daripada PANJANG PERJALANAN
       (n hari = n-1 malam), bukan daripada bilangan hari yang pilihan acc-nya
       berbayar. Kalau dikira dari pilihan acc, satu hari yang bawa acc "none"
       (contoh salin hari checkout, atau blok hari berlepas diletak di tengah
       trip) menghasilkan 9 hari / 7 malam — transport dicaj tetapi hotel tidak.
       Malam yang TC buang dengan sengaja dikira melalui `selfDrop`. */
    var tripN=autoN?Math.max(0,days.length-1-selfDrop):0;
    var overN=autoN?Math.max(0,tripN-base):extraNights;
    var shortN=autoN?Math.max(0,base-tripN)
                    :Math.max(0,base-(nights-extraNights)-selfDrop);
    /* autoNights guna satu kadar rata; model eksplisit jumlahkan kadar setiap
       malam tambahan, sebab pilihan berbeza boleh ada kadar berbeza (3* vs 4*). */
    var nightSum=autoN?(overN*nightRate()):nightAdd;
    if(nightSum){
      pp+=nightSum;
      addSur("Malam tambahan "+overN+" "+sgn(nightSum)+" per pax",
             overN+" additional night"+(overN>1?"s":"")+" ("+sgn(nightSum)+" per pax)",nightSum);
    }
    if(shortN){var srt=rateAmt("nightShort","");
      if(srt){pp+=shortN*srt;
        addSur("Buang "+shortN+" malam pakej "+sgn(shortN*srt),
               shortN+" package night"+(shortN>1?"s":"")+" removed ("+sgn(shortN*srt)+" per pax)",
               shortN*srt);}}
    state.overNights=overN;state.shortNights=shortN;
    state.tripNights=autoN?tripN:null;state.accNights=nights;state.selfDrop=selfDrop;
    Object.keys(optPax).forEach(function(k){
      var o=optPax[k],amt=o.unit*o.days;
      pp+=amt;
      addSur(o.label+" "+sgn(amt)+(o.days>1?" ("+o.days+" hari)":""),
             o.label+(o.days>1?" x "+o.days+" days":"")+" ("+sgn(amt)+" per pax)",amt);
    });
    var em=EX().marginPerPax||0;
    if((overN||extraDayCount)&&em){pp+=em;
      addSur("Margin extension "+sgn(em)+" per pax",
             "Extension margin ("+sgn(em)+" per pax)",em);}

    /* ext.shareVehicle: kos per kenderaan ialah kos yang DIKONGSI satu group, jadi ia
       dibahagi dengan bilangan pax berbayar dan dilipat ke harga per pax, bukan berdiri
       sebagai baris sendiri. Tanpa flag ini kelakuan kekal seperti dulu (baris asing),
       supaya config destinasi sedia ada tidak berubah. */
    var veh=vehicles(),shareVeh=!!EX().shareVehicle,shareTot=0,shareAddon=0;
    /* Add-on dengan elemen ke-4 "share" ialah kos satu kenderaan / satu group,
       jadi ia dikongsi sama rata antara pax berbayar, bukan didarab dengan pax. */
    var agg={};
    days.forEach(function(d){d.addons.forEach(function(a){
      if(!a.i)return;var q=ADDONS[a.i];
      if(q[3]==="share"){shareAddon+=a.qa*q[1]+a.qc*(q[2]||0);return;}
      if(a.qa){var k1=q[0]+" (adult)";agg[k1]=agg[k1]||{u:q[1],q:0};agg[k1].q+=a.qa;}
      if(a.qc&&q[2]){var k2=q[0]+" (child)";agg[k2]=agg[k2]||{u:q[2],q:0};agg[k2].q+=a.qc;}
    });});
    /* Kos dikongsi diitemise: satu baris per kawasan / per pilihan, bukan satu
       lump "Kos dikongsi". Sebabnya bila kos per kenderaan diprorate ke harga per
       pax, ia hilang daripada jadual baris — jadi atribusi segmen ("hari mana ikut
       kadar mana") mesti hidup dalam breakdown, kalau tidak TC tidak dapat mengaudit
       harga akhir. Jumlahnya sama sahaja; hanya pecahannya kelihatan. */
    function addShare(label,line,tot){
      if(!tot||!pay)return;
      shareTot+=tot;pp+=tot/pay;
      /* Jumlah kumpulan diletak DALAM label supaya ia kekal selepas amaun per pax
         dipotong untuk lajur kanan breakdown - TC nampak RM12,300 / 9 pax, bukan
         hanya hasil bahaginya. */
      addSur(label.replace(/\)$/,", "+rm0(tot)+" / "+pay+" pax)")+" "+sgn(tot/pay)+" per pax",
             line+" ("+sgn(tot)+" / "+pay+" pax = "+sgn(tot/pay)+" per pax)",tot/pay);
    }
    if(shareVeh){
      Object.keys(extAgg).sort(function(a,b){return extAgg[b].amt-extAgg[a].amt;})
        .forEach(function(k){var x=extAgg[k];
          var d1=x.days+(x.days>1?" hari":" hari"),v1=veh+(veh>1?" kenderaan":" kenderaan");
          addShare("Transport"+(x.region?" "+x.region:"")+" ("+d1+" x "+v1+")",
                   "Transport extension"+(x.region?" "+x.region:"")+" ("+x.days+
                     (x.days>1?" days":" day")+" x "+veh+(veh>1?" vehicles":" vehicle")+")",
                   x.days*veh*x.amt);});
      Object.keys(optVeh).forEach(function(k){var o=optVeh[k];
        addShare(o.label+" ("+o.days+" hari x "+veh+" kenderaan)",
                 o.label+" ("+o.days+(o.days>1?" days":" day")+")",
                 o.days*veh*o.unit);});
    }
    /* add-on asas "share" (kos per transport/per group) dikumpul di atas */
    if(shareAddon&&pay){
      pp+=shareAddon/pay;shareTot+=shareAddon;
      addSur("Add-on dikongsi "+sgn(shareAddon)+" / "+pay+" pax = "+sgn(shareAddon/pay)+" per pax",
             "Shared add-on "+sgn(shareAddon)+" / "+pay+" pax ("+sgn(shareAddon/pay)+" per pax)",
             shareAddon/pay);
    }

    var lines=[];
    if(ad)lines.push({k:"Adult (Twin Share)",q:ad,u:t[0]+pp});
    if(cwb)lines.push({k:v.labelCwb||"Child With Bed",q:cwb,u:t[1]+pp});
    if(cnb)lines.push({k:v.labelCnb||"Child No Bed",q:cnb,u:t[2]+pp});
    if(inf&&v.infant)lines.push({k:"Infant (below 2 years)",q:inf,u:v.infant});
    var sg=n("c_single");
    /* single supplement boleh flat per pax (single) atau ikut malam (singlePerNight),
       contoh Hokkaido RM 300 semalam - ia terus melaras bila malam ditambah/dibuang */
    var sgRate=v.singlePerNight?(v.singlePerNight*nights):(v.single||0);
    if(sg&&sgRate)lines.push({k:"Single supplement",q:sg,u:sgRate});
    if(isLate)lines.push({k:"Late booking (less than "+lb.lt+" days)",q:1,u:lb.amount});
    /* Hari extension dikumpul ikut kadar — satu baris kalau semua kawasan sama kadar,
       berpecah kalau berbeza (contoh Seoul RM1,200 vs outskirt Nami RM1,400). */
    if(!shareVeh){
      Object.keys(extAgg).sort(function(a,b){return extAgg[b].amt-extAgg[a].amt;}).forEach(function(k){
        var x=extAgg[k];
        lines.push({k:"Transport extension"+(x.region?" "+x.region:"")+" ("+x.days+
          (x.days>1?" days":" day")+" x "+veh+(veh>1?" vehicles":" vehicle")+")",
          q:x.days*veh,u:x.amt});
      });
      Object.keys(optVeh).forEach(function(k){
        var o=optVeh[k];
        lines.push({k:o.label+" ("+o.days+(o.days>1?" days":" day")+")",q:o.days*veh,u:o.unit});
      });
    }

    Object.keys(agg).forEach(function(k){lines.push({k:k,q:agg[k].q,u:agg[k].u});});

    var grand=0;lines.forEach(function(l){grand+=l.q*l.u;});
    /* Prorata: kos yang BUKAN per-pax (transport per kenderaan, optional activity,
       single supplement, infant, late booking) dibahagi bilangan pax berbayar,
       supaya harga per pax yang dipapar ialah harga final sebenar. */
    var paxRowKeys=["Adult (Twin Share)",v.labelCwb||"Child With Bed",v.labelCnb||"Child No Bed"];
    var paxRowTotal=0;
    lines.forEach(function(l){if(paxRowKeys.indexOf(l.k)>=0)paxRowTotal+=l.q*l.u;});
    state.otherTotal=grand-paxRowTotal;
    state.otherPerPax=pay?(state.otherTotal/pay):0;
    state.finalPerPax=pay?(grand/pay):0;
    state.lines=lines;state.grand=grand;state.pay=pay;state.tier=t;state.pp=pp;state.sur=sur;
    state.nights=nights;state.days=days.length;state.mealsL=mealsL;state.mealsD=mealsD;
    state.transfers=transfers;state.extraNights=extraNights;state.extraDays=extraDayCount;
    state.nightAdd=nightAdd;
    state.guided=guidedOf(days);state.guidedBase=guidedBase();
    state.gap=anyGap;
    /* Bilangan hari yang masih pada placeholder mustPick - kosnya belum ditetapkan. */
    state.mustPick=days.filter(function(d){
      var pr=find(presets(),d.preset);return pr&&pr.mustPick;}).length;
    state.paxNotes=(CFG.paxNotes||[]).filter(function(x){
      return pay>=(x.from||0)&&pay<=(x.to||99999);}).map(function(x){return x.text;});
    return{lines:lines,grand:grand,pay:pay,ad:ad};
  }

  function renderPanel(){

      return d.preset===("d"+(i+1))||d.preset===(v.itin[i]&&v.itin[i].v);});
    psum("p_itin",std?(v.days+"H"+v.nights+"M standard"):
      (days.length+" hari · "+state.nights+" malam"+(extra?" · "+sgn(extra):"")));

      g.free+"/"+gb.free+"</b> dalam pakej"+(g.paid?" + "+g.paid+" tambahan":"")):"";
    $c("c_bar").innerHTML="<b>"+days.length+" hari</b> · "+state.nights+" malam"+gtxt+" · "+
      (state.mealsL+state.mealsD)+" meal · pelarasan <b>"+

  function render(keepDays){
    var r=compute();
    if(!keepDays)renderDays();
    var s=state.season||{},v=V(),note;
    if(!r.pay)note="Isi bilangan pax untuk lihat tier katalog.";
    else{
      note="Tier katalog <b>"+tierLabel(r.pay)+"</b> · asas adult <b>"+rm(state.tier[0])+"</b> per pax";
      /* Pelarasan yang tidak bergantung tarikh (malam tambahan, tolak dari katalog,
         upgrade hotel) mesti kelihatan walaupun departure date belum diisi — dulu
         seluruh senarai tersembunyi sampai tarikh dimasukkan. */
      if(s.noDate){
        if(state.sur.length)note+=" · pelarasan: "+state.sur.map(function(x){return x.my;}).join(", ");
        note+=" · harga per pax <b>"+rm(state.tier[0]+state.pp)+"</b>";
        note+=" · isi <b>departure date</b> untuk kesan peak season.";
      }else{
        note+=" · "+(s.peakNights?"<b>Peak Season</b>":"<b>Normal Season</b>");
        if(state.sur.length)note+=" · surcharge: "+state.sur.map(function(x){return x.my;}).join(", ");
        if(s.isLate)note+=", late booking +"+rm0((CFG.lateBooking||{}).amount||0)+" satu booking";
        note+=" · harga per pax <b>"+rm(state.tier[0]+state.pp)+"</b>";
      }
      if(overMax(r.pay))note+=" · melebihi "+maxPax()+" pax (tier tertinggi katalog), sahkan kadar dengan operator.";
      /* Bila bilangan hari berpandu tidak sama dengan pakej, beritahu TC dengan tepat.
         Enjin tidak caj sendiri — TC yang tandakan hari mana tambahan / mana ditolak. */
      var g=state.guided||{},gb=state.guidedBase||{};
      if(g.free>gb.free)
        note+=" &middot; <b>perhatian:</b> "+g.free+" hari berpandu ditanda <i>termasuk pakej</i> "+
              "tetapi pakej hanya ada "+gb.free+" &mdash; tukar hari lebihan kepada "+
              "<i>hari tambahan</i> supaya kosnya masuk.";

        note+=" &middot; <b>perhatian:</b> hanya "+g.free+" hari berpandu berbanding "+gb.free+
              " dalam pakej &mdash; guna pilihan <i>tolak driving guide</i> kalau nak tolak dari katalog.";
      (state.paxNotes||[]).forEach(function(x){note+=" &middot; "+x;});
      if(state.mustPick)note+=" &middot; <b>amaran:</b> "+state.mustPick+" hari masih belum "+
        "dipilih bloknya &mdash; kos transport hari itu <b>belum ditetapkan</b>. Pilih satu blok "+
        "segmen rate card (Day Tour / Pemanduan Antara Bandar / Transfer) sebelum quote.";
      if(state.gap)note+=" &middot; <b>amaran:</b> ada hari yang kadarnya tiada dalam sumber &mdash; sahkan dengan operator sebelum quote.";
    }
    $c("c_tier").innerHTML=note;
    var tb=$c("c_lines");
    tb.innerHTML=r.lines.length?r.lines.map(function(l){
      return "<tr><td class='it'>"+esc2(l.k)+"</td><td>"+l.q+"</td><td>"+rm(l.u)+"</td><td class='add'>"+rm(l.q*l.u)+"</td></tr>";
    }).join(""):"<tr><td colspan='4' style='color:var(--muted)'>Isi bilangan pax untuk mula.</td></tr>";
    /* ---- breakdown itemised harga per pax ----
       Setiap pelarasan yang dilipat ke harga per pax dipapar sebagai barisnya
       sendiri, bermula dari tier katalog dan berakhir pada harga per pax akhir.
       Kos per kenderaan / per group (transport, guide) sudah diprorate ikut pax
       bila `ext.shareVehicle` dihidupkan, jadi jumlah bawah = harga sebenar
       seorang adult. Tujuannya supaya TC boleh audit angka itu baris demi baris
       tanpa mengira sendiri. */
    var ie=$c("c_incl");
    if(!ie){
      var tbl=tb.closest("table");
      if(tbl){ie=document.createElement("div");ie.id="c_incl";ie.className="calcincl";
        tbl.parentNode.insertBefore(ie,tbl.nextSibling);}
    }
    if(ie){
      var sr=(state.sur||[]);
      if(!r.pay||!state.tier){ie.innerHTML="";ie.style.display="none";}
      else{
        var brk="<table class='calcbrk'><tbody>";
        brk+="<tr><td class='it'>Harga katalog "+esc2(tierLabel(r.pay))+
             " (adult)</td><td class='add'>"+rm(state.tier[0])+"</td></tr>";
        var noted=[];
        sr.forEach(function(x){
          if(x.amt==null){noted.push(x.my);return;}
          brk+="<tr><td class='it'>"+esc2(x.my.replace(/\s*(?:[-+]\s*RM|\(RM)\s*[\d,.].*$/,"").trim()||x.my)+
               "</td><td class='add"+(x.amt<0?" dded":"")+"'>"+sgn(x.amt)+"</td></tr>";
        });
        brk+="<tr class='brks'><td class='it'>Harga pakej per pax (adult)</td>"+
             "<td class='add'>"+rm(state.tier[0]+state.pp)+"</td></tr>";
        /* Kos bukan per-pax diprorate supaya angka akhir benar-benar per orang. */
        if(Math.abs(state.otherTotal)>0.005){
          brk+="<tr><td class='it'>Kos bukan per-pax (transport, optional activity, "+
               "single, infant, late booking)<br><span class='brkn'>"+
               sgn(state.otherTotal)+" &divide; "+r.pay+" pax berbayar</span></td>"+
               "<td class='add"+(state.otherPerPax<0?" dded":"")+"'>"+
               sgn(state.otherPerPax)+"</td></tr>";
        }
        brk+="<tr class='brkt'><td class='it'><b>Harga final per pax</b>"+
             (r.ad&&(n("c_cwb")||n("c_cnb"))?"<br><span class='brkn'>purata semua pax "+
              "berbayar &mdash; adult, CWB dan CNB ada harga katalog berbeza</span>":"")+
             "</td><td class='add'><b>"+rm(state.finalPerPax)+"</b></td></tr>";
        brk+="</tbody></table>";
        var extra=[];
        extra.push("Semua kos di atas sudah masuk dalam <b>harga final per pax</b>. "+
          (EX().shareVehicle
            ?("Kos per kenderaan (transport, guide) sudah dibahagi "+r.pay+
              " pax berbayar dan dilipat ke harga per pax, jadi ia tidak muncul "+
              "sebagai baris berasingan dalam jadual ringkasan.")
            :("Baris dalam jadual ringkasan kekal ikut format quotation ARBA "+
              "(adult / CWB / CNB pada harga katalog, kos per kenderaan sebagai "+
              "baris sendiri).")));
        if(state.season&&state.season.isLate)extra.push("Late booking dicaj "+
          "<b>sekali satu booking</b> &mdash; dalam harga final ia dibahagi antara pax.");
        ie.innerHTML="<p class='brkh'><b>Breakdown harga per pax</b></p>"+brk+
          (noted.length?"<p class='brkn'>"+noted.map(esc2).join(" &middot; ")+"</p>":"")+
          (extra.length?"<p class='brkn'>"+extra.join(" &middot; ")+"</p>":"");
        ie.style.display="";
      }
    }
    $c("c_grand").textContent=rm(r.grand);
    /* Tile ini dulu hanya mengulang harga baris adult, jadi ia tidak mengira
       add-on dan kos per kenderaan. Sekarang ia harga final selepas semuanya. */
    $c("c_perpax").textContent=rm(state.finalPerPax||0);
    $c("c_dep_amt").textContent=rm(DEPO()*r.pay);
    renderPanel();
  }

  function moveDay(from,to){

      var pr=find(presets(),e.target.value);

  $c("c_days").addEventListener("click",function(e){
    var btn=e.target.closest("button");if(!btn)return;
    var i=dayIdx(btn);if(i<0)return;
    e.preventDefault();e.stopPropagation();syncOpen();
    if(btn.classList.contains("d-up")){moveDay(i,i-1);return;}
    if(btn.classList.contains("d-down")){moveDay(i,i+1);return;}
    if(btn.classList.contains("d-del")){if(days.length>2){days.splice(i,1);autoDates();syncReturn();}}
    else if(btn.classList.contains("d-dup")){
      var cp=JSON.parse(JSON.stringify(days[i]));
      cp.ext=true;applyPreset(cp,find(presets(),cp.preset));
      days.splice(i+1,0,cp);autoDates();syncReturn();}
    else if(btn.classList.contains("d-aoadd")){days[i].addons.push({i:0,qa:0,qc:0,auto:false});days[i].open=true;}
    else if(btn.classList.contains("d-aodel")){

      days[i].addons.splice(ai,1);
