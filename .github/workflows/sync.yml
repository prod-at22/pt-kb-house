name: Sync KB dari repo destinasi
on:
  schedule:
    - cron: "15 * * * *"   # setiap jam
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/sync.sh && python3 .github/scripts/backlink.py
      - name: Commit jika ada perubahan
        run: |
          git config user.name "kb-house-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync KB dari repo destinasi"; git push; }
