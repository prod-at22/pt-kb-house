# Mirror of the PT R&D Costing Hub (prod-at22/rnd-hub) — the source of every KB's content and
# Simple Calculator numbers (hub: data/kb/<slug>.json, builder kb-build/build.py). The page itself (layout,
# engine, travel map) and the images (<slug>/assets.json) stay here. The hub's Save starts this workflow
# (workflow_dispatch); the schedule is only a fallback. Every KB is rebuilt (the build only rewrites the
# data blocks, so an unchanged KB stays byte-identical), then the nav bar and the hub page are refreshed —
# a push made by this workflow does not start nav.yml, so it runs those scripts itself.
# Before committing, kb-build/verify.py checks every page against the hub (prices, itinerary, includes /
# excludes, calculator tiers, hotels) and kb-build/smoke.js opens each page in jsdom; a failure stops the mirror
# (nothing is published, GitHub emails the failure) — fix the hub data or the builder, then Run workflow again.
# "Run workflow" mirrors at once (slugs = rebuild just those, empty = all).
name: Mirror from PT R&D Costing Hub
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Rebuild only these KBs (space-separated); empty = all"
        type: string
        default: ""
permissions: { contents: write }
concurrency: nav
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: prod-at22/rnd-hub, path: _hub, fetch-depth: 0 }
      - name: What changed in the hub
        id: pick
        run: |
          new=$(git -C _hub log -1 --format=%H -- data/kb data/data.json data/catalogs kb-build catalog-build/hub_data.py)
          last=$(cat .hub-sha 2>/dev/null || true)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$last" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "up to date ($new)"; exit 0
          fi
          echo "run=yes" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.pick.outputs.run == 'yes'
        run: |
          python3 _hub/kb-build/build.py . ${{ inputs.slugs }}
          python3 .github/scripts/backlink.py
          python3 .github/scripts/build_hub.py
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.run == 'yes'
        with: { node-version: "22" }
      - name: Verify (nothing is published unless every KB matches the hub)
        if: steps.pick.outputs.run == 'yes'
        run: |
          python3 _hub/kb-build/verify.py .
          npm i --prefix "$RUNNER_TEMP/js" --no-save --silent jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/js/node_modules" node _hub/kb-build/smoke.js .
      - name: Commit
        if: steps.pick.outputs.run == 'yes'
        run: |
          echo "${{ steps.pick.outputs.new }}" > .hub-sha
          git config user.name "PT R&D Costing Hub"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # _hub/ is in .gitignore
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -q -m "Mirror from PT R&D Costing Hub ${{ steps.pick.outputs.new }}"
          git push
